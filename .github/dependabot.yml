version: 2

# One PR for the Home Assistant release: the docker image tag (.github/ha-versions/ha/Dockerfile)
# and pytest-homeassistant (requirements_test.txt) are versioned alike and tests/ha/test_versions.py
# fails when only one of them moves. A plain `groups:` cannot span ecosystems; a multi-ecosystem
# group can (GitHub docs, "Configuring multi-ecosystem updates": top-level `multi-ecosystem-groups`,
# each member sets `multi-ecosystem-group` and a required `patterns`). UNVERIFIED on a live
# Dependabot run: check that the first HA bump arrives as one PR touching both files.
multi-ecosystem-groups:
  home-assistant:
    schedule:
      interval: weekly

updates:
  # Keep GitHub Actions (uses: ...) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keep the YAML tooling's Python dependencies (.github/workflows/requirements.txt) up to date.
  - package-ecosystem: pip
    directory: /.github/workflows
    schedule:
      interval: weekly

  # In-process test layer (requirements_test.txt): pytest-homeassistant, which pins Home Assistant
  # itself. Member of the home-assistant group, so it moves with the image tag below.
  - package-ecosystem: pip
    directory: /
    multi-ecosystem-group: "home-assistant"
    patterns: ["*"]
    ignore:
      # These follow the HA version (tests/ha/test_versions.py); bump them together with the package.
      - dependency-name: holidays
      - dependency-name: cronsim

  # Pinned HA version used by CI (patch and minor bumps arrive as PRs). Member of the
  # home-assistant group: the image tag and pytest-homeassistant must be the same release
  # (tests/ha/test_versions.py fails until they are). Not the python or mosquitto entries below.
  - package-ecosystem: docker
    directory: /.github/ha-versions/ha
    multi-ecosystem-group: "home-assistant"
    patterns: ["*"]

  # Python version of the YAML tooling/lint jobs (setup-python reads it from this Dockerfile,
  # since Dependabot cannot bump `python-version:` in workflow files). NOT the Python of the test
  # layers: that is .github/ha-versions/ha-python.txt, which follows Home Assistant by hand
  # (tests/ha/test_versions.py fails when it differs from the Python HA requires).
  - package-ecosystem: docker
    directory: /.github/ha-versions/python
    schedule:
      interval: weekly

  # Pinned mosquitto: the official Home Assistant Mosquitto app (add-on) release whose broker the
  # tests start (.github/scripts/install-mosquitto.sh copies it out of this image). Dependabot
  # bumps the FROM line only: add the matching `# mosquitto-in-app: <app> = <mosquitto>` line in
  # the same PR (tests/ha/test_versions.py fails and names the line until you do). Independent of
  # the Home Assistant bump above; when Home Assistant is bumped, take the latest app release.
  - package-ecosystem: docker
    directory: /.github/ha-versions/mosquitto
    schedule:
      interval: weekly
