version: 2
updates:
  # Keep GitHub Actions (uses: ...) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keep CI Python dependencies up to date, including the git-pinned
  # Home Assistant test harness in .github/workflows/requirements.txt.
  - package-ecosystem: pip
    directory: /.github/workflows
    schedule:
      interval: weekly

  # Pinned HA version used by CI (patch and minor bumps arrive as PRs).
  - package-ecosystem: docker
    directory: /.github/ha-versions/ha
    schedule:
      interval: weekly

  # Python version used by CI (setup-python reads it from this Dockerfile,
  # since Dependabot cannot bump `python-version:` in workflow files).
  - package-ecosystem: docker
    directory: /.github/ha-versions/python
    schedule:
      interval: weekly
