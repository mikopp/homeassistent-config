name: Home Assistant advanced Configuration Check
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ha-ci:
    name: HA Config Check · Template Validation · Automation Tests
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repository ─────────────────────────────────────────
      - name: Check out configuration from GitHub
        uses: actions/checkout@v7

      # ── 2. Python tooling ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install -r .github/workflows/requirements.txt

      # ── 3. Pull the HA image (cached by version) ─────────────────────────────
      #    Used by the config-check step. The test harness manages its own
      #    container independently.
      - name: Cache Home Assistant Docker image
        uses: actions/cache@v6
        id: docker-cache
        with:
          path: /tmp/ha-docker-cache.tar.gz
          key: ha-docker-${{ hashFiles('.HA_VERSION') }}

      - name: Load cached Docker image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/ha-docker-cache.tar.gz

      - name: Pull Home Assistant Docker image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:$(cat .HA_VERSION)
          docker save ghcr.io/home-assistant/home-assistant:$(cat .HA_VERSION) \
            | gzip > /tmp/ha-docker-cache.tar.gz

      # ── 4. Prepare config dir ────────────────────────────────────────────────
      - name: Prepare HA config dir
        run: |
          mkdir -p themes
          if [ ! -f secrets.yaml ] && [ -f fakesecrets.yaml ]; then
            cp fakesecrets.yaml secrets.yaml
          fi
          # Inject location into the homeassistant: block so the sun integration
          # uses Linz, Austria coordinates. Done here (not committed) so the repo
          # stays clean. Applies to both check_config and the harness HA instance.
          sed -i '/^homeassistant:/a\  latitude: 48.3069\n  longitude: 14.2858\n  elevation: 266' configuration.yaml

      # ── 5. Install custom component dependencies ─────────────────────────────
      #    Downloads components listed in tests/custom_components.yaml into
      #    custom_components/ so both check_config and the harness HA instance
      #    can load them.
      #    Also writes ha_yaml_config snippets to packages/ha_ci_fixtures.yaml
      #    so built-in integrations (workday, schedule helpers) are available.
      - name: Install custom component dependencies
        run: |
          mkdir -p custom_components
          python3 - <<'EOF'
          import subprocess, sys, tempfile, shutil, os
          import urllib.request
          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "pyyaml"])
              import yaml

          with open("tests/custom_components.yaml") as f:
              data = yaml.safe_load(f)

          deps = data.get("dependencies", [])
          for dep in deps:
              repo = dep["repository"]
              domain = dep["domain"]
              name = dep.get("name", domain)
              owner_repo = repo.rstrip("/").removeprefix("https://github.com/")
              url = f"https://github.com/{owner_repo}/archive/refs/heads/main.tar.gz"
              print(f"Installing {name} ({domain}) from {repo}")
              with tempfile.TemporaryDirectory() as tmp:
                  archive = os.path.join(tmp, "component.tar.gz")
                  urllib.request.urlretrieve(url, archive)
                  subprocess.check_call(
                      ["tar", "-xz", "-C", tmp, "--strip-components=1", "-f", archive]
                  )
                  src = os.path.join(tmp, "custom_components", domain)
                  dst = os.path.join("custom_components", domain)
                  if os.path.exists(dst):
                      shutil.rmtree(dst)
                  shutil.copytree(src, dst)
                  print(f"  → installed to custom_components/{domain}/")

          print("Installed custom components:", os.listdir("custom_components"))

          ha_yaml_configs = data.get("ha_yaml_config", [])
          if ha_yaml_configs:
              os.makedirs("packages", exist_ok=True)
              fixture_path = "packages/ha_ci_fixtures.yaml"
              with open(fixture_path, "w") as fout:
                  fout.write("# Auto-generated by CI from tests/custom_components.yaml ha_yaml_config.\n")
                  fout.write("# Do not edit — regenerated on every CI run.\n\n")
                  for cfg in ha_yaml_configs:
                      fout.write(f"# {cfg.get('name', '')}\n")
                      fout.write(cfg["yaml"].rstrip() + "\n\n")
              print(f"Written HA YAML config fixtures ({len(ha_yaml_configs)} entries) to {fixture_path}")
          EOF

      # ── 6. Config check (one-shot, no server) ────────────────────────────────
      - name: Run Home Assistant config check
        run: |
          output=$(docker run --rm \
            -v "${{ github.workspace }}:/config" \
            ghcr.io/home-assistant/home-assistant:$(cat .HA_VERSION) \
            python -m homeassistant --config /config --script check_config 2>&1)
          echo "$output"
          if echo "$output" | grep -qiE "invalid config|invalid slug|Setup of package.*failed|ERROR"; then
            echo "::error::check_config reported errors — see output above"
            exit 1
          fi

      # ── 7. Extract Jinja2 templates ──────────────────────────────────────────
      #    Produces /tmp/templates.json with state_templates and runtime_templates
      #    lists consumed by tests/test_templates.py. Does not require HA running.
      - name: Extract Jinja2 templates
        run: |
          python3 .github/scripts/extract_templates.py . > /tmp/templates.json
          python3 -c "
          import json
          d = json.load(open('/tmp/templates.json'))
          print(f\"Found {len(d['state_templates'])} state template(s) and {len(d['runtime_templates'])} runtime template(s).\")
          "

      # ── 8a. Run pytest — pergola tests (isolated HA instance) ────────────────
      #    tests/test_pergola.py uses fixtures (midday_sun/low_elevation_sun in
      #    conftest.py) that call jump_to_next(month="Jun", ...) — once the mocked
      #    clock is already past June 21 in the current mocked year, each further
      #    call jumps a FULL YEAR forward. Run as its own pytest invocation so it
      #    gets a fresh harness-managed Docker container and a clock starting near
      #    real "now": ha_integration_test_harness's docker/home_assistant/
      #    time_machine fixtures are scope="session", hardwired in the harness's
      #    own bundled conftest (not overridable from this repo) — a session
      #    boundary is a process boundary is a fresh container, there is no
      #    fixture-scope override available. Without this, those year-jumps
      #    front-load years of clock drift onto the shared session before any
      #    other test file runs, degrading (and eventually hanging) tests much
      #    later in the suite. See plans/ci-test-isolation.md for the full
      #    investigation.
      #
      #    PATTERN for any future test file/group that needs its own instance:
      #    add one more `pytest tests/<file>.py -v` step following this one, and
      #    add `--ignore=tests/<file>.py` to the shared-instance step below.
      - name: Run pytest — pergola tests (isolated HA instance)
        id: run_tests_pergola
        continue-on-error: true
        env:
          HOME_ASSISTANT_CONFIG_ROOT: ${{ github.workspace }}
          TEMPLATES_JSON: /tmp/templates.json
        run: |
          pytest tests/test_pergola.py -v 2>&1 | tee /tmp/pytest_pergola_output.txt
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      # ── 8b. Run pytest — everything else (shared HA instance) ────────────────
      #    Template validation and the remaining automation scenarios share one
      #    live HA instance for efficiency — none of them use the year-jumping
      #    sun fixtures above.
      - name: Run pytest — remaining tests (shared HA instance)
        id: run_tests_rest
        continue-on-error: true
        env:
          HOME_ASSISTANT_CONFIG_ROOT: ${{ github.workspace }}
          TEMPLATES_JSON: /tmp/templates.json
        run: |
          pytest tests/ --ignore=tests/test_pergola.py -v 2>&1 | tee /tmp/pytest_rest_output.txt
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      # ── 9. Write test output to Job Summary (always visible in Actions UI) ──
      - name: Write test results to Job Summary
        if: always()
        run: |
          echo "## Home Assistant CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pergola tests (isolated HA instance)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/pytest_pergola_output.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/pytest_pergola_output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pytest output found." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Remaining tests (shared HA instance)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/pytest_rest_output.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/pytest_rest_output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pytest output found." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 10. Post a PR comment on failure ─────────────────────────────────────
      - name: Comment on PR with failures
        if: steps.run_tests_pergola.outcome == 'failure' || steps.run_tests_rest.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            // Find the open PR for this branch (works for push events too)
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: context.repo.owner + ':' + branch,
              state: 'open',
            });
            const prNumber = (prs[0] && prs[0].number) || (context.issue && context.issue.number);
            if (!prNumber) { console.log('No PR found for branch', branch); return; }
            const fs = require('fs');
            const pergola = fs.existsSync('/tmp/pytest_pergola_output.txt') ? fs.readFileSync('/tmp/pytest_pergola_output.txt', 'utf8') : '(no output)';
            const rest = fs.existsSync('/tmp/pytest_rest_output.txt') ? fs.readFileSync('/tmp/pytest_rest_output.txt', 'utf8') : '(no output)';
            const combined = '### Pergola tests (isolated HA instance)\n' + pergola + '\n\n### Remaining tests (shared HA instance)\n' + rest;
            const truncated = combined.length > 60000 ? combined.slice(-60000) : combined;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '## ❌ Home Assistant CI failed\n\n### Test output\n```\n' + truncated + '\n```',
            });

      # ── 11. Re-fail the job after the comment step ───────────────────────────
      - name: Fail if any check failed
        if: steps.run_tests_pergola.outcome == 'failure' || steps.run_tests_rest.outcome == 'failure'
        run: exit 1
