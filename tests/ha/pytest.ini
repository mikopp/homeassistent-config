# pytest config of the in-process layer.
# Run it with its own ini and `--confcutdir tests/ha` (no conftest above this directory is read).
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Fixture setup (HA boot, broker start) does not count against a test's timeout.
timeout_func_only = true
timeout = 60
log_level = WARNING
markers =
    package(*names): the test also covers packages/<name>.yaml (loads or drives its real entities), so it runs under `--package <name>` as well as under its own file's package; a name without a packages/<name>.yaml fails collection (tests/ha/conftest.py)
    allow_log(pattern, reason): the log guard (tests/ha/conftest.py) ignores records matching the regex `pattern`; `reason` says why the test provokes them
