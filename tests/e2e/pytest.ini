# Config for `pytest tests/e2e` only (pass it with `-c tests/e2e/pytest.ini`). It replaces the root
# pyproject.toml for this layer: that file configures the old Docker-harness run (and its
# Home Assistant plugins), which this layer does not use.
[pytest]
# Fixture setup (the container boot) does not count against a test's timeout.
timeout_func_only = true
markers =
    needs_real_ha(reason): why this test must run in a real Home Assistant (REAL_HA_REASONS in conftest.py)
