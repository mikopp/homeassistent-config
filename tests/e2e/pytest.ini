# Config for `pytest tests/e2e` only (pass it with `-c tests/e2e/pytest.ini`). Each test layer has
# its own ini; there is no root pytest config.
[pytest]
# Fixture setup (the container boot) does not count against a test's timeout.
timeout_func_only = true
markers =
    needs_real_ha(reason): why this test must run in a real Home Assistant (REAL_HA_REASONS in conftest.py)
