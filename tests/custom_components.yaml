# Custom components required by this Home Assistant configuration.
# Install via HACS (preferred) or manually from the repository links below.
#
# This file is read by .github/scripts/install_custom_components.py, the one implementation of the
# install. The test workflows (tests.yaml, e2e.yaml), .github/scripts/ci-local.sh and
# tests/e2e/stage.py use it to put the components into custom_components/, where the in-process
# tests and the staged config of the real-HA tests load them.
#
# `dependencies` - HACS/GitHub custom components. Fields used by the script: `domain`,
# `repository`, optional `ref`. `name`, `hacs` and `description` are for people.

dependencies:
  - name: Template Climate
    domain: climate_template
    repository: https://github.com/mikopp/hass-template-climate
    # Optional: branch to install from (defaults to "main" if omitted).
    # Lets CI validate this config against an unmerged hass-template-climate
    # branch/PR before it lands on main — set it temporarily on a throwaway
    # branch, never on master.
    # ref: some-branch-to-validate
    hacs: mikopp/hass-template-climate
    description: >
      Provides the climate_template platform used in packages/climate_airflow.yaml
      to create a virtual climate entity driven by Jinja2 templates.
