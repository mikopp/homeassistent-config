---
extends: default

# Local virtualenvs and caches of the test layers (ci-local.sh) hold third-party YAML.
ignore: |
  .venv/
  .venv-test/
  .venv-e2e/
  .cache/

rules:
  line-length:
    max: 200
    level: warning
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on", "off"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: whatever
    check-multi-line-strings: false
  document-start: disable
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
