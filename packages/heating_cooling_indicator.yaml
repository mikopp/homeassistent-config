# --- HEATING/COOLING INDICATOR ---
# Classifies outdoor temperature into 4 operational modes used by ventilation automations.
sensor:
  # 15-min smoothed weatherstation temp — recorded by HA so the statistics sensor's
  # max_age can load historical samples on HA restart.
  - platform: filter
    unique_id: wheatherstation_outdoor_temperature_15min
    name: "Weatherstation Outdoor Temperature 15min"
    entity_id: sensor.wheatherstation_outdoor_temperature
    filters:
      - filter: time_simple_moving_average
        window_size: "00:15"
        precision: 2
      - filter: time_throttle
        window_size: "00:15"

  # 48h mean of 15min-throttled source.
  # max_age causes HA to pre-populate the sample window from the recorder on restart
  # (sampling_size alone does NOT load history — max_age is required for that).
  # sampling_size: 192 = 4 samples/hour × 48h, kept as an upper-bound memory cap.
  - platform: statistics
    unique_id: wheatherstation_outdoor_temperature_48h_mean
    name: "Weatherstation Outdoor Temperature 48h Mean"
    entity_id: sensor.wheatherstation_outdoor_temperature_15min
    state_characteristic: mean
    sampling_size: 192
    max_age: "48:00:00"
# --- SETTINGS ---
# The three main outdoor-temperature thresholds (48h mean). Hysteresis is NOT a setting: it is
# fixed at 1 °C relative to each threshold inside the template. No `initial:` — set the values
# once in the UI after deploy (chosen values: 12 / 16 / 20).
input_number:
  # Mean at or below this → active_heating.
  heating_indicator_heating_below:
    name: "Indicator: Heating below"
    min: 5
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:radiator
    mode: box

  # Mean at or above this → passive_cooling (clamped to heating + 2 in the template).
  heating_indicator_passive_cooling_above:
    name: "Indicator: Passive cooling above"
    min: 5
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:weather-sunny
    mode: box

  # Mean at or above this → active_cooling (clamped to passive cooling + 2 in the template).
  heating_indicator_active_cooling_above:
    name: "Indicator: Active cooling above"
    min: 5
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:snowflake
    mode: box

template:
  - sensor:
      # Thresholds actually in use. The order heating < passive < active is enforced here: each
      # threshold is raised to at least 2 °C above the previous one, so the 1 °C hysteresis bands
      # can never overlap whatever was typed in. Shown on the dashboard so a clamp is visible
      # (effective value differs from the box above it).
      - name: "Heating Indicator Passive Cooling Effective"
        unique_id: heating_indicator_passive_cooling_effective
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {{ [states('input_number.heating_indicator_passive_cooling_above') | float,
              states('input_number.heating_indicator_heating_below') | float + 2] | max }}

      - name: "Heating Indicator Active Cooling Effective"
        unique_id: heating_indicator_active_cooling_effective
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set cool = [states('input_number.heating_indicator_passive_cooling_above') | float,
                         states('input_number.heating_indicator_heating_below') | float + 2] | max %}
          {{ [states('input_number.heating_indicator_active_cooling_above') | float,
              cool + 2] | max }}

      - name: "Heating Cooling Indicator"
        unique_id: heating_cooling_indicator
        # Prevents cascade jumps during config reload: when the 48h mean is
        # unavailable, the indicator becomes unavailable too instead of computing
        # from float(0) and cycling through spurious states.
        availability: >
          {{ has_value('sensor.wheatherstation_outdoor_temperature_48h_mean')
             and has_value('sensor.heating_indicator_passive_cooling_effective')
             and has_value('sensor.heating_indicator_active_cooling_effective') }}
        state: >
          {% set temp = states('sensor.wheatherstation_outdoor_temperature_48h_mean') | float(0) %}
          {% set current = this.state %}
          {# Thresholds: heating comes straight from its helper; passive/active come from the
             "effective" sensors below, which already enforce heating < passive < active. #}
          {% set heat = states('input_number.heating_indicator_heating_below') | float %}
          {% set cool = states('sensor.heating_indicator_passive_cooling_effective') | float %}
          {% set active = states('sensor.heating_indicator_active_cooling_effective') | float %}
          {# Hysteresis is fixed and relative to each threshold: 1 °C. #}
          {% if current == 'active_heating' %}
            {% if temp >= heat + 1 %}neutral{% else %}active_heating{% endif %}
          {% elif current == 'neutral' %}
            {% if temp <= heat %}active_heating
            {% elif temp >= cool %}passive_cooling
            {% else %}neutral{% endif %}
          {% elif current == 'passive_cooling' %}
            {% if temp <= cool - 1 %}neutral
            {% elif temp >= active %}active_cooling
            {% else %}passive_cooling{% endif %}
          {% elif current == 'active_cooling' %}
            {% if temp <= active - 1 %}passive_cooling{% else %}active_cooling{% endif %}
          {% else %}
            {# Cold start (no previous state): classify at the midpoint of each hysteresis band. #}
            {% if temp <= heat + 0.5 %}active_heating
            {% elif temp < cool - 0.5 %}neutral
            {% elif temp < active - 0.5 %}passive_cooling
            {% else %}active_cooling{% endif %}
          {% endif %}

# --- GROUP ---
# All entities belonging to the heating_cooling_indicator feature
group:
  heating_cooling_indicator:
    name: "Heating Cooling Indicator"
    entities:
      # Filter sensor (15min smoothed source)
      - sensor.wheatherstation_outdoor_temperature_15min
      # Statistics sensor (48h mean)
      - sensor.wheatherstation_outdoor_temperature_48h_mean
      # Template sensor (heating/cooling state)
      - sensor.heating_cooling_indicator
      # Effective (clamped) thresholds
      - sensor.heating_indicator_passive_cooling_effective
      - sensor.heating_indicator_active_cooling_effective
      # Threshold settings
      - input_number.heating_indicator_heating_below
      - input_number.heating_indicator_passive_cooling_above
      - input_number.heating_indicator_active_cooling_above
