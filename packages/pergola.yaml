# Pergola Dach — tilt control of the two Somfy bioclimatic covers (cover.dach_links,
# cover.dach_rechts), which always move together: state machine, slat formulas,
# rain/frost protection, post-rain drain.
# Design (states, formulas, deadband, verification table): doc/pergola/design.md
# Invariants and quirks you must not break: doc/pergola/notes.md
#
# Tilt scale: 0 = flat (closed, max shade, rain protection), 74 = vertical 90°,
# 100 = input_number.pergola_max_tilt_angle (122°). → doc/pergola/design.md#PG-1
#
# Every entity except the two internal input_numbers (see group comment) is listed in
# group.pergola_dach (bottom of file) AND dashboards/elements/pergola_card.yaml (card-sync
# invariant, see the note). Helpers have no initial: values; set them in the UI after
# deploy (recommended value: on each helper below).

# ─────────────────────────────────────────────────────────────────────────────────────
# INPUT BOOLEANS — on/off toggles
# ─────────────────────────────────────────────────────────────────────────────────────
input_boolean:

  # Master switch: off suppresses all cover movement (gate in script.pergola_set_slat_angle).
  # State machine and template sensors keep running. → doc/pergola/design.md#PG-6.3
  pergola_automatic_enabled:
    name: Pergola Automatic Enabled
    icon: mdi:sun-clock


  # Heating indicator: on = heating season (let sun through), off = cooling season (block sun).
  # Driven by automation.pergola_sync_heating_from_indicator from sensor.heating_cooling_indicator
  # (on for active_heating/neutral, off for passive_cooling/active_cooling). A manual toggle in
  # the HA UI or a write via the REST API is overwritten at the next indicator change or HA
  # start. Does NOT affect state machine transitions — only the cover formula.
  pergola_heating:
    name: Pergola Heating
    icon: mdi:radiator


  # Cooling sub-mode: off = standard perpendicular blocking (A_eff ± 90, default),
  # on = optimized safe-zone max-open (more airflow). → doc/pergola/design.md#PG-4.3
  pergola_cooling_optimized:
    name: Pergola Cooling Optimized
    icon: mdi:sine-wave


# ─────────────────────────────────────────────────────────────────────────────────────
# INPUT SELECT — state machine
# ─────────────────────────────────────────────────────────────────────────────────────
input_select:

  # Single source of truth of the state machine. Writers are limited to the state
  # manager, script.pergola_evaluate_state, script.pergola_exit_to_normal and the two
  # not_enough_sun automations (plus the user, to break a deadlock).
  # States in priority order (highest first); option order below is not priority:
  #   frost              — outdoor temp < 2.5 °C; no movement
  #   rain               — rain active (weather station or cover lock); no movement
  #   rain_stopped       — rain just ended; post-rain drain script running
  #   user_override      — cover(s) locked by user; no movement
  #   sun_down           — PV = 0 AND solar_radiation = 0 (night); no movement
  #   no_sun_behind_house — sun below horizon, low elevation, or outside azimuth window; 90°
  #   not_enough_sun     — pergola_sun_shining off; 90° only if > 30° away
  #   sun_automatik_heating — sun active, pergola_heating on
  #   sun_automatik_cooling — sun active, pergola_heating off (default)
  # → doc/pergola/design.md#PG-2
  pergola_automation_state:
    name: Pergola Automation State
    icon: mdi:state-machine

    options:
      - no_sun_behind_house
      - frost
      - rain
      - rain_stopped
      - user_override
      - sun_down
      - not_enough_sun
      - sun_automatik_heating
      - sun_automatik_cooling

# ─────────────────────────────────────────────────────────────────────────────────────
# INPUT NUMBERS — user-configurable parameters
# ─────────────────────────────────────────────────────────────────────────────────────
input_number:

  # ── PV / sun detection ────────────────────────────────────────────────────────────

  pergola_pv_conversion_factor:
    name: Pergola PV Conversion Factor
    # Divisor: raw PV watts (sensor.pergola_pv_power) → equivalent W/m² irradiance.
    # Recommended 3.2 (STC 2.64 raised for bifacial gain and near-flat tilt).
    # → doc/pergola/design.md#PG-8; field calibration: plans/pergola-field-calibration.md
    min: 2
    max: 6
    step: 0.1
    mode: box


    icon: mdi:solar-panel

  pergola_shading_sensitivity:
    name: Pergola Shading Sensitivity
    # Factor in the sun_shining threshold: 512 × sin(elevation) × sensitivity.
    # Recommended 0.9; lower = shading starts earlier (hazy days), higher = needs brighter sun.
    # → doc/pergola/design.md#PG-8; field calibration: plans/pergola-field-calibration.md
    min: 0.5
    max: 1.2
    step: 0.05
    mode: box
    icon: mdi:weather-sunny


  pergola_min_sun_elevation:
    name: Pergola Min Sun Elevation
    # At or below this elevation the state is no_sun_behind_house (sun shines under the
    # roof, slats go to 90°); also the sun_shining elevation guard. Recommended 10°.
    # Must be > 0° (keeps sin(elevation) in the sun_shining threshold positive).
    min: 1
    max: 30
    step: 0.5
    unit_of_measurement: "°"
    mode: box
    icon: mdi:weather-sunset

  pergola_deadband_angle:
    name: Pergola Deadband Angle
    # DB: sun-tracking deadband (cover_response, compared in tilt units) AND the
    # optimized-morning safety buffer (moe + DB) and flip guard (moe ≤ max_tilt − DB).
    # Recommended 5°. Never set below the motor's positional accuracy.
    # → doc/pergola/design.md#PG-5.1, #PG-4.3
    min: 1
    max: 20
    step: 0.5
    unit_of_measurement: "°"
    mode: box
    icon: mdi:arrow-expand-horizontal

  # ── Last commanded slat angle tracker ───────────────────────────────────────────

  pergola_last_set_slat_angle:
    name: Pergola Last Set Slat Angle
    # Internal backing store for sensor.pergola_effective_slat_angle; written only by
    # script.pergola_set_slat_angle after the master-switch gate. Not in group/card.
    min: 0
    max: 150
    step: 0.5
    unit_of_measurement: "°"
    icon: mdi:angle-obtuse


  # ── Rain recovery step tracker ───────────────────────────────────────────────────

  pergola_rain_recovery_step:
    name: Pergola Rain Recovery Step
    # Internal step counter (1–4) of script.pergola_post_rain_recovery; shown via
    # sensor.pergola_rain_recovery_step, which reads 0 outside rain_stopped, so no reset
    # is needed. Not in group/card. Steps: → doc/pergola/design.md#PG-6.1
    min: 0
    max: 4
    step: 1
    icon: mdi:water-sync


  # ── Tilt / hardware geometry ──────────────────────────────────────────────────────

  pergola_max_tilt_angle:
    name: Pergola Max Tilt Angle
    # Max physical slat rotation (Somfy hardware limit, 122°) = tilt 100. Feeds the
    # tilt conversion, the deadband in tilt units and COOLING_LOWER_BOUND.
    # Adjust if the physical stop changes. → doc/pergola/design.md#PG-4.6
    min: 100
    max: 150
    step: 1
    unit_of_measurement: "°"
    mode: box
    icon: mdi:rotate-right


  # ── Location / orientation ────────────────────────────────────────────────────────

  pergola_wall_azimuth:
    name: Pergola Wall Azimuth
    # Compass bearing the terrasse faces; 204° (SSW, measured on site).
    # Sun window wall_azimuth ± 90 (114°–294°): outside it the sun cannot reach the
    # terrasse. Also the reference direction of A_eff. Formulas derive from it, never hardcode.
    # → doc/pergola/design.md#PG-1, #PG-4.1
    min: 0
    max: 359
    step: 1
    mode: box
    unit_of_measurement: "°"
    icon: mdi:compass


  # ── Slat geometry (w, d, t) ──────────────────────────────────────────────────────
  # Feed R = sqrt(d² + t²) / w and PHI = degrees(atan(t / d)), computed inline in
  # moe, mow and COOLING_LOWER_BOUND, plus the heating floor; all re-derive on change.
  # → doc/pergola/design.md#PG-3.2

  pergola_slat_width:
    name: Pergola Slat Width
    # Slat face width w, perpendicular to the pivot axis. Recommended 22 cm.
    min: 10
    max: 30
    step: 0.5
    mode: box
    unit_of_measurement: "cm"
    icon: mdi:ruler


  pergola_slat_pivot_spacing:
    name: Pergola Slat Pivot Spacing
    # Pivot spacing d, centre to centre of adjacent slats. Recommended 20 cm.
    min: 8
    max: 30
    step: 0.5
    mode: box
    unit_of_measurement: "cm"
    icon: mdi:ruler-square


  pergola_slat_thickness:
    name: Pergola Slat Thickness
    # Slat thickness t. Recommended 3 cm.
    min: 0.5
    max: 5
    mode: box
    step: 0.5
    unit_of_measurement: "cm"
    icon: mdi:layers


# ─────────────────────────────────────────────────────────────────────────────────────
# TEMPLATE SENSORS AND BINARY SENSORS
# ─────────────────────────────────────────────────────────────────────────────────────
template:

  # ── Pergola Dach computed sensors ────────────────────────────────────────────────
  # Real computed values; never wrappers around input_* helpers (used directly).
  # All always compute, also while the master switch is off.
  # sensor.pergola_cooling_lower_bound is in its own block further down (derived constant).
  - sensor:

      # ── PV Power ──────────────────────────────────────────────────────────────────
      # Wrapper around the raw Victron DC PV power, the one PV entity all formulas use.
      - name: "Pergola PV Power"
        unique_id: pergola_pv_power
        # At night the MPPT topic stops publishing (keep-alive suppresses republish of a
        # constant 0) and the source goes unavailable (expire_after: 120). While
        # victron_ac_load_total_power is still available (Victron alive), report 0 W instead
        # of unavailable, or sun_down (needs pv == 0) fails and the slats open to 90° at night.
        # Safe by day: pv only feeds sun_down (which also needs solar_radiation == 0) and the
        # max() in pergola_sun_shining.
        # Raw DC, not the AC-referenced sensor.solar_yield_watts: the conversion factor is
        # calibrated on panel output. → doc/pergola/design.md#PG-8
        state: >
          {% if states('sensor.victron_solar_yield_dc_watts') not in ['unavailable', 'unknown'] %}
            {{ states('sensor.victron_solar_yield_dc_watts') | float(0) }}
          {% else %}
            0
          {% endif %}
        availability: >
          {{ states('sensor.victron_solar_yield_dc_watts') not in ['unavailable', 'unknown']
             or states('sensor.victron_ac_load_total_power') not in ['unavailable', 'unknown'] }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-panel

      # ── Effective Sun Angle (A_eff) ───────────────────────────────────────────────
      # Sun position projected onto the slat plane, one 0°–180° scale shared with the slat
      # angle: 0° = east horizon, 90° = zenith, 180° = west horizon. Input of all formulas.
      # sun_height = atan(tan(elev) / |sin(az − wall_az)|) (90 at the singularity);
      # A_eff = sun_height east of the wall, 180 − sun_height west. → doc/pergola/design.md#PG-4.1
      # The template also guards elev ≤ 0: a stale elevation can reach it before availability clears.
      - name: "Pergola Effective Sun Angle"
        unique_id: pergola_effective_sun_angle
        availability: >
          {{ state_attr('sun.sun', 'elevation') is not none
             and state_attr('sun.sun', 'azimuth') is not none
             and states('input_number.pergola_wall_azimuth') not in ['unavailable', 'unknown']
             and (state_attr('sun.sun', 'elevation') | float(0)) > 0 }}
        state: >
          {% set elev    = state_attr('sun.sun', 'elevation') | float(0) %}
          {% set az      = state_attr('sun.sun', 'azimuth') | float(0) %}
          {% set wall_az = states('input_number.pergola_wall_azimuth') | float(204) %}
          {% if elev <= 0 %}
            0
          {% else %}
            {% set delta_phi = az - wall_az %}
            {% if (sin(delta_phi * pi / 180)) | abs < 0.001 %}
              {% set sun_height = 90 %}
            {% else %}
              {% set sun_height = (atan(tan(elev * pi / 180) / ((sin(delta_phi * pi / 180)) | abs))) * (180 / pi) %}
            {% endif %}
            {% if az < wall_az %}
              {{ sun_height | round(1) }}
            {% else %}
              {{ (180 - sun_height) | round(1) }}
            {% endif %}
          {% endif %}
        unit_of_measurement: "°"
        icon: mdi:angle-acute

      # ── Target Slat Angle ─────────────────────────────────────────────────────────
      # Target slat angle (degrees, before tilt correction) for the current state:
      #   cooling, standard:  morning min(A + 90, max_tilt) while moe ≤ max_tilt − 5, else max(A − 90, LB)
      #   cooling, optimized: morning min(max(90, moe + DB), max_tilt) while moe ≤ max_tilt − DB,
      #                       flip range mow − 5, afternoon min(mow − 5, 90)
      #   heating:            clamp(A, min_heat, max_tilt); A > max_tilt → max_tilt (dead zone)
      #   any other state:    90 (vertical; the cover only moves where cover_response says so)
      # → doc/pergola/design.md#PG-4.3, #PG-4.4, #PG-4.5
      - name: "Pergola Slat Angle"
        unique_id: pergola_slat_angle
        availability: >
          {{ states('input_select.pergola_automation_state') not in ['unavailable', 'unknown']
             and states('sensor.pergola_max_open_east_morning_cooling_angle') not in ['unavailable', 'unknown'] }}
        state: >
          {% set s  = states('input_select.pergola_automation_state') %}
          {% set mt = states('input_number.pergola_max_tilt_angle') | float(122) %}
          {% if s == 'sun_automatik_cooling' %}
            {% set LB  = states('sensor.pergola_cooling_lower_bound') | float(15.3) %}
            {% set A   = states('sensor.pergola_effective_sun_angle') | float(90) %}
            {% set moe = states('sensor.pergola_max_open_east_morning_cooling_angle') | float(90) %}
            {% set optimized = states('input_boolean.pergola_cooling_optimized') == 'on' %}
            {% if optimized %}
              {% set mow = states('sensor.pergola_max_open_west_cooling_angle') | float(15.3) %}
              {% set DB  = states('input_number.pergola_deadband_angle') | float(5) %}
              {% if A < 90 and moe <= mt - DB %}
                {% set slat = [[90, moe + DB] | max, mt] | min %}
              {% elif A <= 90 %}
                {% set slat = mow - 5 %}
              {% else %}
                {% set slat = [mow - 5, 90] | min %}
              {% endif %}
              {{ [[slat, 0] | max, mt] | min | round(1) }}
            {% else %}
              {% if A < 90 and moe <= mt - 5 %}
                {% set slat = (A + 90) if (A + 90) <= mt else mt %}
              {% else %}
                {% set slat = [A - 90, LB] | max %}
              {% endif %}
              {{ [[slat, LB] | max, mt] | min | round(1) }}
            {% endif %}
          {% elif s == 'sun_automatik_heating' %}
            {% set min_heat = states('sensor.pergola_min_heating_slat_angle') | float(33.5) %}
            {% set A        = states('sensor.pergola_effective_sun_angle') | float(90) %}
            {% if A > mt %}
              {{ mt | round(1) }}
            {% else %}
              {{ [[A, min_heat] | max, mt] | min | round(1) }}
            {% endif %}
          {% else %}
            90
          {% endif %}
        unit_of_measurement: "°"
        icon: mdi:angle-obtuse

      # ── Effective (Last-Commanded) Slat Angle ─────────────────────────────────────
      # Last slat angle actually commanded by script.pergola_set_slat_angle (only after the
      # master-switch gate). sensor.pergola_slat_angle is the target, _tilt_position its tilt.
      - name: "Pergola Effective Slat Angle"
        unique_id: pergola_effective_slat_angle
        availability: >
          {{ states('input_number.pergola_last_set_slat_angle') not in ['unavailable', 'unknown'] }}
        state: >
          {{ states('input_number.pergola_last_set_slat_angle') | float(0) | round(1) }}
        unit_of_measurement: "°"
        icon: mdi:angle-obtuse

      # ── MaxOpenEast Morning Cooling Angle ─────────────────────────────────────────
      # moe: minimum back-face slat angle that still gives 100 % shade from eastern sun,
      # A_eff + PHI + asin(R × sin(A_eff)). Raw, no buffer: the slat formula adds DB / the
      # max_tilt − 5 guard. Computed in both cooling sub-modes. → doc/pergola/design.md#PG-4.2
      - name: "Pergola Max Open East Morning Cooling Angle"
        unique_id: pergola_max_open_east_morning_cooling_angle
        availability: >
          {{ states('sensor.pergola_effective_sun_angle') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_width') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_pivot_spacing') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_thickness') not in ['unavailable', 'unknown'] }}
        state: >
          {% set A   = states('sensor.pergola_effective_sun_angle') | float(90) %}
          {% set w   = states('input_number.pergola_slat_width') | float(22) %}
          {% set d   = states('input_number.pergola_slat_pivot_spacing') | float(20) %}
          {% set t   = states('input_number.pergola_slat_thickness') | float(3) %}
          {% set R   = ((d**2 + t**2) ** 0.5) / w %}
          {% set PHI = atan(t / d) * (180 / pi) %}
          {{ (A + PHI + asin(R * sin(A * pi / 180)) * (180 / pi)) | round(1) }}
        unit_of_measurement: "°"
        icon: mdi:angle-obtuse

      # ── MaxOpenWest Cooling Angle ─────────────────────────────────────────────────
      # mow: maximum front-face slat angle that still gives 100 % shade,
      # A_eff + PHI − asin(R × sin(A_eff)) (sign +PHI). Raw, no buffer or cap; the optimized
      # formula uses mow − 5. Continuous at A_eff = 90 (31.7°). → doc/pergola/design.md#PG-4.2
      - name: "Pergola Max Open West Cooling Angle"
        unique_id: pergola_max_open_west_cooling_angle
        availability: >
          {{ states('sensor.pergola_effective_sun_angle') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_width') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_pivot_spacing') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_thickness') not in ['unavailable', 'unknown'] }}
        state: >
          {% set A   = states('sensor.pergola_effective_sun_angle') | float(90) %}
          {% set w   = states('input_number.pergola_slat_width') | float(22) %}
          {% set d   = states('input_number.pergola_slat_pivot_spacing') | float(20) %}
          {% set t   = states('input_number.pergola_slat_thickness') | float(3) %}
          {% set R   = ((d**2 + t**2) ** 0.5) / w %}
          {% set PHI = atan(t / d) * (180 / pi) %}
          {{ (A + PHI - asin(R * sin(A * pi / 180)) * (180 / pi)) | round(1) }}
        unit_of_measurement: "°"
        icon: mdi:angle-acute

      # ── Min Heating Slat Angle ────────────────────────────────────────────────────
      # Heating floor: "break-the-seal" angle where a gap first opens between slats
      # (gap condition w·cosθ + t·sinθ = d; here p = d). ≈ 33.5° at baseline geometry.
      # → doc/pergola/design.md#PG-4.4
      - name: "Pergola Min Heating Slat Angle"
        unique_id: pergola_min_heating_slat_angle
        availability: >
          {{ states('input_number.pergola_slat_width') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_pivot_spacing') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_thickness') not in ['unavailable', 'unknown'] }}
        state: >
          {% set w = states('input_number.pergola_slat_width') | float(22) %}
          {% set p = states('input_number.pergola_slat_pivot_spacing') | float(20) %}
          {% set t = states('input_number.pergola_slat_thickness') | float(3) %}
          {{ (acos(p / (w**2 + t**2)**0.5) * (180 / pi) + atan(t / w) * (180 / pi)) | round(1) }}
        unit_of_measurement: "°"
        icon: mdi:angle-acute

      # ── Target Tilt Position ──────────────────────────────────────────────────────
      # Tilt position (0–100) of sensor.pergola_slat_angle, for display and the deadband
      # compare; never drives a cover. Mirrors script.pergola_set_slat_angle, the single
      # authoritative converter: keep both identical. → doc/pergola/design.md#PG-4.6
      - name: "Pergola Tilt Position"
        unique_id: pergola_tilt_position
        availability: >
          {{ states('sensor.pergola_slat_angle') not in ['unavailable', 'unknown']
             and states('input_number.pergola_max_tilt_angle') not in ['unavailable', 'unknown'] }}
        state: >
          {% set slat = states('sensor.pergola_slat_angle') | float(90) %}
          {% set mt   = states('input_number.pergola_max_tilt_angle') | float(122) %}
          {% set corr = 6 if slat < 20 else (5.5 if slat < 69 else 0.5) %}
          {% set raw  = (slat / mt * 100 + corr) | int %}
          {{ [[raw, 0] | max, 100] | min }}
        unit_of_measurement: "%"
        icon: mdi:format-align-middle

      # ── Rain Recovery Step ────────────────────────────────────────────────────────
      # Active post-rain drain step: 1 settle, 2 drain 8°, 3 drain 15°, 4 dry; 0 whenever
      # the state ≠ rain_stopped, so an aborted drain needs no cleanup. → doc/pergola/design.md#PG-6.1
      - name: "Pergola Rain Recovery Step"
        unique_id: pergola_rain_recovery_step
        availability: >
          {{ states('input_select.pergola_automation_state') not in ['unavailable', 'unknown']
             and states('input_number.pergola_rain_recovery_step') not in ['unavailable', 'unknown'] }}
        state: >
          {% if states('input_select.pergola_automation_state') == 'rain_stopped' %}
            {{ states('input_number.pergola_rain_recovery_step') | int(0) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:water-sync


    binary_sensor:

      # ── Sun Shining ────────────────────────────────────────────────────────────────
      # On when the sun is strong enough that the terrasse needs shading (Loxone logic):
      #   elevation > min_sun_elevation AND (max(solar_radiation, pv_power / factor)
      #   > 512 × sin(elevation) × sensitivity OR uv_index ≥ 3)
      # max(): whichever sensor is still in direct sun wins (weather station is shaded in
      # the afternoon). delay_on 1 min / delay_off 5 min debounce; the not_enough_sun
      # automations rely on that and add no for:. → doc/pergola/design.md#PG-8
      - name: "Pergola Sun Shining"
        unique_id: pergola_sun_shining
        device_class: light
        availability: >
          {{ (states('sensor.wheatherstation_solar_radiation') not in ['unavailable', 'unknown']
              or states('sensor.pergola_pv_power') not in ['unavailable', 'unknown'])
             and state_attr('sun.sun', 'elevation') is not none }}
        delay_on: "00:01:00"
        delay_off: "00:05:00"
        state: >
          {% set solar       = states('sensor.wheatherstation_solar_radiation') | float(0) %}
          {% set factor      = states('input_number.pergola_pv_conversion_factor') | float(3.2) %}
          {% set pv          = states('sensor.pergola_pv_power') | float(0) / factor %}
          {% set elev        = state_attr('sun.sun', 'elevation') | float(0) %}
          {% set min_elev    = states('input_number.pergola_min_sun_elevation') | float(10) %}
          {% set sensitivity = states('input_number.pergola_shading_sensitivity') | float(0.9) %}
          {% set uv          = states('sensor.wheatherstation_uv_index') | float(0) %}
          {% if elev <= min_elev %}
            false
          {% else %}
            {% set effective  = [solar, pv] | max %}
            {% set threshold  = 512 * sin(elev * pi / 180) * sensitivity %}
            {{ effective > threshold or uv >= 3 }}
          {% endif %}


  # ── Internal sensor: Cooling Lower Bound ─────────────────────────────────────────
  # LB, the standard-cooling floor: mow at the flip point a_flip = largest integer A_eff
  # in 1…90 with moe(a) ≤ max_tilt − 5 (fixed SAFETY_BUFFER), rounded to 0 decimals.
  # Baseline geometry: a_flip 57, LB 15°. Re-derives on any geometry/max_tilt change;
  # never hardcode 15. → doc/pergola/design.md#PG-4.2
  - sensor:
      - name: "Pergola Cooling Lower Bound"
        unique_id: pergola_cooling_lower_bound
        availability: >
          {{ states('input_number.pergola_max_tilt_angle') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_width') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_pivot_spacing') not in ['unavailable', 'unknown']
             and states('input_number.pergola_slat_thickness') not in ['unavailable', 'unknown'] }}
        state: >
          {% set max_tilt = states('input_number.pergola_max_tilt_angle') | float(122) %}
          {% set w        = states('input_number.pergola_slat_width') | float(22) %}
          {% set d        = states('input_number.pergola_slat_pivot_spacing') | float(20) %}
          {% set t        = states('input_number.pergola_slat_thickness') | float(3) %}
          {% set R   = ((d**2 + t**2) ** 0.5) / w %}
          {% set PHI = atan(t / d) * (180 / pi) %}
          {% set SAFETY = 5 %}
          {% set ns = namespace(flip=1) %}
          {% for a in range(1, 91) %}
            {% set max_open_east = a + PHI + asin(R * sin(a * pi / 180)) * (180 / pi) %}
            {% if max_open_east <= max_tilt - SAFETY %}
              {% set ns.flip = a %}
            {% endif %}
          {% endfor %}
          {% set a_flip = ns.flip %}
          {{ (a_flip + PHI - asin(R * sin(a_flip * pi / 180)) * (180 / pi)) | round(0) }}
        unit_of_measurement: "°"
        icon: mdi:angle-acute

# ─────────────────────────────────────────────────────────────────────────────────────
# AUTOMATIONS
# ─────────────────────────────────────────────────────────────────────────────────────
automation:

  # ── Inactivity Watchdog: Dach Links ───────────────────────────────────────────────
  # Every 5 min (and on HA start) sends stop_cover_tilt when the cover, its lock
  # originator and its lock timer have not updated for 5 min.
  # Why: the Somfy never pushes lock/timer changes; without a forced state report the
  # originator would look stuck at rain forever after the 900 s countdown.
  # Suppressed in the moving states (cooling, heating, rain_stopped), or its stop would
  # abort a movement sent on the same /5 tick. → doc/pergola/design.md#PG-2.4
  - id: '1771360145720'
    alias: 'Inactivity Watchdog: Dach Links'

    description: >
      Forces an update of slat position and lock originator every 5 minutes when
      no cover movement or lock change has occurred. Prevents stale lock state.
    triggers:
      - trigger: time_pattern
        minutes: /5
      - trigger: homeassistant
        event: start
    conditions:
      # Act only when none of the monitored entities has been updated in the last 5 min.
      - condition: template
        value_template: >
          {% set entities = [
            states.sensor.dach_links_priority_lock_originator,
            states.sensor.dach_links_priority_lock_timer,
            states.cover.dach_links
          ] %}
          {{ entities | selectattr('last_updated', 'gt', now() - timedelta(minutes=5))
             | list | count == 0 }}
      # Skip in the moving states: cover_response / the drain share the /5 tick, and the
      # cover's last_updated is still stale when this evaluates, so a stop here would
      # abort the movement already in flight. An unknown state does not suppress.
      - condition: template
        value_template: >
          {% set s = states('input_select.pergola_automation_state') %}
          {{ s not in ['sun_automatik_cooling', 'sun_automatik_heating', 'rain_stopped'] }}
    actions:
      - action: cover.stop_cover_tilt
        target:
          entity_id: cover.dach_links

  # ── Inactivity Watchdog: Dach Rechts ──────────────────────────────────────────────
  # Identical logic as the Dach Links watchdog — see comment above.
  - id: '1771361016291'
    alias: 'Inactivity Watchdog: Dach Rechts'

    description: >
      Forces an update of slat position and lock originator every 5 minutes when
      no cover movement or lock change has occurred. Prevents stale lock state.
    triggers:
      - trigger: time_pattern
        minutes: /5
      - trigger: homeassistant
        event: start
    conditions:
      # Act only when none of the monitored entities has been updated in the last 5 min.
      - condition: template
        value_template: >
          {% set entities = [
            states.sensor.dach_rechts_priority_lock_originator,
            states.sensor.dach_rechts_priority_lock_timer,
            states.cover.dach_rechts
          ] %}
          {{ entities | selectattr('last_updated', 'gt', now() - timedelta(minutes=5))
             | list | count == 0 }}
      # Same race-condition guard as Dach Links watchdog — see comment there.
      - condition: template
        value_template: >
          {% set s = states('input_select.pergola_automation_state') %}
          {{ s not in ['sun_automatik_cooling', 'sun_automatik_heating', 'rain_stopped'] }}
    actions:
      - action: cover.stop_cover_tilt
        target:
          entity_id: cover.dach_rechts

  # ── Lock Originator Responder: Dach Links ─────────────────────────────────────────
  # On any lock originator change, sends stop_cover_tilt at once so the Somfy reports
  # fresh tilt and lock state before the state manager acts, without waiting for the
  # watchdog. → doc/pergola/design.md#PG-2.4
  - id: '1771748333394'
    alias: 'Dach Links: Update state when lock originator changes'

    description: >
      Sends stop_cover_tilt immediately when the lock originator changes so HA
      receives a fresh state report before the state manager evaluates the transition.
    triggers:
      - trigger: state
        entity_id:
          - sensor.dach_links_priority_lock_originator
    conditions: []
    actions:
      - action: cover.stop_cover_tilt
        target:
          entity_id: cover.dach_links
    mode: single

  # ── Lock Originator Responder: Dach Rechts ────────────────────────────────────────
  # Same as Dach Links responder — see comment above.
  - id: '1771748414999'
    alias: 'Dach Rechts: Update state when lock originator changes'

    description: >
      Sends stop_cover_tilt immediately when the lock originator changes so HA
      receives a fresh state report before the state manager evaluates the transition.
    triggers:
      - trigger: state
        entity_id:
          - sensor.dach_rechts_priority_lock_originator
    conditions: []
    actions:
      - action: cover.stop_cover_tilt
        target:
          entity_id: cover.dach_rechts
    mode: single

  # ── Pergola State Manager ──────────────────────────────────────────────────────────
  # Evaluates rules 1–4 inline (frost → rain → rain_stopped → user_override) and
  # delegates rules 5–9 (sun_down … cooling) to script.pergola_evaluate_state.
  # First matching choose branch wins; the protected-state guard keeps frost, rain,
  # rain_stopped and user_override until their own exit rule fires.
  # → doc/pergola/design.md#PG-2.2, triggers #PG-2.3
  - id: 'pergola_state_manager'
    alias: 'Pergola State Manager'

    description: >
      Evaluates rules 1–4 (frost, rain, rain_stopped, user_override) directly and
      delegates rules 5–9 to script.pergola_evaluate_state. Triggers on all inputs
      that can cause a state transition; the choose block determines what (if anything)
      to do on each trigger.
    triggers:
      # Frost entry: fires on the threshold crossing (2.5 °C) so we react immediately;
      # the id is informational only — the branch condition below is value-based so
      # any trigger (incl. time_pattern) will enter frost if this one gets queue-dropped.
      - trigger: numeric_state
        id: "frost_entry"
        entity_id: sensor.wheatherstation_outdoor_temperature
        below: 2.5
      # Frost exit: fires on the threshold crossing (3.0 °C) so we react immediately;
      # the id is informational only — the branch condition below is value-based so
      # any trigger (incl. time_pattern) will exit frost if this one gets queue-dropped.
      - trigger: numeric_state
        id: "frost_exit"
        entity_id: sensor.wheatherstation_outdoor_temperature
        above: 3.0
      # Rain rule: re-evaluate when weather station rain rate changes
      - trigger: state
        entity_id: sensor.wheatherstation_rain_rate
      # Rain + user_override rules: re-evaluate when a lock originator changes
      # (seen only after a forced state report, #PG-2.4)
      - trigger: state
        entity_id: sensor.dach_links_priority_lock_originator
      - trigger: state
        entity_id: sensor.dach_rechts_priority_lock_originator
      # not_enough_sun boundary: re-evaluate when sun shining binary changes
      - trigger: state
        entity_id: binary_sensor.pergola_sun_shining
      # Heating/cooling toggle: re-evaluate immediately when mode changes
      - trigger: state
        entity_id: input_boolean.pergola_heating
      # HA start: evaluate from persisted state; resume rain_stopped drain if interrupted
      - trigger: homeassistant
        event: start
      # Time pattern: catch slow sun azimuth / elevation threshold crossings every 5 min
      # (replaces triggers on sun.sun attributes, which change every minute)
      - trigger: time_pattern
        minutes: /5
    actions:
      - choose:
          # ── HA START + rain_stopped: resume interrupted drain sequence ─────────────
          # HA restarted mid-drain: restart the drain from the beginning (safe to repeat).
          # Do NOT evaluate any other rule on this trigger.
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.platform == 'homeassistant'
                     and states('input_select.pergola_automation_state') == 'rain_stopped' }}
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.pergola_post_rain_recovery

          # ── RULE 1 ENTRY: FROST ────────────────────────────────────────────────────
          # Below 2.5 °C (hardcoded): stop the drain, set frost; preempts any state.
          # Value-based, not trigger.id-based: any trigger converges even if frost_entry
          # was dropped from the queue. float(99): unknown sensor = warm, no frost.
          # Skipped when already in frost.
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.wheatherstation_outdoor_temperature') | float(99) < 2.5
                     and states('input_select.pergola_automation_state') != 'frost' }}
            sequence:
              # Stop any in-progress recovery — frost takes absolute priority
              - action: script.turn_off
                target:
                  entity_id: script.pergola_post_rain_recovery
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: frost

          # ── RULE 1 EXIT: FROST CLEAR ───────────────────────────────────────────────
          # Above 3.0 °C (hardcoded, 0.5 °C hysteresis), value-based like the entry.
          # float(0): unknown sensor = cold, stay in frost until the temperature is known.
          # Exit via script.pergola_exit_to_normal (drain if hourly rain > 0, else rules 5–9).
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.wheatherstation_outdoor_temperature') | float(0) > 3.0
                     and states('input_select.pergola_automation_state') == 'frost' }}
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.pergola_exit_to_normal

          # ── RULE 2 ENTRY: RAIN ─────────────────────────────────────────────────────
          # Rain: weather-station rain_rate > 0 (slower) OR either cover rain sensor locked
          # (originator = rain, faster). Preempts rain_stopped (stops the drain), never frost.
          # Skipped when already in rain, and while either originator is 'user': otherwise
          # user_override ↔ rain would loop.
          - conditions:
              - condition: template
                value_template: >
                  {{ (states('sensor.wheatherstation_rain_rate') | float(0) > 0
                      or states('sensor.dach_links_priority_lock_originator') == 'rain'
                      or states('sensor.dach_rechts_priority_lock_originator') == 'rain')
                     and states('sensor.dach_links_priority_lock_originator') != 'user'
                     and states('sensor.dach_rechts_priority_lock_originator') != 'user'
                     and states('input_select.pergola_automation_state') not in ['frost', 'rain'] }}
            sequence:
              # Stop any in-progress recovery — rain has (re)started
              - action: script.turn_off
                target:
                  entity_id: script.pergola_post_rain_recovery
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: rain

          # ── RULE 2 EXIT / RULE 3 ENTRY: RAIN STOPPED ──────────────────────────────
          # All rain indicators off: rain_rate = 0 AND both originators 'unknown' (Somfy
          # countdown done). Water may have pooled: set rain_stopped, start the drain.
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_select.pergola_automation_state') == 'rain'
                     and states('sensor.wheatherstation_rain_rate') | float(0) == 0
                     and states('sensor.dach_links_priority_lock_originator') == 'unknown'
                     and states('sensor.dach_rechts_priority_lock_originator') == 'unknown' }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: rain_stopped
              - action: script.turn_on
                target:
                  entity_id: script.pergola_post_rain_recovery

          # ── RULE 2 → USER OVERRIDE: User overrides while in rain state ──────────────
          # User operated a cover during rain (originator = user): respect it, go to
          # user_override. When that lock clears, the user-override exit runs and rain
          # entry re-engages on the next trigger if it is still raining.
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_select.pergola_automation_state') == 'rain'
                     and (states('sensor.dach_links_priority_lock_originator') == 'user'
                          or states('sensor.dach_rechts_priority_lock_originator') == 'user') }}
            sequence:
              - action: script.turn_off
                target:
                  entity_id: script.pergola_post_rain_recovery
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: user_override

          # ── RULE 4 ENTRY: USER OVERRIDE ───────────────────────────────────────────
          # A cover's originator = 'user'. Never overrides frost, rain or rain_stopped;
          # skipped when already in user_override.
          - conditions:
              - condition: template
                value_template: >
                  {{ (states('sensor.dach_links_priority_lock_originator') == 'user'
                      or states('sensor.dach_rechts_priority_lock_originator') == 'user')
                     and states('input_select.pergola_automation_state') not in
                     ['frost', 'rain', 'rain_stopped', 'user_override'] }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: user_override

          # ── RULE 4 EXIT: USER OVERRIDE CLEAR ─────────────────────────────────────
          # Both originators back to 'unknown'. Same exit as frost clear:
          # script.pergola_exit_to_normal (drain if hourly rain > 0, else rules 5–9).
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_select.pergola_automation_state') == 'user_override'
                     and states('sensor.dach_links_priority_lock_originator') == 'unknown'
                     and states('sensor.dach_rechts_priority_lock_originator') == 'unknown' }}
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.pergola_exit_to_normal

          # ── PROTECTED STATE GUARD ─────────────────────────────────────────────────
          # Protected state and no transition above matched: do nothing. Without this
          # (user_override included) any tick would fall to the default and silently
          # replace the protected state with a sun state.
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_select.pergola_automation_state') in
                     ['frost', 'rain', 'rain_stopped', 'user_override'] }}
            sequence: []

        # ── DEFAULT: delegate to evaluate_state (rules 5–9) ───────────────────────
        # sun_down → no_sun_behind_house → not_enough_sun → heating → cooling.
        default:
          - action: script.turn_on
            target:
              entity_id: script.pergola_evaluate_state
    mode: queued
    max: 3

  # ── Not Enough Sun Entry ──────────────────────────────────────────────────────────
  # sun_shining → off enters not_enough_sun unless a higher-priority state holds.
  # No for: (the sensor's delay_off 5 min debounces). → doc/pergola/design.md#PG-2.2
  - id: 'pergola_not_enough_sun_entry'
    alias: 'Pergola: Not Enough Sun — Entry'

    description: >
      Enters not_enough_sun when pergola_sun_shining turns off. The sensor's 5 min
      delay_off means this fires only after 5 continuous minutes of no sun — no extra
      guard needed here. Condition: no higher-priority state is currently active.
    triggers:
      - trigger: state
        entity_id: binary_sensor.pergola_sun_shining
        to: "off"
    conditions:
      # Only enter not_enough_sun when no higher-priority state is holding
      - condition: template
        value_template: >
          {{ states('input_select.pergola_automation_state') not in
             ['frost', 'rain', 'rain_stopped', 'user_override', 'sun_down', 'no_sun_behind_house'] }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.pergola_automation_state
        data:
          option: not_enough_sun
    mode: single

  # ── Not Enough Sun Exit ───────────────────────────────────────────────────────────
  # sun_shining → on while in not_enough_sun: set heating or cooling from pergola_heating.
  # No for: (delay_on 1 min). No evaluate_state: being in not_enough_sun means the
  # higher rules did not apply.
  - id: 'pergola_not_enough_sun_exit'
    alias: 'Pergola: Not Enough Sun — Exit'

    description: >
      Exits not_enough_sun when pergola_sun_shining turns on. The sensor's 1 min
      delay_on means this fires only after 1 continuous minute of sun — no extra guard
      needed here. Sets sun_automatik_heating or sun_automatik_cooling based on the
      current heating indicator.
    triggers:
      - trigger: state
        entity_id: binary_sensor.pergola_sun_shining
        to: "on"
    conditions:
      - condition: state
        entity_id: input_select.pergola_automation_state
        state: not_enough_sun
    actions:
      # Inline heating/cooling choice (see header).
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.pergola_heating
                state: "on"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: sun_automatik_heating
        default:
          - action: input_select.select_option
            target:
              entity_id: input_select.pergola_automation_state
            data:
              option: sun_automatik_cooling
    mode: single

  # ── Pergola Cover Response ─────────────────────────────────────────────────────────
  # Moves the covers on every state change and every 5 min (sun tracking), dispatching
  # per state with a deadband. No conditions: the master-switch gate lives in
  # script.pergola_set_slat_angle. → doc/pergola/design.md#PG-4.7
  - id: 'pergola_cover_response'
    alias: 'Pergola Cover Response'

    description: >
      Reacts to state machine transitions and tracks the sun every 5 min. Dispatches
      to the correct slat-angle formula per state and applies the movement deadband
      before calling script.pergola_set_slat_angle.
    triggers:
      # Immediate reaction to any state machine transition
      - trigger: state
        entity_id: input_select.pergola_automation_state
      # Periodic sun tracking: the only way to follow the sun within a steady state.
      - trigger: time_pattern
        minutes: /5
    conditions: []
    actions:
      - choose:
          # ── Safety / protected states: frost, rain, rain_stopped, user_override, sun_down ──
          # Covers must not move in these states: explicit no-op branch.
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_select.pergola_automation_state') in
                     ['frost', 'rain', 'rain_stopped', 'user_override', 'sun_down'] }}
            sequence: []

          # ── No sun behind house ───────────────────────────────────────────────────
          # Always send 90° (ventilation), no deadband; the Somfy is idempotent.
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_select.pergola_automation_state') == 'no_sun_behind_house' }}
            sequence:
              - action: script.pergola_set_slat_angle
                data:
                  slat_angle: 90

          # ── Not enough sun ─────────────────────────────────────────────────────────
          # Sun up but too weak to shade: 90° only if either cover is > 30° away, so
          # slats that are already roughly vertical do not travel. → #PG-5.2
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_select.pergola_automation_state') == 'not_enough_sun' }}
            sequence:
              # 30° deadband in tilt units (30 / max_tilt × 100 = 25) against
              # sensor.pergola_tilt_position (74 here), max deviation of both covers.
              - condition: template
                value_template: >
                  {% set mt      = states('input_number.pergola_max_tilt_angle') | float(122) %}
                  {% set DB      = (30 / mt * 100) | round(0) | int %}
                  {% set target  = states('sensor.pergola_tilt_position') | int(74) %}
                  {% set dev_l   = (state_attr('cover.dach_links',  'current_tilt_position') | int(74) - target) | abs %}
                  {% set dev_r   = (state_attr('cover.dach_rechts', 'current_tilt_position') | int(74) - target) | abs %}
                  {{ [dev_l, dev_r] | max > DB }}
              - action: script.pergola_set_slat_angle
                data:
                  slat_angle: 90

          # ── Sun tracking: sun_automatik_cooling and sun_automatik_heating ────────────
          # Same motion logic for both: sensor.pergola_slat_angle holds the formula
          # result for the active state, the configurable deadband stops micro-moves.
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_select.pergola_automation_state') in
                     ['sun_automatik_cooling', 'sun_automatik_heating'] }}
            sequence:
              # Let the template cascade (state → A_eff → moe → slat_angle → tilt_position)
              # settle after a state change; a stale 90°/74 would otherwise move the
              # covers to 90° or mask the real move.
              - delay:
                  milliseconds: 500
              # Deadband in tilt units: pergola_deadband_angle converted, compared with
              # the max deviation of both covers from sensor.pergola_tilt_position.
              # Tilt space, because inverting the correction to degrees adds errors larger
              # than the threshold. target ≥ 100 (max-tilt dead zone) always passes. → #PG-5.1
              - condition: template
                value_template: >
                  {% set mt      = states('input_number.pergola_max_tilt_angle') | float(122) %}
                  {% set DB      = (states('input_number.pergola_deadband_angle') | float(5) / mt * 100) | round(0) | int %}
                  {% set target  = states('sensor.pergola_tilt_position') | int(0) %}
                  {% set dev_l   = (state_attr('cover.dach_links',  'current_tilt_position') | int(0) - target) | abs %}
                  {% set dev_r   = (state_attr('cover.dach_rechts', 'current_tilt_position') | int(0) - target) | abs %}
                  {{ ([dev_l, dev_r] | max >= DB) or (target >= 100) }}
              # Hand the formula result to the only cover mover.
              - action: script.pergola_set_slat_angle
                data:
                  slat_angle: "{{ states('sensor.pergola_slat_angle') | float(90) }}"
    mode: queued
    max: 3

  # ── Heating/cooling season sync ───────────────────────────────────────────────────
  # Drives input_boolean.pergola_heating from sensor.heating_cooling_indicator, so the pergola
  # follows the same season as ventilation and heat pump. Heating = active_heating OR neutral
  # (same gate as binary_sensor.heating_season_active in packages/heating_pv_boost.yaml);
  # passive_cooling / active_cooling = cooling. The boolean's own trigger in the state manager
  # re-evaluates the state. Unavailable/unknown indicator: boolean left as is (never flip the
  # season on missing data). Manual toggles are overwritten at the next change or HA start.
  - id: 'pergola_sync_heating_from_indicator'
    alias: 'Pergola: Sync Heating From Indicator'
    description: >
      Sets pergola_heating on in heating season (active_heating, neutral) and off in cooling
      season (passive_cooling, active_cooling), following sensor.heating_cooling_indicator.
    triggers:
      - trigger: state
        entity_id: sensor.heating_cooling_indicator
      # HA start: the indicator is restored/recomputed, but the boolean may be stale.
      - trigger: homeassistant
        event: start
    conditions:
      # Only act on a real classification.
      - condition: template
        value_template: >
          {{ states('sensor.heating_cooling_indicator') in
             ['active_heating', 'neutral', 'passive_cooling', 'active_cooling'] }}
    # Both seasons are named explicitly and there is no `default:` branch: a manual run
    # ("Run actions" / automation.trigger skips the condition above by default) while the
    # indicator is unavailable/unknown must leave the boolean untouched, not turn it off.
    actions:
      - choose:
          # Heating season → let sun through.
          - conditions:
              - condition: state
                entity_id: sensor.heating_cooling_indicator
                state:
                  - active_heating
                  - neutral
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.pergola_heating
          # Cooling season → block sun.
          - conditions:
              - condition: state
                entity_id: sensor.heating_cooling_indicator
                state:
                  - passive_cooling
                  - active_cooling
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.pergola_heating
    mode: restart

# ─────────────────────────────────────────────────────────────────────────────────────
# SCRIPTS
# ─────────────────────────────────────────────────────────────────────────────────────
script:

  # ── Pergola Exit to Normal ───────────────────────────────────────────────────────
  # Shared frost-clear / user_override-clear exit: hourly rain > 0 (rain fell while the
  # covers were inactive) → rain_stopped + drain; else script.pergola_evaluate_state.
  pergola_exit_to_normal:
    alias: "Pergola: Exit to Normal (post-frost / post-override)"

    description: >
      Shared handler for frost-clear and user_override-clear transitions. Checks
      hourly rain and either enters rain_stopped + starts drain, or calls
      script.pergola_evaluate_state to return to normal sun-based operation.
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.wheatherstation_hourly_rain') | float(0) > 0 }}
            sequence:
              # Rain accumulated while covers were inactive — drain before reopening
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: rain_stopped
              - action: script.turn_on
                target:
                  entity_id: script.pergola_post_rain_recovery
        default:
          # No rain accumulated — re-evaluate sun/heating rules normally
          - action: script.turn_on
            target:
              entity_id: script.pergola_evaluate_state
    mode: single
    max_exceeded: silent

  # ── Pergola Evaluate State (Rules 5–9) ───────────────────────────────────────────
  # Evaluates the sun-based rules 5–9, first match wins: sun_down → no_sun_behind_house →
  # not_enough_sun → sun_automatik_heating → sun_automatik_cooling (default).
  # Callers: state manager default, exit_to_normal, end of the post-rain drain. Never checks
  # rules 1–4; callers guarantee they do not apply. → doc/pergola/design.md#PG-2.2
  pergola_evaluate_state:
    alias: "Pergola: Evaluate State (Rules 5–9)"

    description: >
      Evaluates rules 5–9 (sun_down → no_sun_behind_house → not_enough_sun → heating → cooling)
      and writes the result to input_select.pergola_automation_state. Called from
      the state manager default branch and from the post-rain recovery script.
    sequence:
      - choose:
          # ── Rule 5: sun_down ─────────────────────────────────────────────────────
          # PV and solar radiation both exactly 0 → night; slats stay where they are.
          # At sunrise the next call (e.g. /5 tick) finds a value > 0 and moves on.
          # float(-1) fail-safe: an unavailable sensor skips this rule.
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.pergola_pv_power') | float(-1) == 0
                     and states('sensor.wheatherstation_solar_radiation') | float(-1) == 0 }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: sun_down

          # ── Rule 6: no_sun_behind_house ──────────────────────────────────────────
          # Sun cannot hit the terrasse through the slats; any one suffices: below horizon,
          # elevation ≤ min_sun_elevation (shines under the roof), azimuth outside wall_azimuth ± 90.
          - conditions:
              - condition: template
                value_template: >
                  {% set elev    = state_attr('sun.sun', 'elevation') | float(0) %}
                  {% set az      = state_attr('sun.sun', 'azimuth')   | float(0) %}
                  {% set min_el  = states('input_number.pergola_min_sun_elevation') | float(10) %}
                  {% set wall_az = states('input_number.pergola_wall_azimuth') | float(204) %}
                  {% set az_min  = wall_az - 90 %}
                  {% set az_max  = wall_az + 90 %}
                  {{ states('sun.sun') == 'below_horizon'
                     or elev <= min_el
                     or az < az_min
                     or az > az_max }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: no_sun_behind_house

          # ── Rule 7: not_enough_sun ───────────────────────────────────────────────
          # Sun in the window but too weak to shade (sun_shining off, already debounced).
          - conditions:
              - condition: state
                entity_id: binary_sensor.pergola_sun_shining
                state: "off"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: not_enough_sun

          # ── Rule 8: sun_automatik_heating ────────────────────────────────────────
          # Sun shining and pergola_heating on → let sun through.
          # pergola_heating not 'on' (incl. unavailable) → cooling.
          - conditions:
              - condition: template
                value_template: >
                  {{ states('input_boolean.pergola_heating') | default('off') == 'on' }}
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.pergola_automation_state
                data:
                  option: sun_automatik_heating

        # ── Rule 9: sun_automatik_cooling (default) ──────────────────────────────
        # Sun is active and cooling season — block sun via the cover formula.
        default:
          - action: input_select.select_option
            target:
              entity_id: input_select.pergola_automation_state
            data:
              option: sun_automatik_cooling
    mode: restart

  # ── Pergola Set Slat Angle ────────────────────────────────────────────────────────
  # The only cover mover and the single authoritative slat angle → tilt converter; never
  # inline the formula (sensor.pergola_tilt_position mirrors it). Takes slat_angle (°).
  # Exits at once when the master switch is off. No deadband here: callers check it, so
  # the post-rain drain can bypass it. → doc/pergola/design.md#PG-4.6
  pergola_set_slat_angle:
    alias: "Pergola: Set Slat Angle"

    description: >
      Converts slat_angle (degrees) to hardware-corrected tilt_position and sends
      cover.set_cover_tilt_position to both covers. Exits without moving if the
      master switch (pergola_automatic_enabled) is off.
    fields:
      slat_angle:
        description: "Target slat angle in degrees (0–max_tilt_angle)"
        example: 90
        required: true
        selector:
          number:
            min: 0
            max: 122
    sequence:
      # ── Master switch gate ──────────────────────────────────────────────────────────
      # Master switch off: no cover moves. State machine and sensors keep running, so
      # re-enabling acts at the next trigger.
      - condition: state
        entity_id: input_boolean.pergola_automatic_enabled
        state: "on"
      # ── Record the angle that was actually commanded ─────────────────────────────────
      # Backing store for sensor.pergola_effective_slat_angle. Written here (after the
      # gate) so the sensor only reflects angles that were actually sent to the covers.
      - action: input_number.set_value
        target:
          entity_id: input_number.pergola_last_set_slat_angle
        data:
          value: "{{ slat_angle | float(90) | round(1) }}"
      # ── Hardware-corrected tilt_position ────────────────────────────────────────────
      # INT(slat / max_tilt × 100 + corr), corr compensates the non-linear motor:
      # 6 below 20° (barely moves), 5.5 below 69° (linear), 0.5 above (avoid overshoot).
      # Clamped to 0–100; > 100 is a dead zone on the Somfy. → #PG-4.6
      - variables:
          _tilt: >
            {% set s    = slat_angle | float(90) %}
            {% set mt   = states('input_number.pergola_max_tilt_angle') | float(122) %}
            {% set corr = 6 if s < 20 else (5.5 if s < 69 else 0.5) %}
            {{ [[(s / mt * 100 + corr) | int, 0] | max, 100] | min }}
      # ── Send movement command to both covers ─────────────────────────────────────────
      # Both covers always move together as one unit.
      - action: cover.set_cover_tilt_position
        target:
          entity_id:
            - cover.dach_links
            - cover.dach_rechts
        data:
          tilt_position: "{{ _tilt }}"
    mode: queued
    max: 2

  # ── Pergola Post-Rain Recovery ───────────────────────────────────────────────────
  # Step-drain after rain (8° → 15°) to shed water pooled on the flat slats, then
  # script.pergola_evaluate_state leaves rain_stopped. Started on entry to rain_stopped:
  # rain exit, frost/override exit with hourly rain > 0 (via exit_to_normal), HA start
  # while rain_stopped. No deadband (draining must complete); the master switch still
  # applies. mode: restart re-drains from the start (safe); frost/rain entry stops it
  # with script.turn_off. → doc/pergola/design.md#PG-6.1
  pergola_post_rain_recovery:
    alias: "Pergola: Post-Rain Recovery"

    description: >
      Stepped drain sequence after rain stops. Moves covers 8° → 15° to drain pooled
      water, optionally waits 30 min if hourly rain > 0, then calls
      script.pergola_evaluate_state to re-enter the correct operating state.
    sequence:
      # ── Drain step 1: settle (30 s) ────────────────────────────────────────────────
      # 30 s for lock and weather sensors to report final values before moving.
      - action: input_number.set_value
        target:
          entity_id: input_number.pergola_rain_recovery_step
        data:
          value: 1
      - delay: "00:00:30"
      # Abort if the state was manually changed away from rain_stopped during this delay.
      - condition: state
        entity_id: input_select.pergola_automation_state
        state: rain_stopped

      # ── Drain step 2: 8°, hold 5 min (only when rain fell in the last hour) ────────
      # Nearly flat, so gravity pulls water to the front edge. Skipped (with its 5 min
      # hold) when hourly rain is 0: little water pooled; the counter goes 1 → 3.
      # Counter set before the hold so the sensor shows the active phase.
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.wheatherstation_hourly_rain') | float(0) > 0 }}
            sequence:
              - action: script.pergola_set_slat_angle
                data:
                  slat_angle: 8
              - action: input_number.set_value
                target:
                  entity_id: input_number.pergola_rain_recovery_step
                data:
                  value: 2

              # Hold 5 min (initial drainage).
              - delay: "00:05:00"
              # Abort if the state was manually changed away from rain_stopped during this delay.
              - condition: state
                entity_id: input_select.pergola_automation_state
                state: rain_stopped

      # ── Drain step 3: 15°, hold 5 min ──────────────────────────────────────────────
      # Open further so the remaining water runs off; counter set before the hold.
      - action: script.pergola_set_slat_angle
        data:
          slat_angle: 15
      - action: input_number.set_value
        target:
          entity_id: input_number.pergola_rain_recovery_step
        data:
          value: 3

      # Hold 5 min (continued drainage).
      - delay: "00:05:00"
      # Abort if the state was manually changed away from rain_stopped during this delay.
      - condition: state
        entity_id: input_select.pergola_automation_state
        state: rain_stopped

      # ── Drain step 4: dry (30 min only when rain fell in the last hour) ────────────
      # Counter 4 ("drying") before the choose. Hourly rain > 0: wait 30 more min so the
      # slats dry at 15° before reopening; else continue at once.
      - action: input_number.set_value
        target:
          entity_id: input_number.pergola_rain_recovery_step
        data:
          value: 4
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.wheatherstation_hourly_rain') | float(0) > 0 }}
            sequence:
              # Rain still shows in the 60-min accumulation window — wait for slats to dry
              - delay: "00:30:00"
              # Abort if the state was manually changed away from rain_stopped during this wait.
              - condition: state
                entity_id: input_select.pergola_automation_state
                state: rain_stopped

      # ── Exit: re-evaluate state, leaving rain_stopped ──────────────────────────────
      # Rules 1–4 cannot apply here (frost/rain entry would have stopped this script;
      # user_override cannot start from rain_stopped), so evaluate rules 5–9 directly.
      # Must be called explicitly: no input changed, so the state manager would not fire.
      - action: script.turn_on
        target:
          entity_id: script.pergola_evaluate_state
    mode: restart

# ─────────────────────────────────────────────────────────────────────────────────────
# GROUP — logical grouping of all pergola entities
# ─────────────────────────────────────────────────────────────────────────────────────
group:

  # All pergola helpers and sensors in one group. Card-sync invariant: add/remove an
  # entity here AND in dashboards/elements/pergola_card.yaml in the same change.
  # The two internal input_numbers (last_set_slat_angle, rain_recovery_step) stay out.
  pergola_dach:
    name: Pergola Dach
    entities:
      # ── On/off toggles ────────────────────────────────────────────────────────────
      - input_boolean.pergola_automatic_enabled
      - input_boolean.pergola_heating
      - input_boolean.pergola_cooling_optimized
      # ── State machine ─────────────────────────────────────────────────────────────
      - input_select.pergola_automation_state
      # ── User-configurable parameters ──────────────────────────────────────────────
      - input_number.pergola_pv_conversion_factor
      - input_number.pergola_shading_sensitivity
      - input_number.pergola_min_sun_elevation
      - input_number.pergola_deadband_angle
      - input_number.pergola_max_tilt_angle
      - input_number.pergola_wall_azimuth
      - input_number.pergola_slat_width
      - input_number.pergola_slat_pivot_spacing
      - input_number.pergola_slat_thickness
      # ── Computed / read-only sensors ──────────────────────────────────────────────
      - sensor.pergola_rain_recovery_step
      - sensor.pergola_pv_power
      - sensor.pergola_effective_sun_angle
      - sensor.pergola_slat_angle
      - sensor.pergola_effective_slat_angle
      - sensor.pergola_tilt_position
      - binary_sensor.pergola_sun_shining
      - sensor.pergola_cooling_lower_bound
      - sensor.pergola_max_open_east_morning_cooling_angle
      - sensor.pergola_max_open_west_cooling_angle
      - sensor.pergola_min_heating_slat_angle


# ─────────────────────────────────────────────────────────────────────────────────────
# RECORDER EXCLUDES — derived constants that don't need history
# ─────────────────────────────────────────────────────────────────────────────────────
recorder:
  exclude:
    entities:
      # Derived constants (geometry + max_tilt), a duplicate of the Victron PV sensor and
      # the transient drain step counter: no history needed.
      - sensor.pergola_cooling_lower_bound
      - sensor.pergola_pv_power
      - sensor.pergola_rain_recovery_step
      - sensor.pergola_min_heating_slat_angle
