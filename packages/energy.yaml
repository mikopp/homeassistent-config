# ──────────────────────────────────────────────────────────────────────────────
# Energy Dashboard — metered devices (MQTT): Shelly Plus Plug S (pool pump, rain
# water pump), Shelly Pro 3EM (Heizung), Loxone appliances (washer, tumble dryer,
# dishwasher), and the function-named wallbox wrappers (go-e Charger).
# Device map, topics, units and invariants → doc/energy/notes.md
# ──────────────────────────────────────────────────────────────────────────────

mqtt:
  sensor:

    - name: "Pool Pump Power"
      unique_id: "shelly_pool_pump_power"
      state_topic: "shelly/shellyplusplugs-pool-pump/status/switch:0"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:pump
      device: &shelly_pool_pump
        identifiers:
          - shellyplusplugs_pool_pump
        name: "Pool Pump"
        manufacturer: "Shelly"
        model: "Plus Plug S"
        suggested_area: "Pool"
      value_template: "{{ value_json.apower | round(1) }}"

    # Lifetime energy from Shelly firmware (Wh → kWh); total_increasing absorbs a reset.
    - name: "Pool Pump Energy"
      unique_id: "shelly_pool_pump_energy"
      state_topic: "shelly/shellyplusplugs-pool-pump/status/switch:0"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      expire_after: 120
      icon: mdi:lightning-bolt
      device: *shelly_pool_pump
      value_template: "{% if value_json.aenergy is not none %}{{ (value_json.aenergy.total / 1000) | round(3) }}{% endif %}"

    - name: "Pool Pump Voltage"
      unique_id: "shelly_pool_pump_voltage"
      state_topic: "shelly/shellyplusplugs-pool-pump/status/switch:0"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      expire_after: 120
      icon: mdi:sine-wave
      device: *shelly_pool_pump
      value_template: "{{ value_json.voltage | round(1) }}"

    - name: "Pool Pump Current"
      unique_id: "shelly_pool_pump_current"
      state_topic: "shelly/shellyplusplugs-pool-pump/status/switch:0"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      expire_after: 120
      icon: mdi:current-ac
      device: *shelly_pool_pump
      value_template: "{{ value_json.current | round(3) }}"

    - name: "Rain Water Pump Power"
      unique_id: "shelly_rainwater_pump_power"
      state_topic: "shelly/shellyplusplugs-rainwaterpump/status/switch:0"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:pump
      device: &shelly_rainwater_pump
        identifiers:
          - shellyplusplugs_rainwaterpump
        name: "Rain Water Pump"
        manufacturer: "Shelly"
        model: "Plus Plug S"
        suggested_area: "Garden"
      value_template: "{{ value_json.apower | round(1) }}"

    # Lifetime energy from Shelly firmware (Wh → kWh); total_increasing absorbs a reset.
    - name: "Rain Water Pump Energy"
      unique_id: "shelly_rainwater_pump_energy"
      state_topic: "shelly/shellyplusplugs-rainwaterpump/status/switch:0"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      expire_after: 120
      icon: mdi:lightning-bolt
      device: *shelly_rainwater_pump
      value_template: "{% if value_json.aenergy is not none %}{{ (value_json.aenergy.total / 1000) | round(3) }}{% endif %}"

    - name: "Rain Water Pump Voltage"
      unique_id: "shelly_rainwater_pump_voltage"
      state_topic: "shelly/shellyplusplugs-rainwaterpump/status/switch:0"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      expire_after: 120
      icon: mdi:sine-wave
      device: *shelly_rainwater_pump
      value_template: "{{ value_json.voltage | round(1) }}"

    - name: "Rain Water Pump Current"
      unique_id: "shelly_rainwater_pump_current"
      state_topic: "shelly/shellyplusplugs-rainwaterpump/status/switch:0"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      expire_after: 120
      icon: mdi:current-ac
      device: *shelly_rainwater_pump
      value_template: "{{ value_json.current | round(3) }}"

    - name: "Heizung Power"
      unique_id: "shelly_pro3em_heizung_power"
      state_topic: "shelly/shellypro3em-heizung/status/em:0"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:radiator
      device: &shelly_pro3em_heizung
        identifiers:
          - shellypro3em_heizung
        name: "Heizung"
        manufacturer: "Shelly"
        model: "Pro 3EM"
        suggested_area: "Technikraum"
      value_template: "{{ value_json.total_act_power | round(1) }}"

    # Cumulative all-phase consumption energy from Shelly firmware (Wh → kWh).
    - name: "Heizung Energy"
      unique_id: "shelly_pro3em_heizung_energy"
      state_topic: "shelly/shellypro3em-heizung/status/emdata:0"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      expire_after: 120
      icon: mdi:lightning-bolt
      device: *shelly_pro3em_heizung
      value_template: "{% if value_json.total_act is not none %}{{ (value_json.total_act / 1000) | round(3) }}{% endif %}"

    # ── Loxone Washer ──────────────────────────────────────────────────────────
    # Loxone sensors: no expire_after (no heartbeat; idle must not go unavailable).
    # → doc/energy/notes.md
    - name: "Washer Power"
      unique_id: "loxone_washer_power"
      state_topic: "loxone/washer/power"
      unit_of_measurement: "kW"          # native kW, as published by Loxone
      device_class: power
      state_class: measurement
      icon: mdi:washing-machine
      device: &loxone_washer
        identifiers:
          - loxone_washer
        name: "Washer"
        manufacturer: "Loxone"
        suggested_area: "Technikraum"
      # All Loxone value_templates: empty payload → '' keeps the last value without a warning.
      # → .claude/skills/ha-mqtt/SKILL.md
      value_template: "{{ '' if value | trim == '' else value | float | round(3) }}"

    # Lifetime energy (kWh), total_increasing: the Energy Dashboard's source for the washer.
    - name: "Washer Energy"
      unique_id: "loxone_washer_energy"
      state_topic: "loxone/washer/energy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:lightning-bolt
      device: *loxone_washer
      value_template: "{{ '' if value | trim == '' else value | float | round(3) }}"

    # ── Loxone Tumble Dryer ────────────────────────────────────────────────────
    # NB: topic uses a hyphen (loxone/tumble-dry/*); HA ids use underscores.
    - name: "Tumble Dryer Power"
      unique_id: "loxone_tumble_dry_power"
      state_topic: "loxone/tumble-dry/power"
      unit_of_measurement: "kW"          # native kW, as published by Loxone
      device_class: power
      state_class: measurement
      icon: mdi:tumble-dryer
      device: &loxone_tumble_dry
        identifiers:
          - loxone_tumble_dry
        name: "Tumble Dryer"
        manufacturer: "Loxone"
        suggested_area: "Technikraum"
      value_template: "{{ '' if value | trim == '' else value | float | round(3) }}"

    - name: "Tumble Dryer Energy"
      unique_id: "loxone_tumble_dry_energy"
      state_topic: "loxone/tumble-dry/energy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:lightning-bolt
      device: *loxone_tumble_dry
      value_template: "{{ '' if value | trim == '' else value | float | round(3) }}"

    # ── Loxone Dishwasher ──────────────────────────────────────────────────────
    - name: "Dishwasher Power"
      unique_id: "loxone_dishwasher_power"
      state_topic: "loxone/dishwasher/power"
      unit_of_measurement: "kW"          # native kW, as published by Loxone
      device_class: power
      state_class: measurement
      icon: mdi:dishwasher
      device: &loxone_dishwasher
        identifiers:
          - loxone_dishwasher
        name: "Dishwasher"
        manufacturer: "Loxone"
        suggested_area: "Kitchen"
      value_template: "{{ '' if value | trim == '' else value | float | round(3) }}"

    - name: "Dishwasher Energy"
      unique_id: "loxone_dishwasher_energy"
      state_topic: "loxone/dishwasher/energy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:lightning-bolt
      device: *loxone_dishwasher
      value_template: "{{ '' if value | trim == '' else value | float | round(3) }}"

  binary_sensor:

    - name: "Pool Pump Switch"
      unique_id: "shelly_pool_pump_switch"
      state_topic: "shelly/shellyplusplugs-pool-pump/status/switch:0"
      device_class: power
      expire_after: 120
      device: *shelly_pool_pump
      value_template: "{{ value_json.output | string | lower }}"
      payload_on: "true"
      payload_off: "false"

    - name: "Rain Water Pump Switch"
      unique_id: "shelly_rainwater_pump_switch"
      state_topic: "shelly/shellyplusplugs-rainwaterpump/status/switch:0"
      device_class: power
      expire_after: 120
      device: *shelly_rainwater_pump
      value_template: "{{ value_json.output | string | lower }}"
      payload_on: "true"
      payload_off: "false"

# ──────────────────────────────────────────────────────────────────────────────
# Wallbox abstraction layer — STABLE ENTITY IDS
# The Energy Dashboard references only these function-named wrappers; a source
# swap edits `state:`/`availability:` only. They also supply state_class and
# normalise units from the source's unit_of_measurement.
# Source: go-e Charger (firmware MQTT discovery). Previous source: evcc (removed).
# → doc/energy/notes.md
# ──────────────────────────────────────────────────────────────────────────────
template:
  - sensor:

      # ── Wallbox Power ─────────────────────────────────────────────────────────
      # All-phase charge power (go-e nrg[11]) in W; unavailable, not 0, when the charger is offline.
      - name: "Wallbox Power"
        unique_id: wallbox_power
        state: >
          {% set src = 'sensor.go_echarger_homekopp_power_total' %}
          {% set unit = state_attr(src, 'unit_of_measurement') %}
          {{ ((states(src) | float * 1000) if unit == 'kW'
              else (states(src) | float)) | round(1) }}
        availability: >
          {{ states('sensor.go_echarger_homekopp_power_total')
             not in ['unavailable', 'unknown'] }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:ev-station

      # ── Wallbox Energy ────────────────────────────────────────────────────────
      # Lifetime charged energy (go-e eto, not per session) in kWh; total_increasing absorbs a
      # reset and baselines on the first value. → doc/energy/notes.md
      - name: "Wallbox Energy"
        unique_id: wallbox_energy
        state: >
          {% set src = 'sensor.go_echarger_homekopp_total_energy_charged' %}
          {% set unit = state_attr(src, 'unit_of_measurement') %}
          {{ ((states(src) | float / 1000) if unit == 'Wh'
              else (states(src) | float)) | round(3) }}
        availability: >
          {{ states('sensor.go_echarger_homekopp_total_energy_charged')
             not in ['unavailable', 'unknown'] }}
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:lightning-bolt
