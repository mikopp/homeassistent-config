# ──────────────────────────────────────────────────────────────────────────────
# Victron Energy System
#
# GX c0619ab4c19e: MPPT 279 (DC solar), AC-coupled PV inverter 20, MultiPlus-II 276, BMS.
# Solar and battery are AC-referenced for the Energy Dashboard; power and energy domains each
# close exactly. Grid always uses the signed L1+L2+L3 sum (Austrian billing sums the phases).
# Sign table, formulas, identities: → doc/victron/design.md (VIC-1..VIC-13).
# Hardware quirks, expire_after policy, entity map: → packages/notes/victron.md
# ──────────────────────────────────────────────────────────────────────────────

mqtt:
  sensor:

    # expire_after: fluctuating power 120 s, Multi DC current 600 s, SOC/voltage 24 h, lifetime
    # counters 7 d. The GX publishes on change only; expire_after is also what restores a value
    # after a restart, so never omit it. value_template guards `value_json is defined` (empty
    # payload when a service disappears). → packages/notes/victron.md "expire_after policy"

    # ── MPPT Solar DC (solarcharger 279) ─────────────────────────────────────
    # Raw DC readings of the MPPT (panel output before conversion). The Energy Dashboard's
    # solar IDs (sensor.solar_yield_watts, sensor.victron_solar_yield_total_kwh) carry the
    # AC-referenced values in template: below. → doc/victron/design.md#VIC-12

    # Instantaneous DC power from panels, straight off the MPPT.
    - name: "Victron Solar Yield DC Watts"
      unique_id: "victron_solar_yield_dc_watts"
      # default_entity_id pins the ID; without it HA derives area + device + name, which nothing
      # reads (#126). Only applies when the entity is first created.
      default_entity_id: sensor.victron_solar_yield_dc_watts
      state_topic: "N/c0619ab4c19e/solarcharger/279/Yield/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:solar-power
      device: &victron_device
        identifiers:
          - victron_c0619ab4c19e
        name: "Victron Energy System"
        manufacturer: "Victron Energy"
        model: "Cerbo GX"
        model_id: "BPP010300200"
        configuration_url: "http://venus.local"
        suggested_area: "Electrical"
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    # MPPT lifetime yield counter. Feeds the counter-delta accumulators (not the dashboard).
    - name: "Victron Solar Yield DC Total kWh"
      unique_id: "victron_solar_yield_dc_total_kwh"
      # default_entity_id pins the ID; without it HA derives area + device + name, which nothing
      # reads (#126). Only applies when the entity is first created.
      default_entity_id: sensor.victron_solar_yield_dc_total_kwh
      state_topic: "N/c0619ab4c19e/solarcharger/279/Yield/System"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      # 7 d: constant overnight / on dark days; present so a restart restores the value.
      expire_after: 604800
      icon: mdi:solar-power
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(3) }}{% endif %}"

    # ── AC-coupled PV Inverter (pvinverter 20) ────────────────────────────────
    # Third-party inverter on the AC bus; already AC, never scaled by η.

    - name: "Victron AC Inverter Power"
      unique_id: "victron_ac_inverter_power"
      state_topic: "N/c0619ab4c19e/pvinverter/20/Ac/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:solar-power-variant
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    # AC PV lifetime counter: second solar source of the Energy Dashboard.
    - name: "Victron AC Inverter Energy Total kWh"
      unique_id: "victron_ac_inverter_energy_total_kwh"
      state_topic: "N/c0619ab4c19e/pvinverter/20/Ac/Energy/Forward"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      # 7 d: constant while the inverter sleeps.
      expire_after: 604800
      icon: mdi:solar-power-variant
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(3) }}{% endif %}"

    # ── VEBus / MultiPlus 2 — DC current of the conversion stage (system/0 aggregate) ──
    # The Multi's own DC current: negative = inverting, positive = charging. Real DC, unlike
    # system/0/Dc/Vebus/Power, which follows the AC side and is not used.
    # → packages/notes/victron.md "Dc/Vebus/Power is NOT the Multi's DC power"
    - name: "Victron VEBus DC Current"
      unique_id: "victron_vebus_dc_current"
      # default_entity_id pins the ID the template sensor below reads (else HA derives one).
      default_entity_id: sensor.victron_vebus_dc_current
      state_topic: "N/c0619ab4c19e/system/0/Dc/Vebus/Current"
      unit_of_measurement: "A"
      device_class: current
      state_class: measurement
      # 600 s, not 120: an expired current reads as 0 A downstream and would book the AC load as
      # loss while charging; a flowing current refreshes about every second. Expiry after
      # > 10 min of real 0 A is harmless. → packages/notes/victron.md "expire_after policy"
      expire_after: 600
      icon: mdi:current-dc
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(2) }}{% endif %}"

    # Total DC PV power aggregated across all MPPTs connected to the GX
    - name: "Victron DC PV Total Power"
      unique_id: "victron_dc_pv_total_power"
      state_topic: "N/c0619ab4c19e/system/0/Dc/Pv/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:solar-power
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    # ── Battery (system/0 aggregate) ──────────────────────────────────────────

    # No explicit icon — device_class: battery auto-renders a dynamic level icon
    - name: "Victron Battery SOC"
      unique_id: "victron_battery_soc"
      state_topic: "N/c0619ab4c19e/system/0/Dc/Battery/Soc"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      # 24 h: changes in 0.1 % steps; present so a restart restores the value. Unavailable after
      # 24 h without a change, which is acceptable.
      expire_after: 86400
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(1) }}{% endif %}"

    # DC bus voltage (BMS), second factor of sensor.victron_multiplus_dc_power (≈ 0.04 % off the
    # Multi's terminal voltage). 24 h expire_after like SOC: it can sit unchanged for a while.
    - name: "Victron Battery Voltage"
      unique_id: "victron_battery_voltage"
      default_entity_id: sensor.victron_battery_voltage
      state_topic: "N/c0619ab4c19e/system/0/Dc/Battery/Voltage"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      expire_after: 86400
      icon: mdi:flash-triangle-outline
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(2) }}{% endif %}"

    # ── Grid — 3-phase via MultiPlus AC-in ────────────────────────────────────
    # Per-phase sensors for phase-balance diagnostics.
    # All energy calculations use the combined total (see template section).
    - name: "Victron Grid L1 Power"
      unique_id: "victron_grid_l1_power"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Grid/L1/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:transmission-tower
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    - name: "Victron Grid L2 Power"
      unique_id: "victron_grid_l2_power"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Grid/L2/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:transmission-tower
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    - name: "Victron Grid L3 Power"
      unique_id: "victron_grid_l3_power"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Grid/L3/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:transmission-tower
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    # ── AC Consumption per phase (diagnostic) ─────────────────────────────────
    - name: "Victron AC Load L1"
      unique_id: "victron_ac_load_l1"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Consumption/L1/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:home-lightning-bolt
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    - name: "Victron AC Load L2"
      unique_id: "victron_ac_load_l2"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Consumption/L2/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:home-lightning-bolt
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    - name: "Victron AC Load L3"
      unique_id: "victron_ac_load_l3"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Consumption/L3/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:home-lightning-bolt
      device: *victron_device
      value_template: "{% if value_json is defined and value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"


# ── Grid energy (Riemann-sum integral of grid power, not a fixed-clock sample) ──
# Integrates the import/export half-waves (template: below) on every source change, i.e. at the
# GX's 1-2 s cadence instead of one sample per minute. Energy Dashboard grid source.
# No device_class/state_class: sensor.integration rejects them and sets its own.
# → doc/victron/design.md#VIC-11
sensor:
  - platform: integration
    name: "Victron Grid Energy Import"
    unique_id: victron_grid_energy_import
    source: sensor.victron_grid_power_import
    unit_prefix: k
    method: trapezoidal
    round: 3

  - platform: integration
    name: "Victron Grid Energy Export"
    unique_id: victron_grid_energy_export
    source: sensor.victron_grid_power_export
    unit_prefix: k
    method: trapezoidal
    round: 3


# ── Derived template sensors ───────────────────────────────────────────────────
template:
  - sensor:

      # ── Grid: combined 3-phase (Austrian billing alignment) ───────────────────
      # Sum of all three phases, sign preserved: positive = import, negative = export.
      # This matches exactly how the Netzbetreiber measures in 15-min intervals.
      - name: "Victron Grid Total Power"
        unique_id: victron_grid_total_power
        state: >
          {{ (states('sensor.victron_grid_l1_power') | float(0))
           + (states('sensor.victron_grid_l2_power') | float(0))
           + (states('sensor.victron_grid_l3_power') | float(0)) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.victron_grid_l1_power') not in ['unavailable', 'unknown']
          and states('sensor.victron_grid_l2_power') not in ['unavailable', 'unknown']
          and states('sensor.victron_grid_l3_power') not in ['unavailable', 'unknown'] }}

      # Non-negative import half-wave — source for Riemann sum integration
      - name: "Victron Grid Power Import"
        unique_id: victron_grid_power_import
        state: "{{ [states('sensor.victron_grid_total_power') | float(0), 0] | max }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      # Non-negative export half-wave (absolute value) — source for Riemann sum integration
      - name: "Victron Grid Power Export"
        unique_id: victron_grid_power_export
        state: "{{ [-(states('sensor.victron_grid_total_power') | float(0)), 0] | max }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      # Combined AC house load across all three phases. Guarded: a silently-zero phase would
      # corrupt ac_net, battery_ac_power and η. One of the "GX alive" signals (VIC-10).
      - name: "Victron AC Load Total Power"
        unique_id: victron_ac_load_total_power
        state: >
          {{ (states('sensor.victron_ac_load_l1') | float)
           + (states('sensor.victron_ac_load_l2') | float)
           + (states('sensor.victron_ac_load_l3') | float) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.victron_ac_load_l1') not in ['unavailable', 'unknown']
          and states('sensor.victron_ac_load_l2') not in ['unavailable', 'unknown']
          and states('sensor.victron_ac_load_l3') not in ['unavailable', 'unknown'] }}

      # ── MultiPlus conversion stage, AC side ──────────────────────────────────
      # Net AC power of the MultiPlus, measured: ac_load - grid_net - ac_pv equals
      # vebus Ac/Out - Ac/ActiveIn (no separate grid meter). → doc/victron/design.md#VIC-5
      # Sign: + = inverting, - = charging; OPPOSITE to sensor.victron_multiplus_dc_power.
      - name: "Victron MultiPlus AC Net Power"
        unique_id: victron_multiplus_ac_net_power
        state: >
          {# ac_pv | float(0): the AC PV inverter's MQTT sensor expires (expire_after: 120) when
             it sleeps at night. Expired means "not generating" = 0 W, NOT a GX outage. Making this
             sensor unavailable took battery_ac_power / conversion_loss_power down with it (the
             Energy Dashboard then showed ~0 W power usage) and froze the η ac_out accumulator
             while dc_in kept counting, dragging η down. #}
          {% set ac_load  = states('sensor.victron_ac_load_total_power') | float %}
          {% set grid_net = states('sensor.victron_grid_total_power') | float %}
          {% set ac_pv    = states('sensor.victron_ac_inverter_power') | float(0) %}
          {{ (ac_load - grid_net - ac_pv) | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:sync
        # Load and grid only ("GX alive"); expired PV = 0 W, not an outage (VIC-10).
        availability: >
          {{ states('sensor.victron_ac_load_total_power') not in ['unavailable', 'unknown']
          and states('sensor.victron_grid_total_power') not in ['unavailable', 'unknown'] }}

      # ── MultiPlus conversion stage, DC side ──────────────────────────────────
      # True DC power of the Multi = battery voltage × the Multi's own DC current (not
      # Dc/Battery/Power: that includes other DC loads). → doc/victron/design.md#VIC-8
      # Sign: + = charging, - = inverting; OPPOSITE to victron_multiplus_ac_net_power.
      - name: "Victron MultiPlus DC Power"
        unique_id: victron_multiplus_dc_power
        default_entity_id: sensor.victron_multiplus_dc_power
        state: >
          {# current | float(0): the Multi current is a fluctuating MQTT sensor with
             expire_after: 600 (raised from 120: a non-zero current changes about every second,
             so it only expires when nothing flows or the Multi/service is gone) and the GX does
             not re-publish an unchanged value, so an expired
             current means "no DC current flowing" = 0 A, not an outage. Same reasoning as the
             expired PV sensors in victron_multiplus_ac_net_power. A real GX outage is still caught:
             every consumer pairs this with ac_net_power, which needs ac_load and grid. This
             deliberately deviates from the "no float(default)" rule. #}
          {% set volt = states('sensor.victron_battery_voltage') | float %}
          {% set amps = states('sensor.victron_vebus_dc_current') | float(0) %}
          {{ (volt * amps) | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:lightning-bolt-circle
        # Voltage only (24 h expire_after); expired current = 0 A, see the state comment.
        availability: >
          {{ states('sensor.victron_battery_voltage') not in ['unavailable', 'unknown'] }}

      # ── Inverter efficiency (η) — long-run accumulated ratio ─────────────────
      # η = AC energy out / DC energy in, both accumulated while inverting (trigger block below);
      # energy ratios average out AC/DC sampling skew.
      # NO availability: always a number so solar/battery never go unavailable because of it.
      # 100 % bootstrap while an accumulator is missing or dc_in < 1.0 kWh (also the divide-by-
      # zero guard); otherwise clamped to 50..100 %. → doc/victron/design.md#VIC-7
      - name: "Victron MultiPlus Conversion Efficiency"
        unique_id: victron_multiplus_conversion_efficiency
        state: >
          {% set e_ac = states('sensor.victron_multiplus_ac_out_energy') %}
          {% set e_dc = states('sensor.victron_multiplus_dc_in_energy') %}
          {% if e_ac in ['unavailable', 'unknown']
             or e_dc in ['unavailable', 'unknown']
             or (e_dc | float(0)) < 1.0 %}
            100.0
          {% else %}
            {{ [[ (e_ac | float(0)) / (e_dc | float(0)) * 100, 50.0 ] | max, 100.0 ] | min | round(1) }}
          {% endif %}
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:sine-wave

      # ── Solar Yield Watts: MPPT power in AC watts (solar_ac = dc_pv × η) ─────
      # Energy Dashboard solar power source; entity_id reused for dashboard continuity, so the
      # state is AC-referenced, not the raw MPPT reading (that is victron_solar_yield_dc_watts,
      # read by packages/pergola.yaml). Platform moves need a manual registry reclaim.
      # → doc/victron/design.md#VIC-12
      - name: "Victron Solar Yield AC Watts"
        unique_id: victron_solar_yield
        default_entity_id: sensor.solar_yield_watts
        # No availability: an expired MPPT power at night means 0 W, not a fault, and η is
        # always numeric, so this always renders (VIC-10).
        state: >
          {% set dc_pv = states('sensor.victron_dc_pv_total_power') | float(0) %}
          {% set eta   = (states('sensor.victron_multiplus_conversion_efficiency') | float) / 100 %}
          {{ (dc_pv * eta) | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power

      # ── PV net power / PV surplus (whole-house, AC-referenced) ───────────────
      # net = solar_ac + ac_pv - ac_load (AC side). victron_pv_net_power stays signed, because
      # consumers that add a load back (packages/heating_pv_boost.yaml) need the deficit;
      # victron_pv_surplus_power is the same clamped at 0.
      # Availability on the load side only; a missing PV term is 0 W (VIC-10).
      - name: "Victron PV Net Power"
        unique_id: victron_pv_net_power
        state: >
          {% set solar_ac = states('sensor.solar_yield_watts') | float(0) %}
          {% set ac_pv    = states('sensor.victron_ac_inverter_power') | float(0) %}
          {% set ac_load  = states('sensor.victron_ac_load_total_power') | float %}
          {{ (solar_ac + ac_pv - ac_load) | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        availability: >
          {{ states('sensor.victron_ac_load_l1') not in ['unavailable', 'unknown']
          and states('sensor.victron_ac_load_l2') not in ['unavailable', 'unknown']
          and states('sensor.victron_ac_load_l3') not in ['unavailable', 'unknown']
          and states('sensor.victron_ac_load_total_power') not in ['unavailable', 'unknown'] }}

      - name: "Victron PV Surplus Power"
        unique_id: victron_pv_surplus_power
        state: >
          {{ [states('sensor.victron_pv_net_power') | float, 0] | max }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        availability: >
          {{ states('sensor.victron_pv_net_power') not in ['unavailable', 'unknown'] }}

      # ── Energy Dashboard battery power sensor ────────────────────────────────
      # Sign: + = discharging, - = charging (HA house-centric).
      # batt_ac = mp_ac_net - solar_ac: both terms on the AC side. Identity
      # solar_ac + ac_pv + grid + batt_ac == ac_load holds for ANY η.
      # POWER-domain residual: deliberately not the integral of battery_energy_in/out (energy
      # domain); do not reconcile them. → doc/victron/design.md#VIC-5, #VIC-6
      - name: "Victron Battery AC Power"
        unique_id: victron_battery_ac_power
        state: >
          {% set mp_ac_net = states('sensor.victron_multiplus_ac_net_power') | float %}
          {% set solar_ac  = states('sensor.solar_yield_watts') | float %}
          {{ (mp_ac_net - solar_ac) | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.victron_multiplus_ac_net_power') not in ['unavailable', 'unknown']
          and states('sensor.solar_yield_watts') not in ['unavailable', 'unknown'] }}

      # ── MultiPlus conversion loss ─────────────────────────────────────────────
      # Loss of the AC<->DC stage: opposite signs of mp_ac_net and mp_dc give one formula for
      # both directions, loss = -(mp_ac_net + mp_dc). Clamped >= 0 (independent AC/DC sampling);
      # reads a few W high, diagnostic only. → doc/victron/design.md#VIC-8
      - name: "Victron MultiPlus Conversion Loss Power"
        unique_id: victron_multiplus_conversion_loss_power
        state: >
          {% set mp_ac_net = states('sensor.victron_multiplus_ac_net_power') | float %}
          {% set mp_dc     = states('sensor.victron_multiplus_dc_power') | float %}
          {{ [-(mp_ac_net + mp_dc), 0] | max | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:fire
        availability: >
          {{ states('sensor.victron_multiplus_ac_net_power') not in ['unavailable', 'unknown']
          and states('sensor.victron_multiplus_dc_power') not in ['unavailable', 'unknown'] }}


# ── Energy accumulation (W → kWh, trigger-based) ──────────────────────────────
# Fires every minute and adds power_W / 60000 kWh to the running total.
# State is persisted across HA restarts via unique_id — this.state | float(0) restores the
# last value on startup. Grid energy is not here (sensor: platform: integration above).

  - trigger:
      - platform: time_pattern
        minutes: "/1"
    sensor:
      # ── Inverter efficiency (η) accumulators ─────────────────────────────────
      # Inverting only, ONE shared gate (both available, ac_net > 0, dc < 0):
      #   ac_out += ac_net / 60000,  dc_in += -dc / 60000
      # A skew tick advances neither, so it cannot bias η. The gate is duplicated inline in both
      # templates; keep the two copies identical. → doc/victron/design.md#VIC-7
      - name: "Victron MultiPlus AC Out Energy"
        unique_id: victron_multiplus_ac_out_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {# Gate identical to dc_in_energy below: both sources available, ac_net > 0 and dc < 0.
             float without default is safe: the availability test short-circuits first. #}
          {% set ac = states('sensor.victron_multiplus_ac_net_power') %}
          {% set dc = states('sensor.victron_multiplus_dc_power') %}
          {% set ok = ac not in ['unavailable', 'unknown'] and dc not in ['unavailable', 'unknown']
                      and (ac | float) > 0 and (dc | float) < 0 %}
          {{ ((this.state | float(0)) + ((ac | float / 60000) if ok else 0)) | round(3) }}

      - name: "Victron MultiPlus DC In Energy"
        unique_id: victron_multiplus_dc_in_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {# Gate identical to ac_out_energy above: both sources available, ac_net > 0 and dc < 0. #}
          {% set ac = states('sensor.victron_multiplus_ac_net_power') %}
          {% set dc = states('sensor.victron_multiplus_dc_power') %}
          {% set ok = ac not in ['unavailable', 'unknown'] and dc not in ['unavailable', 'unknown']
                      and (ac | float) > 0 and (dc | float) < 0 %}
          {{ ((this.state | float(0)) + ((-(dc | float) / 60000) if ok else 0)) | round(3) }}

      # ── Solar yield in AC kWh: state += max(counter - baseline, 0) × η ───────
      # Energy Dashboard solar energy source. Accumulates the MPPT counter delta (no sampling
      # drift, no loss over downtime). Entity_id reused for dashboard continuity; its state is
      # an accumulator, NOT the MPPT counter. → packages/notes/victron.md
      # Guards: no baseline yet ('unknown' | float(-1)) adds nothing this tick; a counter reset
      # adds nothing; source unavailable holds and the next tick takes the whole gap.
      # → doc/victron/design.md#VIC-9
      - name: "Victron Solar Yield AC Total kWh"
        unique_id: victron_solar_yield_total_kwh
        default_entity_id: sensor.victron_solar_yield_total_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:solar-power
        state: >
          {% set src  = states('sensor.victron_solar_yield_dc_total_kwh') %}
          {% set prev = states('sensor.victron_solar_yield_dc_baseline_kwh') | float(-1) %}
          {% set cur  = this.state | float(0) %}
          {% set eta  = (states('sensor.victron_multiplus_conversion_efficiency') | float(100)) / 100 %}
          {% if src in ['unavailable', 'unknown'] or prev < 0 %}
            {{ cur | round(3) }}
          {% else %}
            {{ (cur + ([(src | float(0)) - prev, 0] | max) * eta) | round(3) }}
          {% endif %}

      # ── Battery energy accumulators — ENERGY-domain residual ─────────────────
      # Each minute: batt_inc = load_inc - grid_inc - acpv_inc - solar_inc, with the solar and
      # AC PV terms from counter deltas, so the books close exactly in the energy domain.
      # Not reconciled with victron_battery_ac_power (power domain); do not "fix" that.
      # No baseline yet / source unavailable: that term falls back to the power estimate.
      # In and Out share the baseline sensors below. → doc/victron/design.md#VIC-6
      - name: "Victron Battery Energy In"
        unique_id: victron_battery_energy_in
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set mppt_src  = states('sensor.victron_solar_yield_dc_total_kwh') %}
          {% set acpv_src  = states('sensor.victron_ac_inverter_energy_total_kwh') %}
          {% set mppt_prev = states('sensor.victron_solar_yield_dc_baseline_kwh') | float(-1) %}
          {% set acpv_prev = states('sensor.victron_ac_pv_energy_baseline_kwh') | float(-1) %}
          {% set eta       = (states('sensor.victron_multiplus_conversion_efficiency') | float(100)) / 100 %}
          {% set dc_pv     = states('sensor.victron_dc_pv_total_power') | float(0) %}
          {% set ac_pv_w   = states('sensor.victron_ac_inverter_power') | float(0) %}
          {% if mppt_src in ['unavailable', 'unknown'] or mppt_prev < 0 %}
            {% set solar_inc = dc_pv * eta / 60000 %}
          {% else %}
            {% set solar_inc = ([(mppt_src | float(0)) - mppt_prev, 0] | max) * eta %}
          {% endif %}
          {% if acpv_src in ['unavailable', 'unknown'] or acpv_prev < 0 %}
            {% set acpv_inc = ac_pv_w / 60000 %}
          {% else %}
            {% set acpv_inc = [(acpv_src | float(0)) - acpv_prev, 0] | max %}
          {% endif %}
          {% set grid_inc = (states('sensor.victron_grid_total_power') | float(0)) / 60000 %}
          {% set load_inc = (states('sensor.victron_ac_load_total_power') | float(0)) / 60000 %}
          {% set batt_inc = load_inc - grid_inc - acpv_inc - solar_inc %}
          {{ ((this.state | float(0)) + ([-batt_inc, 0] | max)) | round(3) }}

      - name: "Victron Battery Energy Out"
        unique_id: victron_battery_energy_out
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set mppt_src  = states('sensor.victron_solar_yield_dc_total_kwh') %}
          {% set acpv_src  = states('sensor.victron_ac_inverter_energy_total_kwh') %}
          {% set mppt_prev = states('sensor.victron_solar_yield_dc_baseline_kwh') | float(-1) %}
          {% set acpv_prev = states('sensor.victron_ac_pv_energy_baseline_kwh') | float(-1) %}
          {% set eta       = (states('sensor.victron_multiplus_conversion_efficiency') | float(100)) / 100 %}
          {% set dc_pv     = states('sensor.victron_dc_pv_total_power') | float(0) %}
          {% set ac_pv_w   = states('sensor.victron_ac_inverter_power') | float(0) %}
          {% if mppt_src in ['unavailable', 'unknown'] or mppt_prev < 0 %}
            {% set solar_inc = dc_pv * eta / 60000 %}
          {% else %}
            {% set solar_inc = ([(mppt_src | float(0)) - mppt_prev, 0] | max) * eta %}
          {% endif %}
          {% if acpv_src in ['unavailable', 'unknown'] or acpv_prev < 0 %}
            {% set acpv_inc = ac_pv_w / 60000 %}
          {% else %}
            {% set acpv_inc = [(acpv_src | float(0)) - acpv_prev, 0] | max %}
          {% endif %}
          {% set grid_inc = (states('sensor.victron_grid_total_power') | float(0)) / 60000 %}
          {% set load_inc = (states('sensor.victron_ac_load_total_power') | float(0)) / 60000 %}
          {% set batt_inc = load_inc - grid_inc - acpv_inc - solar_inc %}
          {{ ((this.state | float(0)) + ([batt_inc, 0] | max)) | round(3) }}

      # ── Counter-delta baselines (STATE-only, no custom attributes) ───────────
      # Previous tick's lifetime-counter reading for the three accumulators above, as this
      # sensor's own state (no custom attributes). 'unknown' | float(-1) = "no baseline yet".
      # Baselines are declared after their consumers; reordering ⇒ re-run the counter-delta
      # tests (render order within a pass is UNPROVEN). device_class/state_class match the
      # other self-referencing trigger sensors. → doc/victron/design.md#VIC-9
      - name: "Victron Solar Yield DC Baseline kWh"
        unique_id: victron_solar_yield_dc_baseline_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set src = states('sensor.victron_solar_yield_dc_total_kwh') %}
          {{ src if src not in ['unavailable', 'unknown'] else this.state }}

      - name: "Victron AC PV Energy Baseline kWh"
        unique_id: victron_ac_pv_energy_baseline_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set src = states('sensor.victron_ac_inverter_energy_total_kwh') %}
          {{ src if src not in ['unavailable', 'unknown'] else this.state }}

      # Conversion loss energy — the source power is already clamped ≥ 0, so this is monotonic.
      - name: "Victron MultiPlus Conversion Loss Energy"
        unique_id: victron_multiplus_conversion_loss_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ ((this.state | float(0)) + (states('sensor.victron_multiplus_conversion_loss_power') | float(0) / 60000)) | round(3) }}"


# ── Automations ───────────────────────────────────────────────────────────────
# Venus OS keep-alive (dbus-flashmq): the GX publishes only while it gets a keep-alive at
# least every 60 s; any keep-alive without "suppress-republish" (or with a topic list) dumps
# ALL topics. → packages/notes/victron.md "Keep-alive"
automation:

  # Periodic keep-alive — feeds the 60 s timeout WITHOUT re-publishing all topics.
  # "suppress-republish" keeps the bridge awake while normal value-change updates
  # keep flowing, so our sensors stay live without the full-tree dump.
  # Runs every 30 s to stay comfortably inside the 60 s timeout window.
  - alias: "Victron Bridge Keep-alive"
    description: "Keep Venus OS MQTT bridge alive without re-publishing all topics"
    id: victron_keep_alive_30s
    trigger:
      - platform: time_pattern
        seconds: "/30"
    action:
      - service: mqtt.publish
        data:
          topic: "R/c0619ab4c19e/keepalive"
          payload: '{"keepalive-options":["suppress-republish"]}'
    mode: single

  # Initial full publish — an empty keep-alive payload makes the GX publish a
  # one-off snapshot of every current value, so all sensors populate immediately
  # on HA start. After this the periodic suppress-republish keep-alive above
  # holds the bridge open continuously (it never times out mid-session), so the
  # full-tree dump is never requested again.
  - alias: "Victron Bridge Initial Full Publish"
    description: "Request one full topic snapshot on HA start"
    id: victron_keep_alive_full_publish
    trigger:
      # On HA startup, once the MQTT client is up
      - platform: homeassistant
        event: start
    action:
      - service: mqtt.publish
        data:
          topic: "R/c0619ab4c19e/keepalive"
          payload: ""
    mode: single
