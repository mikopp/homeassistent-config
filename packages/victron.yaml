# ──────────────────────────────────────────────────────────────────────────────
# Victron Energy System
#
# Hardware:
#   GX portal      c0619ab4c19e
#   MPPT charger   device 279   (DC-coupled solar panels)
#   PV inverter    device 20    (AC-coupled third-party inverter, measured in AC)
#   VEBus          device 276   (MultiPlus 2, 3-phase)
#   Battery        Smart BMS
#
# Grid billing note (Austria):
#   The Netzbetreiber measures energy in 15-minute intervals using the SUM of
#   all three phases — no per-phase billing. All grid import/export calculations
#   use the combined L1+L2+L3 total to match that billing method exactly.
#
# Energy flow overview:
#   DC bus: MPPT → VEBus (MultiPlus) ↔ Battery
#   AC bus: VEBus output ↔ Grid ↔ AC-coupled PV inverter ↔ Loads
#   VEBus DC power sign: positive = charger mode (AC→DC), negative = inverter mode (DC→AC)
# ──────────────────────────────────────────────────────────────────────────────

mqtt:
  sensor:

    # expire_after policy (see the Venus OS keep-alive automation at the bottom of this file):
    #   The GX keep-alive uses "suppress-republish", so only value-CHANGE updates arrive —
    #   constant topics are no longer periodically re-published.
    #   • Power sensors that fluctuate (grid L1/2/3, AC load L1/2/3, vebus/dc-pv/battery/
    #     ac-inverter power, solar yield W) KEEP expire_after: 120. They never falsely expire,
    #     but still flip unavailable on a real GX outage, so the per-minute energy accumulators
    #     correctly fall back to float(0) and stop integrating a stale value.
    #   • Energy counters (total_increasing) and slow diagnostics (SOC, voltages, current)
    #     OMIT expire_after: they legitimately stay constant for hours, so they retain their
    #     last reading instead of going unavailable. Null payloads are already guarded in each
    #     value_template, and total_increasing tolerates the gap with no reset artifact.

    # ── MPPT Solar DC (solarcharger 279) ─────────────────────────────────────
    # These two are the RAW DC readings straight off the MPPT's own registers — the ground
    # truth for panel output, before any AC conversion. sensor.solar_yield_watts and
    # sensor.victron_solar_yield_total_kwh (the ORIGINAL entity IDs, unique_ids unchanged
    # since before the AC-referenced accounting work) have been REPOINTED below, in the
    # template: section, to instead carry the AC-EQUIVALENT values — see
    # plans/victron-ac-referenced-accounting.md, "Revision: repoint instead of duplicate".
    # That repoint deliberately reuses those two entity IDs so the Energy Dashboard's
    # already-configured source and years of accumulated statistics history keep working
    # unmodified; only the *new* DC-only IDs below (victron_solar_yield_dc_watts /
    # _dc_total_kwh) are fresh entities with no history.

    # Instantaneous DC power from panels, straight off the MPPT.
    - name: "Victron Solar Yield DC Watts"
      unique_id: "victron_solar_yield_dc_watts"
      state_topic: "N/c0619ab4c19e/solarcharger/279/Yield/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:solar-power
      device: &victron_device
        identifiers:
          - victron_c0619ab4c19e
        name: "Victron Energy System"
        manufacturer: "Victron Energy"
        model: "Cerbo GX"
        model_id: "BPP010300200"
        configuration_url: "http://venus.local"
        suggested_area: "Electrical"
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    # Cumulative lifetime yield from the MPPT, straight off its own register — never resets,
    # always increasing. Feeds the counter-delta accounting below; no longer the Energy
    # Dashboard's own source (see the note above).
    - name: "Victron Solar Yield DC Total kWh"
      unique_id: "victron_solar_yield_dc_total_kwh"
      state_topic: "N/c0619ab4c19e/solarcharger/279/Yield/System"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:solar-power
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(3) }}{% endif %}"

    # ── AC-coupled PV Inverter (pvinverter 20) ────────────────────────────────
    # This inverter generates AC power directly — measured on the AC side.

    - name: "Victron AC Inverter Power"
      unique_id: "victron_ac_inverter_power"
      state_topic: "N/c0619ab4c19e/pvinverter/20/Ac/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:solar-power-variant
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    # Cumulative lifetime AC energy — used as the second solar production source
    # in the HA Energy Dashboard (already AC, no conversion needed).
    - name: "Victron AC Inverter Energy Total kWh"
      unique_id: "victron_ac_inverter_energy_total_kwh"
      state_topic: "N/c0619ab4c19e/pvinverter/20/Ac/Energy/Forward"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:solar-power-variant
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(3) }}{% endif %}"

    # ── VEBus / MultiPlus 2 — DC bus conversion flow (system/0 aggregate) ─────
    # Positive = charger mode: AC grid energy flows through MultiPlus to DC bus.
    # Negative = inverter mode: DC bus energy flows through MultiPlus to AC loads.
    # Used to attribute AC output between MPPT and battery sources (see templates).
    - name: "Victron VEBus DC Power"
      unique_id: "victron_vebus_dc_power"
      state_topic: "N/c0619ab4c19e/system/0/Dc/Vebus/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:lightning-bolt-circle
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    # Total DC PV power aggregated across all MPPTs connected to the GX
    - name: "Victron DC PV Total Power"
      unique_id: "victron_dc_pv_total_power"
      state_topic: "N/c0619ab4c19e/system/0/Dc/Pv/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:solar-power
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    # ── Battery (system/0 aggregate) ──────────────────────────────────────────

    # No explicit icon — device_class: battery auto-renders a dynamic level icon
    - name: "Victron Battery SOC"
      unique_id: "victron_battery_soc"
      state_topic: "N/c0619ab4c19e/system/0/Dc/Battery/Soc"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(1) }}{% endif %}"

    # ── Grid — 3-phase via MultiPlus AC-in ────────────────────────────────────
    # Per-phase sensors for phase-balance diagnostics.
    # All energy calculations use the combined total (see template section).
    - name: "Victron Grid L1 Power"
      unique_id: "victron_grid_l1_power"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Grid/L1/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:transmission-tower
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    - name: "Victron Grid L2 Power"
      unique_id: "victron_grid_l2_power"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Grid/L2/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:transmission-tower
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    - name: "Victron Grid L3 Power"
      unique_id: "victron_grid_l3_power"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Grid/L3/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:transmission-tower
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    # ── AC Consumption per phase (diagnostic) ─────────────────────────────────
    - name: "Victron AC Load L1"
      unique_id: "victron_ac_load_l1"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Consumption/L1/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:home-lightning-bolt
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    - name: "Victron AC Load L2"
      unique_id: "victron_ac_load_l2"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Consumption/L2/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:home-lightning-bolt
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"

    - name: "Victron AC Load L3"
      unique_id: "victron_ac_load_l3"
      state_topic: "N/c0619ab4c19e/system/0/Ac/Consumption/L3/Power"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      expire_after: 120
      icon: mdi:home-lightning-bolt
      device: *victron_device
      value_template: "{% if value_json.value is not none %}{{ value_json.value | round(0) }}{% endif %}"


# ── Derived template sensors ───────────────────────────────────────────────────
template:
  - sensor:

      # ── Grid: combined 3-phase (Austrian billing alignment) ───────────────────
      # Sum of all three phases, sign preserved: positive = import, negative = export.
      # This matches exactly how the Netzbetreiber measures in 15-min intervals.
      - name: "Victron Grid Total Power"
        unique_id: victron_grid_total_power
        state: >
          {{ (states('sensor.victron_grid_l1_power') | float(0))
           + (states('sensor.victron_grid_l2_power') | float(0))
           + (states('sensor.victron_grid_l3_power') | float(0)) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.victron_grid_l1_power') not in ['unavailable', 'unknown']
          and states('sensor.victron_grid_l2_power') not in ['unavailable', 'unknown']
          and states('sensor.victron_grid_l3_power') not in ['unavailable', 'unknown'] }}

      # Non-negative import half-wave — source for Riemann sum integration
      - name: "Victron Grid Power Import"
        unique_id: victron_grid_power_import
        state: "{{ [states('sensor.victron_grid_total_power') | float(0), 0] | max }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      # Non-negative export half-wave (absolute value) — source for Riemann sum integration
      - name: "Victron Grid Power Export"
        unique_id: victron_grid_power_export
        state: "{{ [-(states('sensor.victron_grid_total_power') | float(0)), 0] | max }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      # Combined AC house load across all three phases.
      # availability: added because this now also feeds victron_multiplus_ac_net_power below —
      # a silently-zero phase would corrupt that sensor, victron_battery_ac_power and both
      # inverter-efficiency accumulators. Going unavailable is the intended behaviour (see the
      # expire_after policy note at the top of this file): downstream per-minute accumulators
      # then fall back to float(0) and stop integrating instead of integrating a stale value.
      - name: "Victron AC Load Total Power"
        unique_id: victron_ac_load_total_power
        state: >
          {{ (states('sensor.victron_ac_load_l1') | float)
           + (states('sensor.victron_ac_load_l2') | float)
           + (states('sensor.victron_ac_load_l3') | float) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.victron_ac_load_l1') not in ['unavailable', 'unknown']
          and states('sensor.victron_ac_load_l2') not in ['unavailable', 'unknown']
          and states('sensor.victron_ac_load_l3') not in ['unavailable', 'unknown'] }}

      # ── MultiPlus conversion stage, AC side ──────────────────────────────────
      # Net AC power of the MultiPlus itself, measured (not modelled):
      #     mp_ac_net = ac_load - grid_net - ac_pv  ==  vebus Ac/Out - vebus Ac/ActiveIn
      # This identity holds because there is no separate grid meter in this system — grid is
      # measured at the Multi's own AC-in (see victron_grid_l1/l2/l3_power above), and Victron's
      # own system calculation (dbus-systemcalc-py) defines
      #     Ac/Consumption = (grid - vebus ActiveIn + pv_on_grid) + vebus Ac/Out + pv_on_output
      # Substituting and cancelling leaves exactly the expression below — so this sensor equals
      # the Multi's real AC/Out - AC/ActiveIn without needing to subscribe to those raw topics.
      #
      # Sign: POSITIVE = inverting (DC → AC, Multi delivering to the AC bus)
      #       NEGATIVE = charging  (AC → DC, Multi drawing from the AC bus)
      # NOTE this is the OPPOSITE convention to sensor.victron_vebus_dc_power, which is positive
      # when charging. Every consumer of this sensor below accounts for that.
      - name: "Victron MultiPlus AC Net Power"
        unique_id: victron_multiplus_ac_net_power
        state: >
          {% set ac_load  = states('sensor.victron_ac_load_total_power') | float %}
          {% set grid_net = states('sensor.victron_grid_total_power') | float %}
          {% set ac_pv    = states('sensor.victron_ac_inverter_power') | float %}
          {{ (ac_load - grid_net - ac_pv) | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:sync
        availability: >
          {{ states('sensor.victron_ac_load_total_power') not in ['unavailable', 'unknown']
          and states('sensor.victron_grid_total_power') not in ['unavailable', 'unknown']
          and states('sensor.victron_ac_inverter_power') not in ['unavailable', 'unknown'] }}

      # ── Inverter efficiency (η) — long-run accumulated ratio ─────────────────
      # η = (AC energy delivered while inverting) / (DC energy consumed while inverting).
      # Both accumulators live in the time_pattern:/1 trigger block below. Using accumulated
      # ENERGY rather than instantaneous power avoids sample-timing jitter between the AC- and
      # DC-side measurements — over hours the skew averages out and the ratio converges to the
      # true conversion efficiency.
      #
      # Deliberately has NO availability: template — this sensor always returns a number so that
      # solar_ac / battery_ac can never go unavailable because of it:
      #   • either accumulator missing (first minute after a fresh install) → 100 % bootstrap
      #   • E_dc_in < 1.0 kWh (not enough inverting yet to be statistically meaningful, and the
      #     only way the divisor could be zero) → 100 % bootstrap
      #   • otherwise clamp to 50…100 % so a measurement glitch can never produce a negative,
      #     zero, or >100 % efficiency that would corrupt the solar/battery split.
      # At η = 100 % the accounting below degenerates exactly to the pre-existing formula.
      - name: "Victron MultiPlus Conversion Efficiency"
        unique_id: victron_multiplus_conversion_efficiency
        state: >
          {% set e_ac = states('sensor.victron_multiplus_ac_out_energy') %}
          {% set e_dc = states('sensor.victron_multiplus_dc_in_energy') %}
          {% if e_ac in ['unavailable', 'unknown']
             or e_dc in ['unavailable', 'unknown']
             or (e_dc | float(0)) < 1.0 %}
            100.0
          {% else %}
            {{ [[ (e_ac | float(0)) / (e_dc | float(0)) * 100, 50.0 ] | max, 100.0 ] | min | round(1) }}
          {% endif %}
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:sine-wave

      # ── Solar Yield Watts — REPOINTED to AC-equivalent (was raw MQTT DC passthrough) ─────
      # unique_id/entity_id UNCHANGED (victron_solar_yield / sensor.solar_yield_watts) — this
      # is the entity the Energy Dashboard's Solar production POWER source already points at.
      # Reusing the ID rather than adding a new one means no dashboard reconfiguration and no
      # history discontinuity; see plans/victron-ac-referenced-accounting.md, "Revision:
      # repoint instead of duplicate", for the full rationale.
      #
      # DC solar production expressed in AC watts — the quantity the house actually sees after
      # the MultiPlus converts it. Feeds the battery split below. Raw DC watts now live
      # separately at sensor.victron_solar_yield_dc_watts (used by packages/pergola.yaml,
      # which wants true panel output, not an AC-referenced figure).
      #
      # NOTE: `device:` is not supported inside `template:` (see CLAUDE.md), so this entity
      # loses its automatic "Victron Energy System" device grouping the moment it moves from
      # `mqtt:` to here — re-assign it to the device manually in the UI after deploy.
      #
      # unique_id kept identical to the old mqtt sensor's for documentation clarity, but MOVING
      # PLATFORM (mqtt -> template) does NOT automatically preserve entity_id/history by itself —
      # the entity registry key includes the platform. default_entity_id only applies "when the
      # entity is added for the first time" and will lose a naming conflict against the OLD
      # mqtt entry's now-orphaned registry row if that row is not deleted first. See the manual
      # "delete orphan, then rename" deploy steps in plans/victron-ac-referenced-accounting.md —
      # this is NOT a zero-touch restart.
      - name: "Victron Solar Yield AC Watts"
        unique_id: victron_solar_yield
        default_entity_id: sensor.solar_yield_watts
        state: >
          {% set dc_pv = states('sensor.victron_dc_pv_total_power') | float %}
          {% set eta   = (states('sensor.victron_multiplus_conversion_efficiency') | float) / 100 %}
          {{ (dc_pv * eta) | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        availability: >
          {{ states('sensor.victron_dc_pv_total_power') not in ['unavailable', 'unknown'] }}

      # ── Energy Dashboard battery power sensor ────────────────────────────────
      # HA house-centric convention: positive = discharging (battery contributing to home),
      # negative = charging.
      #
      # AC-referenced accounting: batt_ac = mp_ac_net - solar_ac, with solar_ac = dc_pv * η.
      # The previous formula was  ac_load - grid - dc_pv - ac_pv  ==  mp_ac_net - dc_pv, which
      # subtracted a DC watt value from an AC watt quantity — silently charging the entire
      # MultiPlus conversion loss to the battery and overstating solar. Scaling the DC solar term
      # by the measured inverter efficiency puts both terms on the AC side of the MultiPlus.
      #
      # The identity  solar_ac + ac_pv + grid + batt_ac == ac_load  holds exactly for ANY value
      # of η, so this stays algebraically consistent with victron_ac_load_total_power in every
      # operating mode, including during the η = 100 % bootstrap.
      #
      # This is the POWER-domain residual (serves live/history cards). It is deliberately NOT the
      # integral of victron_battery_energy_in/out below, which is its own ENERGY-domain residual
      # reconciled against the MPPT/AC-PV lifetime counters the Energy Dashboard displays — the
      # two domains are kept internally exact but are not required to match each other exactly.
      - name: "Victron Battery AC Power"
        unique_id: victron_battery_ac_power
        state: >
          {% set mp_ac_net = states('sensor.victron_multiplus_ac_net_power') | float %}
          {% set solar_ac  = states('sensor.solar_yield_watts') | float %}
          {{ (mp_ac_net - solar_ac) | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.victron_multiplus_ac_net_power') not in ['unavailable', 'unknown']
          and states('sensor.solar_yield_watts') not in ['unavailable', 'unknown'] }}

      # ── MultiPlus conversion loss ─────────────────────────────────────────────
      # Loss of the AC↔DC conversion stage itself. mp_ac_net and vebus_dc carry OPPOSITE sign
      # conventions, so both directions collapse to one branchless formula:
      #   inverting  (mp_ac_net > 0, vebus_dc < 0):  loss = (-vebus_dc) - mp_ac_net
      #   charging   (mp_ac_net < 0, vebus_dc > 0):  loss = (-mp_ac_net) - vebus_dc
      #                              both equal ->    loss = -(mp_ac_net + vebus_dc)
      #
      # Clamped to ≥ 0: the AC- and DC-side measurements are sampled independently, so during
      # fast load steps the raw difference can go briefly negative.
      - name: "Victron MultiPlus Conversion Loss Power"
        unique_id: victron_multiplus_conversion_loss_power
        state: >
          {% set mp_ac_net = states('sensor.victron_multiplus_ac_net_power') | float %}
          {% set vebus_dc  = states('sensor.victron_vebus_dc_power') | float %}
          {{ [-(mp_ac_net + vebus_dc), 0] | max | round(0) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:fire
        availability: >
          {{ states('sensor.victron_multiplus_ac_net_power') not in ['unavailable', 'unknown']
          and states('sensor.victron_vebus_dc_power') not in ['unavailable', 'unknown'] }}


# ── Energy accumulation (W → kWh, trigger-based) ──────────────────────────────
# Fires every minute and adds power_W / 60000 kWh to the running total.
# Lives in `template:` (not `sensor: platform: integration`) so it initialises
# after all source entities exist. State is persisted across HA restarts via
# unique_id — this.state | float(0) restores the last value on startup.

  - trigger:
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "Victron Grid Energy Import"
        unique_id: victron_grid_energy_import
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ ((this.state | float(0)) + (states('sensor.victron_grid_power_import') | float(0) / 60000)) | round(3) }}"

      - name: "Victron Grid Energy Export"
        unique_id: victron_grid_energy_export
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ ((this.state | float(0)) + (states('sensor.victron_grid_power_export') | float(0) / 60000)) | round(3) }}"

      # ── Inverter efficiency (η) accumulators ─────────────────────────────────
      # Only the INVERTING direction is accumulated (both half-waves clamped at 0):
      #   ac_out += max( mp_ac_net, 0) / 60000   AC delivered by the Multi
      #   dc_in  += max(-vebus_dc,  0) / 60000   DC consumed by the Multi (vebus_dc is negative
      #                                          while inverting — see the sign-convention note
      #                                          on victron_multiplus_ac_net_power above)
      # Charging is excluded on purpose: charge efficiency differs from discharge efficiency, and
      # the solar/battery AC attribution only ever needs the inverting (discharge-side) figure.
      # Their ratio is sensor.victron_multiplus_conversion_efficiency above.
      - name: "Victron MultiPlus AC Out Energy"
        unique_id: victron_multiplus_ac_out_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ ((this.state | float(0)) + ([states('sensor.victron_multiplus_ac_net_power') | float(0), 0] | max / 60000)) | round(3) }}"

      - name: "Victron MultiPlus DC In Energy"
        unique_id: victron_multiplus_dc_in_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ ((this.state | float(0)) + ([-(states('sensor.victron_vebus_dc_power') | float(0)), 0] | max / 60000)) | round(3) }}"

      # ── Solar yield in AC kWh — REPOINTED (was raw MQTT DC passthrough) ──────
      # unique_id/entity_id UNCHANGED (victron_solar_yield_total_kwh /
      # sensor.victron_solar_yield_total_kwh) — this is the entity the Energy Dashboard's Solar
      # production ENERGY source already points at. Reusing the ID means no dashboard
      # reconfiguration and, once the manual entity-registry step in
      # plans/victron-ac-referenced-accounting.md ("Revision: repoint instead of duplicate") is
      # done, no history discontinuity: this.state restores from the last MQTT-driven value and
      # keeps growing from exactly there, just with AC-referenced increments from now on.
      #
      # Accumulated from the DELTA of the MPPT lifetime counter (now at
      # sensor.victron_solar_yield_dc_total_kwh), NOT by integrating power: the counter is the
      # MPPT's own authoritative measurement, so this sensor inherits its accuracy and cannot
      # drift from per-minute sampling error, however the tick rate behaves. Each minute:
      #     delta = victron_solar_yield_dc_total_kwh - victron_solar_yield_dc_baseline_kwh
      #     state = state + max(delta, 0) * eta
      #   (the baseline sensor, defined further below, updates itself to the new reading)
      #
      # Previous baseline lives in sensor.victron_solar_yield_dc_baseline_kwh, NOT a custom
      # `attributes:` key — verified against real HA 2026.8.1 in CI that custom attributes on
      # trigger-based template sensors do not reliably round-trip across ticks (see that
      # sensor's own comment, further below, and plans/victron-ac-referenced-accounting.md).
      # `this.state` self-reference (used here for the running total) IS reliable — proven by
      # the Grid Energy Import/Export accumulators above.
      #
      # Guards:
      #   • first run ever, or baseline sensor still unrendered: baseline state is 'unknown' →
      #     float(-1) sentinel → "no baseline" → this tick only re-baselines and adds nothing, so
      #     the lifetime counter is never mistaken for a one-minute delta. The very next tick
      #     applies the real delta (see the "wait 2 minutes" note in
      #     plans/victron-ac-referenced-accounting.md).
      #   • counter reset or backwards jump: max(delta, 0) adds nothing; the baseline sensor
      #     re-anchors to the new lower value.
      #   • source unavailable: state is held; the baseline sensor also holds its last value, so
      #     no energy is lost — the next successful tick picks up the whole gap in one delta.
      #
      # η lags by up to one minute here (it is derived from the accumulators above, in this same
      # trigger block) — negligible for a long-run ratio that moves <0.01 %/min past bootstrap.
      - name: "Victron Solar Yield AC Total kWh"
        unique_id: victron_solar_yield_total_kwh
        default_entity_id: sensor.victron_solar_yield_total_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:solar-power
        state: >
          {% set src  = states('sensor.victron_solar_yield_dc_total_kwh') %}
          {% set prev = states('sensor.victron_solar_yield_dc_baseline_kwh') | float(-1) %}
          {% set cur  = this.state | float(0) %}
          {% set eta  = (states('sensor.victron_multiplus_conversion_efficiency') | float(100)) / 100 %}
          {% if src in ['unavailable', 'unknown'] or prev < 0 %}
            {{ cur | round(3) }}
          {% else %}
            {{ (cur + ([(src | float(0)) - prev, 0] | max) * eta) | round(3) }}
          {% endif %}

      # ── Battery energy accumulators — ENERGY-domain residual ─────────────────
      # Reconciled against the SAME counter/integration series the Energy Dashboard actually
      # displays for the other three sources, not against the power-domain
      # victron_battery_ac_power above. Each minute:
      #     solar_inc = max(mppt_counter_delta, 0) * eta   # what the dashboard shows for MPPT
      #     acpv_inc  = max(acpv_counter_delta, 0)          # what the dashboard shows for AC PV
      #     grid_inc  = grid_net / 60000                    # what the dashboard shows for grid
      #     load_inc  = ac_load / 60000
      #     batt_inc  = load_inc - grid_inc - acpv_inc - solar_inc
      # so that solar_inc + acpv_inc + grid_inc + (energy_out - energy_in) == load_inc EXACTLY
      # every minute — closing the books in the energy domain the way victron_battery_ac_power
      # already closes them in the power domain. The two domains are each internally exact but
      # are NOT required to match each other (see plans/victron-ac-referenced-accounting.md,
      # "Accepted, deliberate divergence between the domains" — do not "fix" this).
      #
      # BOOTSTRAP FALLBACK: whenever a counter has no baseline yet (brand new sensor, or right
      # after a manual reset), solar_inc/acpv_inc fall back to the POWER-domain estimate
      # (dc_pv*eta/60000, ac_pv/60000) instead of holding at zero. This preserves the pre-existing
      # single-tick accumulation behaviour (no "dead first minute" with a frozen dashboard number)
      # and reduces to today's exact formula while η is still at its 100 % bootstrap. The very
      # next tick — once both counters have a baseline — switches to the true counter-delta
      # residual and stays there permanently; this is a one-time cold-start behaviour, not a
      # steady-state one.
      #
      # Previous counter readings come from sensor.victron_solar_yield_dc_baseline_kwh /
      # sensor.victron_ac_pv_energy_baseline_kwh (defined further below), NOT a custom
      # `attributes:` key on this sensor — verified against real HA 2026.8.1 in CI that custom
      # attributes on trigger-based template sensors do not reliably round-trip across ticks.
      # Both In and Out read the SAME shared baseline sensors (no need for an own copy each —
      # a states() read of another same-block sensor already returns that sensor's PRE-this-tick
      # value here, since the baselines are declared AFTER their consumers; see their comment).
      - name: "Victron Battery Energy In"
        unique_id: victron_battery_energy_in
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set mppt_src  = states('sensor.victron_solar_yield_dc_total_kwh') %}
          {% set acpv_src  = states('sensor.victron_ac_inverter_energy_total_kwh') %}
          {% set mppt_prev = states('sensor.victron_solar_yield_dc_baseline_kwh') | float(-1) %}
          {% set acpv_prev = states('sensor.victron_ac_pv_energy_baseline_kwh') | float(-1) %}
          {% set eta       = (states('sensor.victron_multiplus_conversion_efficiency') | float(100)) / 100 %}
          {% set dc_pv     = states('sensor.victron_dc_pv_total_power') | float(0) %}
          {% set ac_pv_w   = states('sensor.victron_ac_inverter_power') | float(0) %}
          {% if mppt_src in ['unavailable', 'unknown'] or mppt_prev < 0 %}
            {% set solar_inc = dc_pv * eta / 60000 %}
          {% else %}
            {% set solar_inc = ([(mppt_src | float(0)) - mppt_prev, 0] | max) * eta %}
          {% endif %}
          {% if acpv_src in ['unavailable', 'unknown'] or acpv_prev < 0 %}
            {% set acpv_inc = ac_pv_w / 60000 %}
          {% else %}
            {% set acpv_inc = [(acpv_src | float(0)) - acpv_prev, 0] | max %}
          {% endif %}
          {% set grid_inc = (states('sensor.victron_grid_total_power') | float(0)) / 60000 %}
          {% set load_inc = (states('sensor.victron_ac_load_total_power') | float(0)) / 60000 %}
          {% set batt_inc = load_inc - grid_inc - acpv_inc - solar_inc %}
          {{ ((this.state | float(0)) + ([-batt_inc, 0] | max)) | round(3) }}

      - name: "Victron Battery Energy Out"
        unique_id: victron_battery_energy_out
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {% set mppt_src  = states('sensor.victron_solar_yield_dc_total_kwh') %}
          {% set acpv_src  = states('sensor.victron_ac_inverter_energy_total_kwh') %}
          {% set mppt_prev = states('sensor.victron_solar_yield_dc_baseline_kwh') | float(-1) %}
          {% set acpv_prev = states('sensor.victron_ac_pv_energy_baseline_kwh') | float(-1) %}
          {% set eta       = (states('sensor.victron_multiplus_conversion_efficiency') | float(100)) / 100 %}
          {% set dc_pv     = states('sensor.victron_dc_pv_total_power') | float(0) %}
          {% set ac_pv_w   = states('sensor.victron_ac_inverter_power') | float(0) %}
          {% if mppt_src in ['unavailable', 'unknown'] or mppt_prev < 0 %}
            {% set solar_inc = dc_pv * eta / 60000 %}
          {% else %}
            {% set solar_inc = ([(mppt_src | float(0)) - mppt_prev, 0] | max) * eta %}
          {% endif %}
          {% if acpv_src in ['unavailable', 'unknown'] or acpv_prev < 0 %}
            {% set acpv_inc = ac_pv_w / 60000 %}
          {% else %}
            {% set acpv_inc = [(acpv_src | float(0)) - acpv_prev, 0] | max %}
          {% endif %}
          {% set grid_inc = (states('sensor.victron_grid_total_power') | float(0)) / 60000 %}
          {% set load_inc = (states('sensor.victron_ac_load_total_power') | float(0)) / 60000 %}
          {% set batt_inc = load_inc - grid_inc - acpv_inc - solar_inc %}
          {{ ((this.state | float(0)) + ([batt_inc, 0] | max)) | round(3) }}

      # ── Counter-delta baselines (STATE-only, no custom attributes) ───────────
      # Hold the previous tick's lifetime-counter reading for the three accumulators above
      # (Solar Yield AC Total, Battery Energy In, Battery Energy Out), read back via states().
      #
      # An earlier design stashed this baseline in a custom `attributes:` key on each consumer,
      # read back via `this.attributes.get(...)`. CI caught that this does not work: verified
      # against HA 2026.8.1 (this repo's pinned .HA_VERSION) that custom attributes on
      # trigger-based template sensors do not reliably round-trip tick-to-tick — traced to
      # home-assistant/core#172847 (trigger-entity restore-state rework, merged 2026-06-24,
      # weeks before this pinned version) reworking exactly this code path. `this.state`
      # self-reference does NOT have this problem — it is the same mechanism the Grid Energy
      # Import/Export accumulators above already rely on successfully — so the baseline is now
      # a dedicated sensor's own state instead of an attribute. See
      # plans/victron-ac-referenced-accounting.md for the full writeup.
      #
      # Declared AFTER their consumers (Solar Yield AC Total, Battery Energy In/Out) in this
      # same trigger block: sensors within one trigger pass render in declaration order, and an
      # earlier sensor's fresh write IS visible to a later sensor's states() read within that
      # same pass (this is also why η, further above, lags by one tick behind its accumulators).
      # Putting the baselines last means the consumers above see last tick's value here, not one
      # this tick has already advanced.
      #
      # 'unknown' (before this sensor has ever rendered) | float(-1) reproduces the same -1
      # "no baseline yet" sentinel the consumers already guard for.
      - name: "Victron Solar Yield DC Baseline kWh"
        unique_id: victron_solar_yield_dc_baseline_kwh
        unit_of_measurement: "kWh"
        state: >
          {% set src = states('sensor.victron_solar_yield_dc_total_kwh') %}
          {{ src if src not in ['unavailable', 'unknown'] else this.state }}

      - name: "Victron AC PV Energy Baseline kWh"
        unique_id: victron_ac_pv_energy_baseline_kwh
        unit_of_measurement: "kWh"
        state: >
          {% set src = states('sensor.victron_ac_inverter_energy_total_kwh') %}
          {{ src if src not in ['unavailable', 'unknown'] else this.state }}

      # Conversion loss energy — the source power is already clamped ≥ 0, so this is monotonic.
      - name: "Victron MultiPlus Conversion Loss Energy"
        unique_id: victron_multiplus_conversion_loss_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ ((this.state | float(0)) + (states('sensor.victron_multiplus_conversion_loss_power') | float(0) / 60000)) | round(3) }}"


# ── Automations ───────────────────────────────────────────────────────────────
# Venus OS keep-alive (dbus-flashmq, Venus OS 3.x+):
#   The GX only keeps publishing N/<portal>/… topics while it receives a
#   keep-alive on R/<portal>/keepalive at least every 60 s. Two important
#   behaviours of the current (flashmq) broker:
#     1. "Selective" keep-alive (passing a JSON list of topics in the payload)
#        was REMOVED — flashmq ignores the list and instead treats the request
#        as a request to re-publish *everything*.
#     2. Any keep-alive WITHOUT the "suppress-republish" option forces a full
#        snapshot of ALL topics (settings, alarms, every device path, …).
#   Sending a topic-list payload once a minute therefore re-dumped the entire
#   GX topic tree every 60 s — the source of the flood on N/.../settings etc.
automation:

  # Periodic keep-alive — feeds the 60 s timeout WITHOUT re-publishing all topics.
  # "suppress-republish" keeps the bridge awake while normal value-change updates
  # keep flowing, so our sensors stay live without the full-tree dump.
  # Runs every 30 s to stay comfortably inside the 60 s timeout window.
  - alias: "Victron Bridge Keep-alive"
    description: "Keep Venus OS MQTT bridge alive without re-publishing all topics"
    id: victron_keep_alive_30s
    trigger:
      - platform: time_pattern
        seconds: "/30"
    action:
      - service: mqtt.publish
        data:
          topic: "R/c0619ab4c19e/keepalive"
          payload: '{"keepalive-options":["suppress-republish"]}'
    mode: single

  # Initial full publish — an empty keep-alive payload makes the GX publish a
  # one-off snapshot of every current value, so all sensors populate immediately
  # on HA start. After this the periodic suppress-republish keep-alive above
  # holds the bridge open continuously (it never times out mid-session), so the
  # full-tree dump is never requested again.
  - alias: "Victron Bridge Initial Full Publish"
    description: "Request one full topic snapshot on HA start"
    id: victron_keep_alive_full_publish
    trigger:
      # On HA startup, once the MQTT client is up
      - platform: homeassistant
        event: start
    action:
      - service: mqtt.publish
        data:
          topic: "R/c0619ab4c19e/keepalive"
          payload: ""
    mode: single
