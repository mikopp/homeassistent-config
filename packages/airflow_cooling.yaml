# --- FILTER SENSORS ---
# 5-minute time-weighted moving average + throttle per source.
# Template sensors (airflow_min_indoor_dew, airflow_avg_indoor_temp) are NOT excluded
# from recorder because the filter sensors below seed their moving average from history.
sensor:
  # Smooth avg indoor humidity — source is template sensor aggregating all indoor humidity sensors.
  # Defines the shared humidity filter chain (precision 1); reused by the other humidity sensors.
  - platform: filter
    unique_id: airflow_avg_indoor_humidity_5min
    name: "Airflow Avg Indoor Humidity 5min"
    entity_id: sensor.airflow_avg_indoor_humidity
    filters: &humidity_filters
      - filter: time_simple_moving_average
        window_size: "00:05"
        precision: 1
      - filter: time_throttle
        window_size: "00:05"

  # Smooth avg indoor dew point — source is template sensor aggregating all indoor dew sensors.
  # Defines the shared temperature/dew filter chain (precision 2); reused by the other temp/dew sensors.
  - platform: filter
    unique_id: airflow_min_indoor_dew_5min
    name: "Airflow Avg Indoor Dew 5min"
    entity_id: sensor.airflow_min_indoor_dew
    filters: &temperature_filters
      - filter: time_simple_moving_average
        window_size: "00:05"
        precision: 2
      - filter: time_throttle
        window_size: "00:05"

  # Smooth avg indoor temperature — source is template sensor aggregating all indoor temp sensors
  - platform: filter
    unique_id: airflow_avg_indoor_temp_5min
    name: "Airflow Avg Indoor Temp 5min"
    entity_id: sensor.airflow_avg_indoor_temp
    filters: *temperature_filters

  # Smooth outdoor dew point from ComfoConnect
  - platform: filter
    unique_id: airflow_outdoor_dew_5min
    name: "Airflow Outdoor Dew 5min"
    entity_id: sensor.comfoconnect_pro_outdoor_air_dew_point
    filters: *temperature_filters

  # Smooth outdoor temperature from ComfoConnect
  - platform: filter
    unique_id: airflow_outdoor_temp_5min
    name: "Airflow Outdoor Temp 5min"
    entity_id: sensor.comfoconnect_pro_outdoor_air_temperature
    filters: *temperature_filters

  # Smooth weatherstation outdoor temperature — same filter chain as ComfoConnect outdoor temp.
  # Used by airflow_humidity_drying_needed to gate the boost; smoothed to prevent short noise
  # spikes from prematurely starting or stopping a boost run.
  - platform: filter
    unique_id: airflow_wheatherstation_outdoor_temp_5min
    name: "Airflow Weatherstation Outdoor Temp 5min"
    entity_id: sensor.wheatherstation_outdoor_temperature
    filters: *temperature_filters

  # Smooth outdoor humidity from ComfoConnect
  - platform: filter
    unique_id: airflow_outdoor_air_humidity_5min
    name: "Airflow Outdoor Air Humidity 5min"
    entity_id: sensor.comfoconnect_pro_outdoor_air_humidity
    filters: *humidity_filters

  # Smooth supply air temperature from ComfoConnect
  - platform: filter
    unique_id: airflow_supply_air_temp_5min
    name: "Airflow Supply Air Temp 5min"
    entity_id: sensor.comfoconnect_pro_supply_air_temperature
    filters: *temperature_filters

  # Smooth supply air humidity from ComfoConnect
  - platform: filter
    unique_id: airflow_supply_air_humidity_5min
    name: "Airflow Supply Air Humidity 5min"
    entity_id: sensor.comfoconnect_pro_supply_air_humidity
    filters: *humidity_filters

  # Smooth extract air temperature from ComfoConnect
  - platform: filter
    unique_id: airflow_extract_air_temp_5min
    name: "Airflow Extract Air Temp 5min"
    entity_id: sensor.comfoconnect_pro_extract_air_temperature
    filters: *temperature_filters

  # Smooth extract air humidity from ComfoConnect
  - platform: filter
    unique_id: airflow_extract_air_humidity_5min
    name: "Airflow Extract Air Humidity 5min"
    entity_id: sensor.comfoconnect_pro_extract_air_humidity
    filters: *humidity_filters

# --- TEMPLATE SENSORS & BINARY SENSOR ---
template:
  - sensor:
      # Average humidity across all monitored indoor areas; falls back to ComfoConnect extract air when no labeled entities exist
      - unique_id: airflow_avg_indoor_humidity
        name: "Airflow Avg Indoor Humidity"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        state: >
          {% set indoor_hums = label_entities('Indoor.Humidity')
            | map('states') | map('float', none) | reject('none') | list %}
          {% if indoor_hums | count > 0 %}
            {{ (indoor_hums | sum / indoor_hums | count) | round(1) }}
          {% else %}
            {# availability guard above ensures ComfoConnect sensor is live in this fallback branch — no default needed #}
            {{ states('sensor.comfoconnect_pro_extract_air_humidity') | float | round(1) }}
          {% endif %}
        availability: >
          {% set label_count = label_entities('Indoor.Humidity')
             | map('states') | map('float', none) | reject('none') | list | count %}
          {{ label_count > 0 or has_value('sensor.comfoconnect_pro_extract_air_humidity') }}

      # Magnus dew point of the averaged indoor temperature & humidity (then 5-min smoothed by
      # the filter sensor airflow_min_indoor_dew_5min). Derived from airflow_avg_indoor_temp and
      # airflow_avg_indoor_humidity, which already encapsulate per-room averaging with ComfoConnect
      # extract-air fallback. Using dew(mean T, mean RH) rather than mean(dew_i) ensures that
      # 22 °C / 74% always yields ~17.15 °C (Jensen's inequality made mean(dew_i) read low).
      - unique_id: airflow_min_indoor_dew
        name: "Airflow Avg Indoor Dew"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set T  = states('sensor.airflow_avg_indoor_temp') | float %}
          {% set RH = states('sensor.airflow_avg_indoor_humidity') | float %}
          {% set ps = 0.61078 * e ** (17.27 * T / (T + 237.3)) %}
          {% set pv = ps * RH / 100 %}
          {{ (237.3 * (pv / 0.61078) | log / (17.27 - (pv / 0.61078) | log)) | round(2) }}
        availability: >
          {{ has_value('sensor.airflow_avg_indoor_temp') and has_value('sensor.airflow_avg_indoor_humidity') }}

      # Average temperature across all monitored indoor areas; falls back to ComfoConnect extract air temperature when no labeled entities exist
      - unique_id: airflow_avg_indoor_temp
        name: "Airflow Avg Indoor Temp"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set indoor_temps = label_entities('Indoor.Temperature')
            | map('states') | map('float', none) | reject('none') | list %}
          {% if indoor_temps | count > 0 %}
            {{ (indoor_temps | sum / indoor_temps | count) | round(2) }}
          {% else %}
            {# availability guard above ensures ComfoConnect sensor is live in this fallback branch — no default needed #}
            {{ states('sensor.comfoconnect_pro_extract_air_temperature') | float | round(2) }}
          {% endif %}
        availability: >
          {% set label_count = label_entities('Indoor.Temperature')
             | map('states') | map('float', none) | reject('none') | list | count %}
          {{ label_count > 0 or has_value('sensor.comfoconnect_pro_extract_air_temperature') }}

      # Bypass percentage estimated from enthalpy efficiency, expressed in 15% steps.
      # Returns unavailable when the indoor/outdoor enthalpy delta is too small to be meaningful.
      - unique_id: airflow_bypass_estimation
        name: "Airflow Bypass Estimation"
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:valve
        availability: >
          {{ has_value('sensor.airflow_outdoor_temp_5min') and
             has_value('sensor.airflow_outdoor_air_humidity_5min') and
             has_value('sensor.airflow_supply_air_temp_5min') and
             has_value('sensor.airflow_supply_air_humidity_5min') and
             has_value('sensor.airflow_extract_air_temp_5min') and
             has_value('sensor.airflow_extract_air_humidity_5min') }}
        state: >
          {% set T_oa  = states('sensor.airflow_outdoor_temp_5min') | float %}
          {% set RH_oa = states('sensor.airflow_outdoor_air_humidity_5min') | float %}
          {% set T_sa  = states('sensor.airflow_supply_air_temp_5min') | float %}
          {% set RH_sa = states('sensor.airflow_supply_air_humidity_5min') | float %}
          {% set T_ra  = states('sensor.airflow_extract_air_temp_5min') | float %}
          {% set RH_ra = states('sensor.airflow_extract_air_humidity_5min') | float %}
          {% set eta_max = states('input_number.airflow_bypass_efficiency_max') | float %}  {# input_number: never unavailable, no default needed #}
          {% set eta_min = states('input_number.airflow_bypass_efficiency_min') | float %}  {# input_number: never unavailable, no default needed #}
          {# Actual station pressure in kPa; Ecowitt reports hPa so divide by 10. Falls back to standard atmosphere. #}
          {% set P_kpa  = states('sensor.wheatherstation_absolute_pressure') | float(1013.25) / 10 %}
          {# Moist-air enthalpy (kJ/kg) via Magnus saturation pressure + humidity ratio. #}
          {% macro enthalpy(T, RH, P) %}
            {% set ps = 0.61078 * e ** (17.27 * T / (T + 237.3)) %}
            {% set pv = ps * RH / 100 %}
            {% set w  = 0.622 * pv / (P - pv) %}
            {{ 1.006 * T + w * (2501 + 1.86 * T) }}
          {% endmacro %}
          {% set h_oa = enthalpy(T_oa, RH_oa, P_kpa) | float %}
          {% set h_sa = enthalpy(T_sa, RH_sa, P_kpa) | float %}
          {% set h_ra = enthalpy(T_ra, RH_ra, P_kpa) | float %}
          {% if (h_ra - h_oa) | abs < 0.5 %}
            {{ none }}
          {% else %}
            {% set eta   = (h_sa - h_oa) / (h_ra - h_oa) %}
            {% set b_raw = (eta_max - eta) / (eta_max - eta_min) %}
            {% set b_15  = ((b_raw * 100 / 15) | round(0, 'floor') | int) * 15 %}
            {{ [0, [100, b_15] | min] | max }}
          {% endif %}

      # --- DEW POINT THRESHOLDS ---
      # Each humidity helper expressed as the dew point it implies AT the target
      # temperature (Magnus). Centralises the dew-point formula previously inlined
      # in free cooling / low ventilation. NOTE: HA Jinja macros cannot be shared
      # across template entities, so the Magnus block is repeated in each sensor;
      # other logic references THESE sensors instead of re-deriving the formula.
      # Reads only input_numbers (never unavailable) — no availability guard or
      # float() defaults needed, per the "helpers always available" convention.
      - unique_id: airflow_dew_point_min
        name: "Airflow Dew Point Min"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set T  = states('input_number.airflow_cooling_target_temperature') | float %}
          {% set RH = states('input_number.airflow_min_humidity') | float %}
          {% set ps = 0.61078 * e ** (17.27 * T / (T + 237.3)) %}
          {% set pv = ps * RH / 100 %}
          {{ (237.3 * (pv / 0.61078) | log / (17.27 - (pv / 0.61078) | log)) | round(2) }}

      - unique_id: airflow_dew_point_target
        name: "Airflow Dew Point Target"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set T  = states('input_number.airflow_cooling_target_temperature') | float %}
          {% set RH = states('input_number.airflow_target_humidity') | float %}
          {% set ps = 0.61078 * e ** (17.27 * T / (T + 237.3)) %}
          {% set pv = ps * RH / 100 %}
          {{ (237.3 * (pv / 0.61078) | log / (17.27 - (pv / 0.61078) | log)) | round(2) }}

      - unique_id: airflow_dew_point_max
        name: "Airflow Dew Point Max"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {% set T  = states('input_number.airflow_cooling_target_temperature') | float %}
          {% set RH = states('input_number.airflow_max_humidity') | float %}
          {% set ps = 0.61078 * e ** (17.27 * T / (T + 237.3)) %}
          {% set pv = ps * RH / 100 %}
          {{ (237.3 * (pv / 0.61078) | log / (17.27 - (pv / 0.61078) | log)) | round(2) }}

      # THE single decision of the airflow automation (state-based on purpose: it is derived from
      # slow binary indicators, so it must re-evaluate from current inputs and never restore stale —
      # see packages/notes/airflow_cooling.md). Indicators feed ONLY this sensor; every automation
      # that changes the ComfoConnect (controller profile + preset/auto, drying boost) and the
      # climate hvac_action read ONLY this sensor, never the indicators directly.
      #   state       — reason label shown on the dashboard
      #   profile     — attribute: temperature profile to apply (warm / comfort / cool)
      #   ventilation — attribute: rate to apply (boost / medium / low / auto)
      # All three come from ONE macro (custom_templates/airflow_decision.jinja) so they can never
      # disagree; the decision table is documented there. It never reads the outputs (profile,
      # preset, boost switch, climate), so applying a decision cannot change the decision.
      # Recorded in history (intentionally NOT in the recorder.exclude block below).
      - unique_id: airflow_cooling_state
        name: "Airflow Cooling State"
        icon: >
          {% set s = this.state %}
          {% if s == 'off' %}mdi:fan-off
          {% elif s == 'moisture_flush_boost' %}mdi:fan-plus
          {% elif s == 'moisture_protection' %}mdi:fan-minus
          {% elif s == 'heat_protection' %}mdi:sun-thermometer
          {% elif s in ['free_cooling', 'moisture_flush_cooling'] %}mdi:snowflake
          {% elif s in ['heating', 'moisture_retention'] %}mdi:fire
          {% else %}mdi:fan{% endif %}
        # Every input must hold a value: an unavailable decision makes the automations no-op
        # (they require has_value on this sensor) instead of acting on a fail-safe 'off' reading.
        # A reload brings the trigger-based indicators back as 'unknown' only until their own
        # self-trigger / next input change, so this is brief.
        availability: >
          {{ has_value('sensor.heating_cooling_indicator') and
             has_value('binary_sensor.airflow_free_cooling_available') and
             has_value('binary_sensor.airflow_humidity_flush_needed') and
             has_value('binary_sensor.airflow_humidity_drying_needed') and
             has_value('binary_sensor.airflow_moisture_ventilation_low_needed') and
             has_value('binary_sensor.airflow_heat_ventilation_low_needed') and
             has_value('sensor.airflow_min_indoor_dew_5min') and
             has_value('sensor.airflow_dew_point_min') }}
        # this.attributes.profile = previous decision (dry-retention hysteresis memory).
        state: >
          {% from 'airflow_decision.jinja' import airflow_decision %}
          {{ (airflow_decision(this.attributes.get('profile', '')) | string).split('|')[0] }}
        attributes:
          profile: >
            {% from 'airflow_decision.jinja' import airflow_decision %}
            {{ (airflow_decision(this.attributes.get('profile', '')) | string).split('|')[1] }}
          ventilation: >
            {% from 'airflow_decision.jinja' import airflow_decision %}
            {{ (airflow_decision(this.attributes.get('profile', '')) | string).split('|')[2] }}


  # --- Trigger-based binary sensors ---
  # These are trigger-based (not state-based) so their last on/off is RESTORED on YAML reload /
  # HA restart instead of coming up `unknown` for the 10-min delay window. State-based template
  # binary sensors with delay_on/delay_off do not restore across reload: they start `unknown` and
  # the delay timer holds that for the full 10 min before committing. Trigger-based sensors restore
  # immediately, which also preserves this.state hysteresis memory across reloads.
  # Triggers list dependencies explicitly — trigger-based templates do not auto-detect them.

  # True when outdoor air is suitable for free cooling; debounced 10min each way to prevent flip-flop.
  # min_dew_diff and min_temp_diff are user-settable via input_number helpers.
  # Temperature gate is INDOOR-relative: outdoor air only has to be min_temp_diff below the CURRENT
  # room temperature (not below target), so a warm room is cooled with any air cooler than itself —
  # e.g. a 26°C room is free-cooled by 22°C outdoor air even though 22°C is above the 21.5°C target.
  # The room can never be driven below the outdoor temperature, and the room≥target gate below stops
  # cooling once target is reached. A 0.5°C release band on the temp gap damps the flip-flop as the
  # room temperature converges on the outdoor temperature (layered on the 10-min delay).
  # Indoor temperature uses a 0.5°C hysteresis band (Schmitt trigger): turns ON at target_temp,
  # stays ON until indoor temp drops 0.5°C below target. This prevents the feedback loop where
  # the cool profile itself cools the room just enough to disable free cooling and vice versa.
  # Absolute humidity gate: outdoor dew point must not exceed dew_max — the dew point that
  # corresponds to (target_temp, target_hum). Ensures outdoor air warmed to target temperature
  # does not push indoor humidity above target, even when indoor and outdoor dew points rise together.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.airflow_outdoor_dew_5min
          - sensor.airflow_outdoor_temp_5min
          - sensor.airflow_min_indoor_dew_5min
          - sensor.airflow_avg_indoor_temp_5min
          - sensor.airflow_dew_point_target
          - input_number.airflow_cooling_target_temperature
          - input_number.airflow_min_dew_diff
          - input_number.airflow_min_temp_diff
      # No homeassistant:start trigger — a start trigger re-evaluates at boot and restarts
      # the 10-min delay_on/delay_off from unknown, holding the sensor unavailable for 10 min
      # after every restart. Omitting it lets the trigger-based entity RESTORE its last state
      # (and this.state hysteresis memory) instantly; runtime changes still get the debounce.
    binary_sensor:
      - unique_id: airflow_free_cooling_available
        name: "Airflow Free Cooling Available"
        device_class: running
        # Availability guard: all four ComfoConnect filter sensors must be live.
        # Without this, bare | float in state: would silently return 0 on unavailable sensors,
        # producing false free-cooling decisions. input_numbers are always available — no guard needed for those.
        availability: >
          {{ has_value('sensor.airflow_outdoor_dew_5min') and
             has_value('sensor.airflow_outdoor_temp_5min') and
             has_value('sensor.airflow_min_indoor_dew_5min') and
             has_value('sensor.airflow_avg_indoor_temp_5min') and
             has_value('sensor.airflow_dew_point_target') }}
        state: >
          {# Sensors: availability guard above guarantees live values — no defaults needed. #}
          {# input_numbers: never unavailable — no defaults needed. #}
          {% set outdoor_dew     = states('sensor.airflow_outdoor_dew_5min') | float %}
          {% set outdoor_temp    = states('sensor.airflow_outdoor_temp_5min') | float %}
          {% set min_indoor_dew  = states('sensor.airflow_min_indoor_dew_5min') | float %}
          {% set avg_indoor_temp = states('sensor.airflow_avg_indoor_temp_5min') | float %}
          {% set target_temp     = states('input_number.airflow_cooling_target_temperature') | float %}
          {% set min_dew_diff    = states('input_number.airflow_min_dew_diff') | float %}
          {% set min_temp_diff   = states('input_number.airflow_min_temp_diff') | float %}
          {% set temp_threshold  = (target_temp - 0.5) if this.state == 'on' else target_temp %}
          {# Indoor-relative temp gap: outdoor must be min_temp_diff below the CURRENT room temp.
             Release hysteresis: while ON require a 0.5°C smaller gap (clamped at 0) so the sensor
             stays on as the room cools toward the outdoor temperature, damping flip-flop. #}
          {% set temp_diff = [min_temp_diff - 0.5, 0] | max if this.state == 'on' else min_temp_diff %}
          {# Maximum outdoor dew: outdoor air warmed to target_temp must not exceed target_hum. #}
          {# Centralised in sensor.airflow_dew_point_target (Magnus at target_temp, target_hum). #}
          {% set dew_max = states('sensor.airflow_dew_point_target') | float %}
          {{
            (outdoor_dew + min_dew_diff) < min_indoor_dew and
            outdoor_dew <= dew_max and
            outdoor_temp < (avg_indoor_temp - temp_diff) and
            avg_indoor_temp >= temp_threshold
          }}
        delay_on:
          minutes: 10
        delay_off:
          minutes: 10

  # True when ventilation must be reduced to avoid importing humid outdoor air.
  # An indoor-dew Schmitt trigger (turns ON when indoor dew clears the max-derived dew,
  # stays ON until it falls below the target-derived dew) gates the decision — a stable,
  # temperature-independent moisture threshold. The dew condition is the flip side of
  # airflow_free_cooling_available's
  # dew_max gate: incoming air is too humid in absolute terms when outdoor_dew clears a
  # humidity-derived dew point. Dew Schmitt: turns ON at the max-humidity-derived dew point,
  # stays ON until outdoor_dew drops below the target-humidity-derived dew point (both at
  # target_temp, via the same Magnus formula as free cooling). The legacy relative check
  # (outdoor_dew >= indoor_dew) is OR'd as a fallback — it only kicks in when neither
  # humidity-derived boundary is met. Broadly opposite to airflow_free_cooling_available,
  # though the absolute-dew path can overlap when indoor air is drier than incoming air.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.airflow_outdoor_dew_5min
          - sensor.airflow_min_indoor_dew_5min
          - sensor.airflow_dew_point_target
          - sensor.airflow_dew_point_max
          - binary_sensor.airflow_humidity_flush_needed
          - binary_sensor.airflow_humidity_drying_needed
      # Self-trigger on unknown: a YAML reload re-creates this entity as 'unknown' (unlike a full
      # restart, reload does not restore state). This re-evaluates the template the moment that
      # happens, instead of waiting for the next input trigger. Use to: "unknown" (not to: ~, which
      # HA treats as a match-any wildcard); the recomputed result still passes through delay_on/off.
      - trigger: state
        entity_id: binary_sensor.airflow_moisture_ventilation_low_needed
        to: "unknown"
      # No homeassistant:start trigger — restore last state at boot instead of restarting
      # the 10-min delay timers from unknown (same reasoning as flush_needed below).
    binary_sensor:
      - unique_id: airflow_moisture_ventilation_low_needed
        name: "Airflow Moisture Ventilation Low Needed"
        device_class: moisture
        # flush_needed is NOT a has_value gate: the state template reads it only via
        # is_state(..., 'on'), which is False for unknown/unavailable — fail-safe. Gating
        # availability on it would cascade flush_needed's boot-unknown into this sensor.
        availability: >
          {{ has_value('sensor.airflow_outdoor_dew_5min') and
             has_value('sensor.airflow_min_indoor_dew_5min') and
             has_value('sensor.airflow_dew_point_target') and
             has_value('sensor.airflow_dew_point_max') }}
        state: >
          {% set outdoor_dew  = states('sensor.airflow_outdoor_dew_5min') | float %}
          {% set indoor_dew   = states('sensor.airflow_min_indoor_dew_5min') | float %}
          {# Humidity-derived dew points at target_temp, centralised in the dew-point sensors. #}
          {% set dew_from_tgt = states('sensor.airflow_dew_point_target') | float %}
          {% set dew_from_max = states('sensor.airflow_dew_point_max') | float %}
          {# Indoor-moisture Schmitt (was an RH gate): turn ON when measured indoor dew clears the
             max-derived dew, stay ON until it falls below the target-derived dew. #}
          {% set indoor_gate = indoor_dew >= dew_from_tgt if this.state == 'on'
                               else indoor_dew >= dew_from_max %}
          {# Outdoor Schmitt: turn ON above max-derived dew, stay ON until below target-derived dew. #}
          {% set dew_threshold = dew_from_tgt if this.state == 'on' else dew_from_max %}
          {# Mutual exclusivity: low (reduce ventilation) and flush/boost (increase air exchange)
             are opposite actions and must never be ON together. Gate low OFF whenever the cool-profile
             flush or the scheduled drying boost is active. flush_needed already subsumes drying_needed
             (drying ⊂ flush); the drying_needed term is kept explicit for clarity. No cycle: neither
             flush_needed nor drying_needed reads low_needed (the latter's old low_active gate removed). #}
          {{ indoor_gate and (
               outdoor_dew >= dew_threshold or
               outdoor_dew >= indoor_dew
             )
             and not is_state('binary_sensor.airflow_humidity_flush_needed', 'on')
             and not is_state('binary_sensor.airflow_humidity_drying_needed', 'on') }}
        delay_on:
          minutes: 10
        delay_off:
          minutes: 10

  # True when ventilation must be reduced because the REAL outdoor air is too warm to import.
  # Symmetric to airflow_moisture_ventilation_low_needed (the too-humid guard): the direct
  # temperature analog of that sensor's `outdoor_dew >= indoor_dew` term is `outdoor_temp >= indoor`.
  # Uses the WEATHER-STATION outdoor temp (real outdoor), NOT the ComfoConnect intake. The intake
  # runs through a long underground duct that pre-cools it, so it reads cool even on a hot day;
  # raising airflow on that cool reading would pull a larger volume of hot outdoor air through the
  # duct, warming the earth reservoir faster and using up its finite cooling capacity. So when the
  # real outdoor air reaches indoor temperature we force LOW — the duct still delivers useful cool
  # air at the minimum rate, and the ground is not saturated. Indoor-temp Schmitt: turns ON when
  # real outdoor reaches indoor, stays ON until it falls min_temp_diff below indoor (reuses the
  # existing free-cooling margin helper). Mutual exclusivity mirrors the moisture guard: gated OFF
  # while a cool-profile flush or the drying boost is active.
  #
  # DESIGN INTENT — a hot day with acceptable indoor humidity is ALWAYS held at LOW. This is a
  # deliberate goal, not a side effect: on a hot day fresh-air intake must drop to the minimum to
  # avoid importing heat and to protect the ground reservoir. The ONE sanctioned exception is a
  # genuine indoor-moisture problem: a flush requires indoor dew above the TARGET humidity (Branch 2)
  # or above MAX (Branch 1) AND outdoor drier than indoor, so it can only override heat-protect when
  # indoor is actually too moist — and only at MEDIUM (mould/condensation safety outranks sparing the
  # reservoir). A boost (HIGH) can never coincide with heat at all: drying_needed requires
  # weather-station < target, which a hot day fails. So: comfortable indoor humidity + hot outside =>
  # heat-protect holds LOW; too-moist indoor + hot-but-dry outside => a medium flush is allowed.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.airflow_wheatherstation_outdoor_temp_5min
          - sensor.airflow_avg_indoor_temp_5min
          - input_number.airflow_min_temp_diff
          - binary_sensor.airflow_humidity_flush_needed
          - binary_sensor.airflow_humidity_drying_needed
      # Self-trigger on unknown so a YAML reload re-evaluates immediately (same reasoning as the
      # moisture guard above); the recomputed result still passes through delay_on/off.
      - trigger: state
        entity_id: binary_sensor.airflow_heat_ventilation_low_needed
        to: "unknown"
    binary_sensor:
      - unique_id: airflow_heat_ventilation_low_needed
        name: "Airflow Heat Ventilation Low Needed"
        device_class: heat
        availability: >
          {{ has_value('sensor.airflow_wheatherstation_outdoor_temp_5min') and
             has_value('sensor.airflow_avg_indoor_temp_5min') }}
        state: >
          {% set outdoor = states('sensor.airflow_wheatherstation_outdoor_temp_5min') | float %}
          {% set indoor  = states('sensor.airflow_avg_indoor_temp_5min') | float %}
          {% set margin  = states('input_number.airflow_min_temp_diff') | float %}
          {# Schmitt: ON when real outdoor reaches indoor, stays on until it falls min_temp_diff below indoor. #}
          {% set threshold = (indoor - margin) if this.state == 'on' else indoor %}
          {{ outdoor >= threshold
             and not is_state('binary_sensor.airflow_humidity_flush_needed', 'on')
             and not is_state('binary_sensor.airflow_humidity_drying_needed', 'on') }}
        delay_on:
          minutes: 10
        delay_off:
          minutes: 10

  # Combined "reduce ventilation" intent: either protection — outdoor too HUMID or too WARM.
  # Display/history only: the decision (sensor.airflow_cooling_state) reads the two guards
  # separately so it can label heat_protection vs moisture_protection.
  #
  # STATE-BASED (deliberately NOT trigger-based): this is a pure derived OR of two SLOW binary
  # sensors that can sit steady for hours. A trigger-based template RESTORES its last state on HA
  # restart and only recomputes when an input CHANGES — so it could come back STALE (e.g. 'off'
  # while heat_low is 'on') and never recompute, stranding its consumer off the low intent (observed:
  # heat-protection all day but preset stuck at medium because this sensor read 'off'). A plain
  # state-based template re-evaluates continuously from the current inputs and at startup, so it can
  # never go stale. It carries no delay/hysteresis of its own — the two source sensors already do.
  - binary_sensor:
      - unique_id: airflow_ventilation_low_needed
        name: "Airflow Ventilation Low Needed"
        state: >
          {{ is_state('binary_sensor.airflow_moisture_ventilation_low_needed', 'on')
             or is_state('binary_sensor.airflow_heat_ventilation_low_needed', 'on') }}

  # True when conditions favour flushing indoor moisture toward (and below) the
  # max-humidity-derived dew point by opening the cool profile / bypass — even when
  # target humidity is unreachable. Two OR branches, both requiring a real moisture
  # *difference* (outdoor distinctly drier than indoor):
  #   Branch 1 (REAL moisture problem — indoor above MAX): outdoor_dew < dew_max
  #            AND indoor_dew > dew_max AND (outdoor_dew + min_dew_diff) < indoor_dew.
  #            Flushes REGARDLESS of temperature — mould/condensation safety wins.
  #   Branch 2 (no real problem — above TARGET only): outdoor_dew <= dew_target
  #            AND indoor_dew > dew_target AND (outdoor_dew + min_dew_diff) < indoor_dew.
  #            Flushes ONLY when the ComfoConnect temperature gate holds, so a
  #            non-urgent flush never overcools a cool room.
  # ComfoConnect temperature gate (Branch 2 only) = the temperature half of
  # airflow_free_cooling_available: intake temp (airflow_outdoor_temp_5min) below
  # target by min_temp_diff AND indoor temp at/above target (same 0.5°C Schmitt).
  # The weather-station temp is ignored here (it gates the boost only).
  # Season guard: in active_heating only Branch 1 applies (heating-season flushing
  # only relieves dangerously high moisture). ~0.3°C this.state hysteresis on every
  # dew boundary damps the feedback loop where flushing lowers indoor_dew toward the
  # OFF edge; layered on top of the 10-min delay_on/off.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.airflow_outdoor_dew_5min
          - sensor.airflow_min_indoor_dew_5min
          - sensor.airflow_outdoor_temp_5min
          - sensor.airflow_avg_indoor_temp_5min
          - sensor.airflow_dew_point_target
          - sensor.airflow_dew_point_max
          - sensor.heating_cooling_indicator
          - input_number.airflow_cooling_target_temperature
          - input_number.airflow_min_dew_diff
          - input_number.airflow_min_temp_diff
      # Self-trigger on unknown: a YAML reload re-creates this entity as 'unknown' (unlike a full
      # restart, reload does not restore state). This re-evaluates the template the moment that
      # happens, instead of waiting for the next input trigger. Use to: "unknown" (not to: ~, which
      # HA treats as a match-any wildcard); the recomputed result still passes through delay_on/off.
      - trigger: state
        entity_id: binary_sensor.airflow_humidity_flush_needed
        to: "unknown"
      # No homeassistant:start trigger: a start trigger would re-evaluate at boot and
      # restart the 10-min delay_on from unknown, blocking the sensor for 10 min after
      # every restart. Omitting it lets the trigger-based entity RESTORE its last state
      # instantly; runtime state changes still get the 10-min debounce below.
    binary_sensor:
      - unique_id: airflow_humidity_flush_needed
        name: "Airflow Humidity Flush Needed"
        device_class: running
        availability: >
          {{ has_value('sensor.airflow_outdoor_dew_5min') and
             has_value('sensor.airflow_min_indoor_dew_5min') and
             has_value('sensor.airflow_outdoor_temp_5min') and
             has_value('sensor.airflow_avg_indoor_temp_5min') and
             has_value('sensor.airflow_dew_point_target') and
             has_value('sensor.airflow_dew_point_max') and
             has_value('sensor.heating_cooling_indicator') }}
        state: >
          {# Sensors: availability guard above guarantees live values — no defaults needed. #}
          {# input_numbers: never unavailable — no defaults needed. #}
          {% set outdoor_dew     = states('sensor.airflow_outdoor_dew_5min') | float %}
          {% set indoor_dew      = states('sensor.airflow_min_indoor_dew_5min') | float %}
          {% set outdoor_temp    = states('sensor.airflow_outdoor_temp_5min') | float %}
          {% set avg_indoor_temp = states('sensor.airflow_avg_indoor_temp_5min') | float %}
          {% set dew_target      = states('sensor.airflow_dew_point_target') | float %}
          {% set dew_max         = states('sensor.airflow_dew_point_max') | float %}
          {% set target_temp     = states('input_number.airflow_cooling_target_temperature') | float %}
          {% set min_dew_diff    = states('input_number.airflow_min_dew_diff') | float %}
          {% set min_temp_diff   = states('input_number.airflow_min_temp_diff') | float %}
          {% set season          = states('sensor.heating_cooling_indicator') %}
          {# Hysteresis: while ON, relax every dew boundary by 0.3°C to damp the feedback loop. #}
          {% set h = 0.3 if this.state == 'on' else 0.0 %}
          {% set temp_threshold = (target_temp - 0.5) if this.state == 'on' else target_temp %}
          {% set margin_ok = (outdoor_dew + min_dew_diff - h) < indoor_dew %}
          {% set branch1 = outdoor_dew < (dew_max + h) and indoor_dew > (dew_max - h) and margin_ok %}
          {% set branch2 = outdoor_dew <= (dew_target + h) and indoor_dew > (dew_target - h) and margin_ok %}
          {# ComfoConnect temperature gate (intake temp + indoor Schmitt); weather station ignored. #}
          {% set temp_gate = outdoor_temp < (target_temp - min_temp_diff) and avg_indoor_temp >= temp_threshold %}
          {# Branch 1 = moisture problem → flush regardless of temp.
             Branch 2 = no real problem → flush only when the temp guards hold. #}
          {% set branch2_ok = branch2 and temp_gate %}
          {# Season guard: active_heating allows Branch 1 only. #}
          {{ branch1 if season == 'active_heating' else (branch1 or branch2_ok) }}
        delay_on:
          minutes: 10
        delay_off:
          minutes: 10

  # True when the noisy ventilation boost should run to flush moisture. This is the
  # BOOST half of humidity flushing: the cool-profile flush condition
  # (binary_sensor.airflow_humidity_flush_needed) PLUS two boost-only gates:
  #   * weather-station outdoor temp below target (real outdoor, NOT the ComfoConnect intake);
  #   * within the user-configured boost schedule (workday / non-workday).
  # (The former moisture-low guard is gone — low_needed is now mutually exclusive with flush.)
  # The cool-profile flush deliberately ignores the schedule and the weather station —
  # only the boost is schedule- and weather-gated. Schedule selects workday or non-workday
  # window via binary_sensor.workday; non-workday covers weekends and public holidays.
  - trigger:
      - trigger: state
        entity_id:
          - binary_sensor.airflow_humidity_flush_needed
          - sensor.airflow_wheatherstation_outdoor_temp_5min
          - input_number.airflow_cooling_target_temperature
          - binary_sensor.workday
          - schedule.airflow_boost_workday
          - schedule.airflow_boost_non_workday
      # No homeassistant:start trigger — restore last state at boot instead of letting the
      # delay_off hold the sensor unknown for 10 min when it should settle off (same reasoning
      # as the other decision sensors). Runtime off-transitions still get the 10-min debounce.
    binary_sensor:
      - unique_id: airflow_humidity_drying_needed
        name: "Airflow Humidity Drying Needed"
        device_class: running
        state: >
          {# flush sensor carries all dew/temp/season logic + its own hysteresis.
             Defaults fail safe: a missing flush sensor / outdoor temp must not start a boost.
             NOTE: no longer self-gates on moisture_ventilation_low_needed — low_needed is now gated
             OFF whenever flush_needed (and thus drying_needed) is ON, so the old `not low_active`
             guard was redundant AND would have formed a low_needed → drying_needed → low_needed cycle. #}
          {% set flush_needed = is_state('binary_sensor.airflow_humidity_flush_needed', 'on') %}
          {# Use smoothed weatherstation temp to prevent noise spikes from falsely gating the boost. #}
          {% set outdoor_t    = states('sensor.airflow_wheatherstation_outdoor_temp_5min') | float(99) %}
          {% set target_t     = states('input_number.airflow_cooling_target_temperature') | float(21.5) %}
          {% set in_schedule  = (is_state('binary_sensor.workday', 'on')
                                 and is_state('schedule.airflow_boost_workday', 'on'))
                                or
                                (is_state('binary_sensor.workday', 'off')
                                 and is_state('schedule.airflow_boost_non_workday', 'on')) %}
          {% set h = 0.3 if this.state == 'on' else 0.0 %}
          {{
            flush_needed and
            outdoor_t < (target_t + h) and
            in_schedule
          }}


# Intermediate computed binary sensors excluded — not worth archiving
recorder:
  exclude:
    entities:
      #- binary_sensor.airflow_free_cooling_available
      #- binary_sensor.airflow_humidity_flush_needed
      #- binary_sensor.airflow_moisture_ventilation_low_needed
      # airflow_humidity_drying_needed is NOT excluded: it drives the boost and is shown on the
      # airflow-dashboard logbook card — keep its history so the boost activity is observable.
      # Dew-point thresholds: deterministic functions of the humidity helpers — not worth archiving
      - sensor.airflow_dew_point_min
      - sensor.airflow_dew_point_target
      - sensor.airflow_dew_point_max

# --- HELPERS ---
# Enable/disable automatic ventilation profile switching from the UI or other automations
input_boolean:
  airflow_cooling_automatic_enabled:
    name: "Airflow Cooling: Automatic Enabled"
    icon: mdi:fan-auto

# Target temperature is a standard climate property backed by this helper so it persists across restarts
input_number:
  airflow_cooling_target_temperature:
    name: "Airflow Cooling Target Temperature"
    min: 18
    max: 26
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-auto
#    initial: 21.5

  # Minimum dew point margin: outdoor dew must be this many °C below indoor dew for free cooling to activate
  airflow_min_dew_diff:
    name: "Airflow Min Dew Diff"
    min: 0
    max: 5
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:water-thermometer
    mode: box

  # Minimum temperature margin: outdoor temp must be this many °C below target for free cooling to activate
  airflow_min_temp_diff:
    name: "Airflow Min Temp Diff"
    min: 0
    max: 5
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
    mode: box

  # Target indoor humidity — shown as set-point on the climate entity. RH set-points (this and
  # the min/max helpers below) stay the user-tunable source of truth; humidity decisions compare
  # against the dew point each implies at the target temperature (sensor.airflow_dew_point_*),
  # giving fixed thresholds that do not drift with indoor temperature.
  airflow_target_humidity:
    name: "Airflow Target Humidity"
    min: 40
    max: 60
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent

  # Minimum acceptable humidity. Below this (outside cooling season) → warm profile to retain moisture.
  # Free cooling (cool profile) only activates once humidity recovers to target.
  airflow_min_humidity:
    name: "Airflow Min Humidity"
    min: 30
    max: 50
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-minus

  # Maximum acceptable humidity. Above this (with free cooling) → cool profile to flush moisture.
  # Also used as ON-threshold for moisture ventilation low preset (Schmitt trigger: OFF at target).
  airflow_max_humidity:
    name: "Airflow Max Humidity"
    min: 50
    max: 70
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-plus

  # Calibration: expected enthalpy efficiency when bypass is fully closed (maximum heat recovery)
  airflow_bypass_efficiency_max:
    name: "Airflow Bypass Efficiency Max"
    min: 0.50
    max: 1.00
    step: 0.01
    icon: mdi:valve-closed
    mode: box

  # Calibration: residual enthalpy efficiency when bypass is fully open (leakage only)
  airflow_bypass_efficiency_min:
    name: "Airflow Bypass Efficiency Min"
    min: 0.00
    max: 0.30
    step: 0.01
    icon: mdi:valve-open
    mode: box

# --- SCHEDULES ---
# Gate windows for the humidity drying boost automation.
# Workday schedule selected by binary_sensor.workday; non-workday covers weekends and public holidays.
schedule:
  airflow_boost_workday:
    name: "Airflow Boost Workday"
    monday:
      - from: "07:00:00"
        to: "20:30:00"
    tuesday:
      - from: "07:00:00"
        to: "20:30:00"
    wednesday:
      - from: "07:00:00"
        to: "20:30:00"
    thursday:
      - from: "07:00:00"
        to: "20:30:00"
    friday:
      - from: "07:00:00"
        to: "20:30:00"

  airflow_boost_non_workday:
    name: "Airflow Boost Non-Workday"
    monday:
      - from: "09:00:00"
        to: "20:30:00"
    tuesday:
      - from: "09:00:00"
        to: "20:30:00"
    wednesday:
      - from: "09:00:00"
        to: "20:30:00"
    thursday:
      - from: "09:00:00"
        to: "20:30:00"
    friday:
      - from: "09:00:00"
        to: "20:30:00"
    saturday:
      - from: "09:00:00"
        to: "20:30:00"
    sunday:
      - from: "09:00:00"
        to: "20:30:00"

# --- CLIMATE ENTITY ---
# Requires HACS custom component: mikopp/hass-template-climate
# https://github.com/mikopp/hass-template-climate
climate:
  - platform: climate_template
    name: "Airflow Climate"
    unique_id: airflow_climate

    # Standard climate property: current observed temperature (read-only)
    current_temperature_template: >
      {{ states('sensor.airflow_avg_indoor_temp_5min') | float(20) }}

    # Standard climate property: current observed humidity (read-only)
    current_humidity_template: >
      {{ states('sensor.airflow_avg_indoor_humidity_5min') | float(50) }}

    # Standard climate property: user-set target humidity, backed by input_number for persistence.
    # Slider bounds track the min/max humidity helpers so target can't be set outside the band.
    # input_numbers are never unavailable — no float/int defaults needed here.
    target_humidity_template: >
      {{ states('input_number.airflow_target_humidity') | float }}
    min_humidity: 30
    max_humidity: 70

    set_humidity:
      - action: input_number.set_value
        target:
          entity_id: input_number.airflow_target_humidity
        data:
          value: "{{ humidity }}"

    # Standard climate property: user-set target temperature, backed by input_number for persistence
    # input_number: never unavailable — no default needed.
    target_temperature_template: >
      {{ states('input_number.airflow_cooling_target_temperature') | float }}
    min_temp: 18
    max_temp: 26
    temp_step: 0.5

    # Modes:
    #   off       — stop automation, reset profile to comfort (default)
    #   heat      — manual warm profile
    #   heat_cool — manual comfort profile - will in the future also be used for spring times to heat with sun, but don't let it heat up as much as in winter.
    #   cool      — manual cool profile
    #   auto      — automation enabled (profile auto-selected) - uses heating-cooling indicator
    hvac_modes:
      - "off"
      - "heat"
      - "heat_cool"
      - "cool"
      - "auto"
    hvac_mode_template: >
      {% if is_state('input_boolean.airflow_cooling_automatic_enabled', 'on') %}
        auto
      {% elif is_state('select.comfoconnect_pro_temperature_profile', 'warm') %}
        heat
      {% elif is_state('select.comfoconnect_pro_temperature_profile', 'comfort') %}
        heat_cool
      {% elif is_state('select.comfoconnect_pro_temperature_profile', 'cool') %}
        cool
      {% else %}
        off
      {% endif %}
    set_hvac_mode:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ hvac_mode == 'auto' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.airflow_cooling_automatic_enabled
          - conditions:
              - condition: template
                value_template: "{{ hvac_mode == 'off' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.airflow_cooling_automatic_enabled
              - action: select.select_option
                target:
                  entity_id: select.comfoconnect_pro_temperature_profile
                data:
                  option: comfort
          - conditions:
              - condition: template
                value_template: "{{ hvac_mode == 'heat' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.airflow_cooling_automatic_enabled
              - action: select.select_option
                target:
                  entity_id: select.comfoconnect_pro_temperature_profile
                data:
                  option: warm
          - conditions:
              - condition: template
                value_template: "{{ hvac_mode == 'heat_cool' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.airflow_cooling_automatic_enabled
              - action: select.select_option
                target:
                  entity_id: select.comfoconnect_pro_temperature_profile
                data:
                  option: comfort
          - conditions:
              - condition: template
                value_template: "{{ hvac_mode == 'cool' }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.airflow_cooling_automatic_enabled
              - action: select.select_option
                target:
                  entity_id: select.comfoconnect_pro_temperature_profile
                data:
                  option: cool

    # Standard climate property: reflects actual ComfoConnect profile state (read-only).
    # 'drying' = the decision (sensor.airflow_cooling_state) is a moisture flush AND the device is
    # actually on the cool profile. Reads the decision sensor, never the indicators: the stable
    # decision (not the raw boost switch, which drops for seconds on every hardware re-arm) keeps
    # hvac_action from flip-flopping. Otherwise it mirrors the actual profile.
    hvac_action_template: >
      {% set profile = states('select.comfoconnect_pro_temperature_profile') %}
      {% set state   = states('sensor.airflow_cooling_state') %}
      {% if profile == 'cool' and state in ['moisture_flush_boost', 'moisture_flush_cooling'] %}
        drying
      {% elif profile == 'cool' %}
        cooling
      {% elif profile == 'warm' %}
        heating
      {% elif profile == 'comfort' %}
        fan
      {% else %}
        idle
      {% endif %}

    # Standard climate setter: persists new target temperature to input_number
    set_temperature:
      - action: input_number.set_value
        target:
          entity_id: input_number.airflow_cooling_target_temperature
        data:
          value: "{{ temperature }}"

    # Extra attributes: expose related sensors/inputs not covered by standard climate properties
    # requires mikopp/hass-template-climate (fork of jcwillox with attributes support added)
 #   attributes:
 #     outdoor_dew: "{{ states('sensor.airflow_outdoor_dew_5min') | float(none) }}"
 #     outdoor_temp: "{{ states('sensor.airflow_outdoor_temp_5min') | float(none) }}"
 #     indoor_dew: "{{ states('sensor.airflow_min_indoor_dew_5min') | float(none) }}"
 #     free_cooling_available: "{{ is_state('binary_sensor.airflow_free_cooling_available', 'on') }}"
 #     min_dew_diff: "{{ states('input_number.airflow_min_dew_diff') | float(none) }}"
 #     min_temp_diff: "{{ states('input_number.airflow_min_temp_diff') | float(none) }}"
 #     heating_cooling_indicator: "{{ states('sensor.heating_cooling_indicator') }}"
 #     outdoor_temp_48h_mean: "{{ states('sensor.wheatherstation_outdoor_temperature_48h_mean') | float(none) }}"

# --- AUTOMATION ---
automation:
  # UNIFIED VENTILATION CONTROLLER — applies the decision of sensor.airflow_cooling_state to every
  # ComfoConnect output the automation owns: temperature profile (warm/comfort/cool), ventilation
  # preset (low/medium) and auto_mode. It reads ONLY the decision sensor (its `profile` and
  # `ventilation` attributes) — never the indicators (free cooling, flush, low guards, season,
  # indoor dew): those feed the decision sensor, which owns all priority and season rules. The
  # controller adds only hardware/user guards (Away, never cancel a running boost, idempotency).
  # The boost itself is applied by the separate drying-boost automation (same decision sensor).
  #   Section 1 — Temperature profile: runs whenever automatic control is on, even during Away.
  #   Section 2 — Preset / auto_mode: runs only when Away is off (Away owns ventilation level).
  - id: airflow_ventilation_controller
    alias: "Airflow: Ventilation Controller"
    description: >
      Applies sensor.airflow_cooling_state to the ComfoConnect: its `profile` attribute sets the
      temperature profile, its `ventilation` attribute sets preset/auto_mode (low → manual low,
      medium → manual medium over a low schedule, auto/boost → ComfoConnect auto). Idempotent: only
      writes an output when it differs from the decision. Boost is handled separately.
    # queued (not restart): a rapid second trigger must never abort a partial apply mid-sequence
    # (auto_mode off → preset). Each run is short and idempotent, so stacked already-satisfied runs
    # are cheap no-ops.
    mode: queued
    trigger:
      # The decision changed (state or any attribute: a bare entity_id state trigger also fires on
      # attribute-only changes, e.g. heat_protection with profile comfort → cool).
      - platform: state
        entity_id: sensor.airflow_cooling_state
        id: decision_changed
      # The device changed the profile on its own (reconnect / restart reports a stale profile, or a
      # manual change while automatic control is on) → re-assert the decided profile.
      - platform: state
        entity_id: select.comfoconnect_pro_temperature_profile
        not_to:
          - unavailable
          - unknown
        id: profile_changed
      # Schedule flipped auto_mode back on while a manual level is decided → re-assert it
      - platform: state
        entity_id: switch.comfoconnect_pro_auto_mode
        to: "on"
        id: auto_mode_on
      # Schedule dropped the preset to low while medium is decided → re-bump
      - platform: state
        entity_id: select.comfoconnect_pro_ventilation_preset
        to: "low"
        id: preset_set_low
      # Boost ended: re-evaluate preset so medium/auto is correctly asserted. Boost owns 'high';
      # on hardware expiry the preset drops — re-assert the decided level right away.
      - platform: state
        entity_id: switch.comfoconnect_pro_boost
        to: "off"
        id: boost_ended
      # Away ended → re-evaluate preset/auto_mode now that Section 2 may act again
      - platform: state
        entity_id: switch.comfoconnect_pro_away_function
        to: "off"
        id: away_ended
      # Re-evaluate once on startup
      - platform: homeassistant
        event: start
        id: ha_start
    # Guard: skip everything when automatic control is disabled. Away is NOT a top-level condition —
    # the profile (Section 1) must still follow the decision during Away; Section 2 guards Away itself.
    condition:
      - condition: state
        entity_id: input_boolean.airflow_cooling_automatic_enabled
        state: "on"
      # No decision → no action. Non-blocking on purpose (a wait here at the head of this queued
      # automation once piled up startup triggers until "Maximum number of runs exceeded"); the
      # decision sensor's unavailable → value transition re-fires decision_changed.
      - condition: template
        value_template: "{{ has_value('sensor.airflow_cooling_state') }}"
    variables:
      decision: "{{ states('sensor.airflow_cooling_state') }}"
      profile: "{{ state_attr('sensor.airflow_cooling_state', 'profile') }}"
      ventilation: "{{ state_attr('sensor.airflow_cooling_state', 'ventilation') }}"
    action:
      # ===== SECTION 1: TEMPERATURE PROFILE (runs even during Away) =====
      # Write the decided profile when the device differs. The decision is stateless (every reason
      # maps to exactly one profile), so the former stuck-cool / stuck-warm recovery blocks are gone:
      # there is no "keep the current profile" path left to get stuck in.
      - if:
          - condition: template
            value_template: >
              {{ profile in ['warm', 'comfort', 'cool'] and
                 not is_state('select.comfoconnect_pro_temperature_profile', profile) }}
        then:
          - action: select.select_option
            target:
              entity_id: select.comfoconnect_pro_temperature_profile
            data:
              option: "{{ profile }}"
          - action: notify.mobile_app_greywinds_iphone
            data:
              title: >
                {% if decision in ['moisture_flush_boost', 'moisture_flush_cooling'] %}
                  Ventilation: Humidity flushing
                {% elif profile == 'cool' %}
                  Ventilation: Free Cooling
                {% elif profile == 'warm' %}
                  Ventilation: Warm Profile
                {% else %}
                  Ventilation: Comfort Profile
                {% endif %}
              message: >
                {% set dew     = states('sensor.airflow_min_indoor_dew_5min') %}
                {% set dew_min = states('sensor.airflow_dew_point_min') %}
                {% set dew_max = states('sensor.airflow_dew_point_max') %}
                {% set rh      = states('sensor.airflow_avg_indoor_humidity_5min') %}
                {% if decision in ['moisture_flush_boost', 'moisture_flush_cooling'] %}
                  Indoor dew {{ dew }}°C vs max-dew {{ dew_max }}°C
                  (≈{{ rh }}% RH) — profile set to Cool to flush humid air.
                {% elif profile == 'cool' %}
                  Free cooling active — profile set to Cool to bring in cooler outdoor air.
                {% elif decision == 'moisture_retention' %}
                  Indoor dew {{ dew }}°C below min-dew {{ dew_min }}°C
                  (≈{{ rh }}% RH) — profile set to Warm to retain moisture.
                {% elif profile == 'warm' %}
                  Active heating season — profile set to Warm.
                {% else %}
                  No free cooling, flush or heating needed ({{ decision }}) — profile set to Comfort.
                {% endif %}

      # ===== SECTION 2: VENTILATION PRESET / AUTO_MODE (skipped during Away) =====
      # Away owns the ventilation level, so we only touch preset/auto_mode when Away is off.
      # Desired level = the decision's `ventilation` attribute:
      #   boost  → auto_mode ON, no preset write (the drying-boost automation runs the boost)
      #   low    → auto_mode OFF, preset low
      #   medium → auto_mode OFF, preset medium   (only over a schedule holding LOW)
      #   auto   → auto_mode ON  (hand back to ComfoConnect schedule)
      # The decision sensor carries all priority/season rules (flush > protections > free cooling;
      # medium for free cooling only when the cool profile was actually chosen for it — never in
      # active heating). The rate invariants it encodes:
      #   1. Dry-air only: medium is decided for a flush or free cooling, and BOTH require outdoor
      #      drier than indoor (dew margin) — a rate increase never imports humid air.
      #   2. A COOLING increase is guarded on moisture AND real outdoor temp: free-cooling medium is
      #      never decided while moisture-low or heat-low is on (heat_low ON ⇔ real outdoor ≥ indoor).
      #   3. The cool PROFILE is a bypass change guarded on the INTAKE temp, not a rate increase —
      #      so a hot day sits at bypass-open + LOW (heat_protection: profile cool, ventilation low).
      #   The ONE hot-weather increase is a moisture flush (medium, never boost — drying needs the
      #   weather-station temp below target), the deliberate mould-safety exception.
      #
      # Each branch carries an idempotent "needs change" guard, so a notify fires only on a real
      # transition. auto_mode is turned OFF before the preset is written so the schedule can't
      # momentarily override the manual level.
      - if:
          - condition: state
            entity_id: switch.comfoconnect_pro_away_function
            state: "off"
        then:
          - choose:
              # Boost owner: boost delivers HIGH airflow in hardware. TWO actions cancel a running
              # boost — writing ANY preset (low/medium), and turning auto_mode OFF (airflow lingers high
              # a few minutes then reverts to the prior preset). Turning auto_mode ON does NOT cancel it
              # (auto + boost coexist). Detect a boost by the decision (ventilation == boost) OR the
              # switch (a manual boost must not be cancelled either) — never by preset==high (boost
              # merely *reports* high). While a boost is decided/running we only do SAFE things: keep
              # auto_mode ON (turn on if off) and write NO preset.
              # CRUCIAL: this is the FIRST branch, so the `choose` EXITS here for the whole boost-owned
              # window — INCLUDING the brief switch-off during a boost re-arm. That blocks the
              # Low/Medium branches below (which turn auto OFF / write a preset) from ever cancelling
              # a boost.
              - conditions:
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: "{{ ventilation == 'boost' }}"
                      - condition: state
                        entity_id: switch.comfoconnect_pro_boost
                        state: "on"
                sequence:
                  # Only ever turn auto_mode ON (safe; never write a preset, never turn auto off here).
                  - if:
                      - condition: state
                        entity_id: switch.comfoconnect_pro_auto_mode
                        state: "off"
                    then:
                      - action: switch.turn_on
                        target:
                          entity_id: switch.comfoconnect_pro_auto_mode

              # Low: reduce ventilation (outdoor too humid OR too warm). Act unless we are already
              # at (auto off, preset low).
              - conditions:
                  - condition: template
                    value_template: "{{ ventilation == 'low' }}"
                  - condition: template
                    value_template: >
                      {{ not (is_state('switch.comfoconnect_pro_auto_mode', 'off') and
                              is_state('select.comfoconnect_pro_ventilation_preset', 'low')) }}
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: switch.comfoconnect_pro_auto_mode
                  - action: select.select_option
                    target:
                      entity_id: select.comfoconnect_pro_ventilation_preset
                    data:
                      option: "low"
                  - action: notify.mobile_app_greywinds_iphone
                    data:
                      title: "Ventilation: Low Level"
                      message: >
                        {% if decision == 'heat_protection' %}
                          Outdoor air {{ states('sensor.airflow_wheatherstation_outdoor_temp_5min') }}°C
                          at/above indoor {{ states('sensor.airflow_avg_indoor_temp_5min') }}°C —
                          too warm to import; ventilation set to Low to spare the ground reservoir.
                        {% else %}
                          Indoor dew {{ states('sensor.airflow_min_indoor_dew_5min') }}°C above target-dew
                          {{ states('sensor.airflow_dew_point_target') }}°C
                          (≈{{ states('sensor.airflow_avg_indoor_humidity_5min') }}% RH) and outdoor air
                          too humid — ventilation set to Low.
                        {% endif %}

              # Transient route-to-auto: we are in MANUAL LOW (auto off, preset low) and medium is now
              # decided. The medium force is an override of the auto SCHEDULE, so hand control back to
              # auto rather than jump manual-low → manual-medium directly. Turning auto_mode ON re-fires
              # this controller via the auto_mode_on trigger; on that re-run the Medium branch (now
              # auto==on) forces medium with a truthful message. No notify — internal routing step.
              # Boost-gated for symmetry so it never flips auto while boost owns the level.
              - conditions:
                  - condition: state
                    entity_id: switch.comfoconnect_pro_auto_mode
                    state: "off"
                  - condition: state
                    entity_id: select.comfoconnect_pro_ventilation_preset
                    state: "low"
                  - condition: template
                    value_template: "{{ ventilation == 'medium' }}"
                  - condition: state
                    entity_id: switch.comfoconnect_pro_boost
                    state: "off"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.comfoconnect_pro_auto_mode

              # Medium: flush or free cooling decided — more air exchange. Fires ONLY from the auto
              # state (auto_mode on) — it overrides the ComfoConnect schedule; manual low is routed via
              # the route-to-auto branch above. Fires ONLY when the schedule is actively holding the
              # level at LOW (preset==low): auto=on with preset already medium (or high) is the
              # PREFERRED end state and is not re-forced. The boost==off guard is belt-and-suspenders
              # (writing a preset would cancel a boost). On boost expiry the boost_ended trigger
              # re-fires the controller so this branch re-asserts medium without waiting.
              - conditions:
                  - condition: state
                    entity_id: switch.comfoconnect_pro_auto_mode
                    state: "on"
                  - condition: template
                    value_template: "{{ ventilation == 'medium' }}"
                  - condition: state
                    entity_id: switch.comfoconnect_pro_boost
                    state: "off"
                  # Only force medium when the schedule is stuck at LOW; medium/high → leave as-is.
                  - condition: state
                    entity_id: select.comfoconnect_pro_ventilation_preset
                    state: "low"
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: switch.comfoconnect_pro_auto_mode
                  - action: select.select_option
                    target:
                      entity_id: select.comfoconnect_pro_ventilation_preset
                    data:
                      option: "medium"
                  - action: notify.mobile_app_greywinds_iphone
                    data:
                      title: "Ventilation: Medium Preset"
                      message: >
                        {% if decision == 'moisture_flush_cooling' %}
                          Humidity flush active — preset bumped from auto schedule to Medium
                          for faster moisture exchange.
                        {% else %}
                          Free cooling active — preset bumped from auto schedule to Medium
                          for faster air exchange.
                        {% endif %}

              # Restore: auto decided (no flush, protection or free cooling). Hand control back to the
              # ComfoConnect schedule, but only if WE had taken it (auto_mode currently off).
              - conditions:
                  - condition: template
                    value_template: "{{ ventilation == 'auto' }}"
                  - condition: state
                    entity_id: switch.comfoconnect_pro_auto_mode
                    state: "off"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.comfoconnect_pro_auto_mode
                  - action: notify.mobile_app_greywinds_iphone
                    data:
                      title: "Ventilation: Auto Mode Restored"
                      message: >
                        Indoor humidity normalized, free cooling and humidity flush no longer needed
                        — ComfoConnect auto mode restored.

            # No branch matched: desired state already satisfied → no-op (avoids log spam).
            default: []

  # Manages boost when the decision (sensor.airflow_cooling_state, `ventilation` attribute) is
  # boost — i.e. outdoor air is dry enough to flush indoor humidity and the boost schedule allows
  # it. Reads ONLY the decision sensor, never binary_sensor.airflow_humidity_drying_needed directly.
  # The boost switch itself is the only state. A boost is started ONLY on an EDGE into boost, never
  # from a level: (1) the decision going from a real non-boost value to boost, or (2) Away ending
  # while boost is decided and the boost switch is off. A Home Assistant restart, a reload or an
  # input flap (decision unavailable -> boost) is NOT an edge and starts / re-arms nothing, so it
  # can never reset a running 60 min timer. The countdown re-arms a running boost; a boost that was
  # turned off (by the user or otherwise) stays off until the next edge.
  # Residual risk (by decision, no second re-arm threshold): if the single re-arm run (<5 min) is
  # dropped or blocked, the boost lapses and restarts only at the next edge.
  # Disabling input_boolean.airflow_cooling_automatic_enabled makes this automation stop reacting
  # (including the stop branch); a boost that is already running then runs out on the hardware.
  - id: airflow_humidity_drying_boost
    alias: "Airflow: Humidity Drying Boost"
    description: >
      Runs a 60-minute ventilation boost while sensor.airflow_cooling_state decides ventilation
      'boost'. A boost starts only on an edge into boost: the decision changing from a real
      non-boost value to boost, or Away ending while boost is decided and the boost switch is off
      (a decision change also adopts a manual boost that is already running). A Home Assistant
      restart or an unavailable -> boost flap is not an edge and starts nothing. While the boost
      runs and boost is still decided it re-arms SEAMLESSLY ~5 min before the hardware countdown
      expires by re-sending boost ON: the unit restarts its timer with the switch staying on, no
      flip-flop, no notification. A boost that is turned off stays off until the next edge.
      Notifies only on a real state change (boost started / stopped).
    # queued (not single): with single, a trigger arriving while a run was still executing was
    # dropped ("Already running") — a lost boost on/off decision meant a missed boost start/stop.
    # Every branch re-reads current state, so processing queued triggers in order is safe.
    mode: queued
    max: 5
    trigger:
      # Decision entered boost from a REAL non-boost value (the same list the stop branch uses).
      # from: restricts this to a true edge: an unavailable / absent attribute → boost (reload,
      # template entity restart, an input briefly unavailable) does NOT fire, so it can neither
      # silently reset a running boost's 60 min timer nor start a boost without a real edge.
      - platform: state
        entity_id: sensor.airflow_cooling_state
        attribute: ventilation
        from: ["medium", "low", "auto", "off"]
        to: "boost"
        id: boost_decided
      # Decision left boost. An unavailable decision drops the attribute (to: None); the stop
      # branch requires a real non-boost decision, so a reload never stops a running boost.
      - platform: state
        entity_id: sensor.airflow_cooling_state
        attribute: ventilation
        from: "boost"
        id: boost_not_decided
      # Seamless re-arm: number.comfoconnect_pro_boost_time is a LIVE COUNTDOWN of remaining
      # boost minutes. When it drops below 5 (≈5 min before the 60-min run would end) we
      # re-send boost ON while the switch is still ON. Verified on the device: writing the boost
      # coil ON again restarts the timer at the full duration, so the boost never drops and
      # nothing coupled to switch.comfoconnect_pro_boost flips. Fires only while boost runs.
      - platform: numeric_state
        entity_id: number.comfoconnect_pro_boost_time
        below: 5
        id: rearm_due
      # Away ended: a start edge when boost is decided and the boost switch is off (see the
      # (Re)start branch). Away unknown -> off at HA start also counts as this edge (accepted).
      # There is deliberately NO homeassistant:start trigger: a restart is not an edge.
      - platform: state
        entity_id: switch.comfoconnect_pro_away_function
        to: "off"
        id: away_ended
    condition:
      - condition: state
        entity_id: input_boolean.airflow_cooling_automatic_enabled
        state: "on"
      # Only an explicit "on" means away. unknown / unavailable (e.g. ComfoConnect not yet up right
      # after a restart) count as NOT away, so they no longer block every run.
      - condition: template
        value_template: "{{ not is_state('switch.comfoconnect_pro_away_function', 'on') }}"
      # No decision → no action (startup / reload). Non-blocking on purpose — a 5 min wait here held
      # the run slot and starved real triggers. A decision coming back from unavailable is not a
      # start edge (see boost_decided), so nothing is started or reset by it.
      - condition: template
        value_template: "{{ has_value('sensor.airflow_cooling_state') }}"
    action:
      - choose:
          # Seamless re-arm: the countdown reached <5 min while a boost is running and boost is
          # still decided. Re-send boost ON: the unit restarts its timer at the full duration while
          # the switch stays on (writing boost_time instead is ignored by the device), so nothing
          # reading switch.comfoconnect_pro_boost (the controller's boost owner guard and its
          # boost_ended trigger) flips. No notify: silent internal step, state is unchanged.
          # Guarded on boost == on so it can never (re)start a stopped boost.
          - conditions:
              - condition: trigger
                id: rearm_due
              - condition: state
                entity_id: sensor.airflow_cooling_state
                attribute: ventilation
                state: "boost"
              - condition: state
                entity_id: switch.comfoconnect_pro_boost
                state: "on"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.comfoconnect_pro_boost

          # (Re)start boost, only on an EDGE into boost while boost is decided:
          #  - boost_decided: the decision changed from a real non-boost value to boost. Writes boost
          #    ON even if a boost already runs (restarts its timer, adopts a manual boost).
          #  - away_ended: Away ended; starts only when the boost switch is off, so it never
          #    touches a running boost's timer.
          # A Home Assistant restart is not an edge and starts nothing; a boost the user stopped by
          # hand stays off until the next edge.
          - conditions:
              - condition: state
                entity_id: sensor.airflow_cooling_state
                attribute: ventilation
                state: "boost"
              - condition: or
                conditions:
                  - condition: trigger
                    id: boost_decided
                  - condition: and
                    conditions:
                      - condition: trigger
                        id: away_ended
                      - condition: state
                        entity_id: switch.comfoconnect_pro_boost
                        state: "off"
            sequence:
              # Captured before the writes: a restart of a running boost is not a state change.
              - variables:
                  boost_was_on: "{{ is_state('switch.comfoconnect_pro_boost', 'on') }}"
              # 60-minute hardware boost; re-armed (boost ON re-sent) before expiry, see rearm_due branch.
              - action: number.set_value
                target:
                  entity_id: number.comfoconnect_pro_boost_time
                data:
                  value: 60
              - action: switch.turn_on
                target:
                  entity_id: switch.comfoconnect_pro_boost
              - if:
                  - condition: template
                    value_template: "{{ not boost_was_on }}"
                then:
                  - action: notify.mobile_app_greywinds_iphone
                    data:
                      title: "Ventilation: Humidity Drying Boost"
                      message: >
                        Indoor humidity {{ states('sensor.airflow_avg_indoor_humidity_5min') }}%
                        (dew {{ states('sensor.airflow_min_indoor_dew_5min') }}°C)
                        — boost started to flush humid air via free cooling.

          # Disable boost: the decision left boost for a real non-boost level (not an unavailable
          # decision). Only acts on a running boost, so a boost the user already turned off produces
          # no "stopped" notification.
          - conditions:
              - condition: trigger
                id: boost_not_decided
              - condition: template
                value_template: >
                  {{ state_attr('sensor.airflow_cooling_state', 'ventilation')
                     in ['medium', 'low', 'auto', 'off'] }}
              - condition: state
                entity_id: switch.comfoconnect_pro_boost
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.comfoconnect_pro_boost
              - action: notify.mobile_app_greywinds_iphone
                data:
                  title: "Ventilation: Drying Boost Stopped"
                  message: "Humidity drying conditions no longer met — boost stopped."

        # No branch matched: desired state already satisfied (e.g. a manual boost reaching the
        # countdown threshold while boost is not decided) → no-op (avoids log spam).
        default: []

# --- GROUP ---
# All entities belonging to the airflow feature
group:
  airflow_cooling:
    name: "Airflow Cooling"
    entities:
      # Filter sensors (smoothed inputs)
      - sensor.airflow_min_indoor_dew_5min
      - sensor.airflow_avg_indoor_temp_5min
      - sensor.airflow_outdoor_dew_5min
      - sensor.airflow_outdoor_temp_5min
      - sensor.airflow_wheatherstation_outdoor_temp_5min
      - sensor.airflow_outdoor_air_humidity_5min
      - sensor.airflow_supply_air_temp_5min
      - sensor.airflow_supply_air_humidity_5min
      - sensor.airflow_extract_air_temp_5min
      - sensor.airflow_extract_air_humidity_5min
      # Template sensors (raw aggregates + bypass)
      - sensor.airflow_min_indoor_dew
      - sensor.airflow_avg_indoor_temp
      - sensor.airflow_bypass_estimation
      # Dew-point thresholds (humidity helpers expressed as dew @ target temp)
      - sensor.airflow_dew_point_min
      - sensor.airflow_dew_point_target
      - sensor.airflow_dew_point_max
      # Read-only automation status (reason-based)
      - sensor.airflow_cooling_state
      # Binary sensor (free cooling decision)
      - binary_sensor.airflow_free_cooling_available
      # Binary sensor (humidity flush decision — drives cool profile)
      - binary_sensor.airflow_humidity_flush_needed
      # Helpers
      - input_boolean.airflow_cooling_automatic_enabled
      - input_number.airflow_cooling_target_temperature
      - input_number.airflow_min_dew_diff
      - input_number.airflow_min_temp_diff
      - input_number.airflow_bypass_efficiency_max
      - input_number.airflow_bypass_efficiency_min
      # Climate entity + humidity sensors
      - climate.airflow_climate
      - sensor.airflow_avg_indoor_humidity
      - sensor.airflow_avg_indoor_humidity_5min
      # Humidity helpers + binary sensors
      - input_number.airflow_target_humidity
      - input_number.airflow_min_humidity
      - input_number.airflow_max_humidity
      - binary_sensor.airflow_moisture_ventilation_low_needed
      - binary_sensor.airflow_heat_ventilation_low_needed
      - binary_sensor.airflow_ventilation_low_needed
      # Drying boost
      - binary_sensor.airflow_humidity_drying_needed
      - schedule.airflow_boost_workday
      - schedule.airflow_boost_non_workday
      - switch.comfoconnect_pro_boost
      - number.comfoconnect_pro_boost_time
      # Automations
      - automation.airflow_ventilation_controller
      - automation.airflow_humidity_drying_boost
